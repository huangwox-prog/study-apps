<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1f0ec">
<title>CLEAR リーグ戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="バドミントン部のリーグ戦メーカー。選手と学校を入れると、ランクの近い選手で A・B・C… のリーグに分け、総当たりの対戦表・星取表・順位を自動で作ります。">
<style>
/* =====================================================================
   CLEAR — バドミントンのリーグ戦・トーナメント作り。名前は高い弧を描くショット「クリア」から。
   見た目は数学Iアプリ「ARCA」のデザイン言語(紙と墨・オーロラ・弧)を借りている
   かたち … すべて「弧」から。シャトルの軌道も弧。カードは左下だけ大きく開く。
   いろ   … 紙(warm paper)と墨(ink)の地に、オーロラ(群青→菫→翠)だけ。
            リーグ色はオーロラの3点を A・B・C… に順に割り当てる。
   レイアウト … 上に大会の墨カード、下にタブで「選手 → リーグ分け → 試合と結果 → 順位一覧」。
   ===================================================================== */
:root {
  --bg: #f1f0ec;
  --bg-deep: #e7e5df;
  --ink: #08090d;
  --surface: rgba(255, 255, 255, 0.86);
  --surface-strong: #ffffff;
  --surface-soft: rgba(9, 10, 14, 0.035);
  --text: #0b0c11;
  --text-secondary: #4a4c54;
  /* 補足の文字(学校名・見出し・説明)。紙の上で 4.5:1 以上になる濃さ */
  --text-tertiary: #656771;
  --border: rgba(9, 10, 14, 0.14);
  --border-soft: rgba(9, 10, 14, 0.09);
  --highlight: rgba(255, 255, 255, 0.9);
  --hairline: rgba(9, 10, 14, 0.1);

  --arc-1: #2f4cf0;
  --arc-2: #8134ea;
  --arc-3: #08967e;
  --arc-1-soft: rgba(47, 76, 240, 0.1);
  --arc-2-soft: rgba(129, 52, 234, 0.1);
  --arc-3-soft: rgba(8, 150, 126, 0.11);
  --aurora: linear-gradient(115deg, var(--arc-1), var(--arc-2) 52%, var(--arc-3));

  --accent: #2f4cf0;
  --accent-hover: #2740d6;
  --accent-soft: rgba(47, 76, 240, 0.1);
  --accent-glow: rgba(47, 76, 240, 0.34);
  --accent-text: #ffffff;

  --lg-a: #2f4cf0; --lg-b: #8134ea; --lg-c: #057562; --lg-d: #c2410c;
  --lg-e: #c2255c; --lg-f: #8f6400; --lg-g: #0b7285; --lg-h: #5f6470;
  --on-lg: #ffffff;

  --success: #186a46;
  --success-soft: rgba(31, 125, 85, 0.12);
  --warn: #8a5c12;
  --warn-soft: rgba(154, 106, 31, 0.13);
  --error: #b23b3b;
  --error-soft: rgba(178, 59, 59, 0.11);

  /* 墨カードの中だけで使う色(テーマに関係なく墨の上) */
  --ink-text: #f4f4f6;
  --ink-text-2: #a9abb4;
  --ink-text-3: #9799a3;
  --ink-line: rgba(255, 255, 255, 0.14);
  --ink-surface: rgba(255, 255, 255, 0.07);
  --ink-border: rgba(255, 255, 255, 0.12);

  --radius-sm: 14px;
  --radius: 22px;
  --radius-lg: 34px;
  --arc-corner: 52px;

  --shadow-sm: 0 1px 2px rgba(8, 9, 13, 0.06);
  --shadow: 0 18px 40px -26px rgba(8, 9, 13, 0.5);

  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-press: cubic-bezier(0.32, 0.72, 0.4, 1);
  --ease-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  --dur-fast: 0.2s;
  --dur: 0.45s;

  --font: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial,
    "Segoe UI", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Yu Gothic",
    "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;

  --scroll: 0;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #08090d; --bg-deep: #05060a;
    --surface: rgba(255, 255, 255, 0.055); --surface-strong: rgba(255, 255, 255, 0.09); --surface-soft: rgba(255, 255, 255, 0.045);
    --text: #f4f4f6; --text-secondary: #b6b8c1; --text-tertiary: #9a9ca6;
    --border: rgba(255, 255, 255, 0.16); --border-soft: rgba(255, 255, 255, 0.1);
    --highlight: rgba(255, 255, 255, 0.12); --hairline: rgba(255, 255, 255, 0.12);
    --arc-1: #6c85ff; --arc-2: #b077ff; --arc-3: #2ad9b8;
    --arc-1-soft: rgba(108, 133, 255, 0.16); --arc-2-soft: rgba(176, 119, 255, 0.16); --arc-3-soft: rgba(42, 217, 184, 0.15);
    --accent: #8399ff; --accent-hover: #97aaff; --accent-soft: rgba(108, 133, 255, 0.16); --accent-glow: rgba(108, 133, 255, 0.45); --accent-text: #06070b;
    --success: #52d69a; --success-soft: rgba(63, 201, 138, 0.15);
    --warn: #e0a54a; --warn-soft: rgba(224, 165, 74, 0.15);
    --error: #ff6f6b; --error-soft: rgba(255, 111, 107, 0.14);
    --ink: #111319;
    --lg-a: #6c85ff; --lg-b: #b077ff; --lg-c: #2ad9b8; --lg-d: #ff8c42;
    --lg-e: #ff6b9d; --lg-f: #e0b341; --lg-g: #3bc9db; --lg-h: #a7a9b3;
    --on-lg: #08090d;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5); --shadow: 0 20px 46px -28px rgba(0, 0, 0, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #08090d; --bg-deep: #05060a;
  --surface: rgba(255, 255, 255, 0.055); --surface-strong: rgba(255, 255, 255, 0.09); --surface-soft: rgba(255, 255, 255, 0.045);
  --text: #f4f4f6; --text-secondary: #b6b8c1; --text-tertiary: #9a9ca6;
  --border: rgba(255, 255, 255, 0.16); --border-soft: rgba(255, 255, 255, 0.1);
  --highlight: rgba(255, 255, 255, 0.12); --hairline: rgba(255, 255, 255, 0.12);
  --arc-1: #6c85ff; --arc-2: #b077ff; --arc-3: #2ad9b8;
  --arc-1-soft: rgba(108, 133, 255, 0.16); --arc-2-soft: rgba(176, 119, 255, 0.16); --arc-3-soft: rgba(42, 217, 184, 0.15);
  --accent: #8399ff; --accent-hover: #97aaff; --accent-soft: rgba(108, 133, 255, 0.16); --accent-glow: rgba(108, 133, 255, 0.45); --accent-text: #06070b;
  --success: #52d69a; --success-soft: rgba(63, 201, 138, 0.15);
  --warn: #e0a54a; --warn-soft: rgba(224, 165, 74, 0.15);
  --error: #ff6f6b; --error-soft: rgba(255, 111, 107, 0.14);
  --ink: #111319;
  --lg-a: #6c85ff; --lg-b: #b077ff; --lg-c: #2ad9b8; --lg-d: #ff8c42;
  --lg-e: #ff6b9d; --lg-f: #e0b341; --lg-g: #3bc9db; --lg-h: #a7a9b3;
  --on-lg: #08090d;
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5); --shadow: 0 20px 46px -28px rgba(0, 0, 0, 0.9);
  color-scheme: dark;
}

/* リーグ色:A〜H にそれぞれ別の色。オーロラの3点(A・B・C)から始めて、見分けやすい色を足す */
.lg-0 { --lg: var(--lg-a); } .lg-1 { --lg: var(--lg-b); } .lg-2 { --lg: var(--lg-c); } .lg-3 { --lg: var(--lg-d); }
.lg-4 { --lg: var(--lg-e); } .lg-5 { --lg: var(--lg-f); } .lg-6 { --lg: var(--lg-g); } .lg-7 { --lg: var(--lg-h); }
[class*="lg-"] { --lg-soft: color-mix(in srgb, var(--lg) 13%, transparent); }

* { box-sizing: border-box; }
html { font-size: 16px; }
body {
  margin: 0;
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  overflow-x: hidden;
}
/* 上のセーフエリアの帯 */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--bg);
}
/* 背景:オーロラのにじみと、大きな弧のリング */
.bg-glow {
  position: fixed; inset: -30vmax; z-index: -2; pointer-events: none;
  background:
    radial-gradient(38vmax 38vmax at 18% 12%, var(--arc-1-soft), transparent 62%),
    radial-gradient(34vmax 34vmax at 84% 26%, var(--arc-2-soft), transparent 60%),
    radial-gradient(40vmax 40vmax at 62% 96%, var(--arc-3-soft), transparent 62%);
  transform: rotate(calc(var(--scroll) * 26deg)) scale(1.04);
}
.bg-ring {
  position: fixed; top: 50%; left: 50%; width: 128vmax; height: 128vmax; margin: -64vmax 0 0 -64vmax;
  z-index: -1; pointer-events: none; border-radius: 50%;
  border: 1px solid var(--hairline); border-right-color: transparent; border-top-color: transparent;
  opacity: 0.55; transform: rotate(calc(-38deg + var(--scroll) * 120deg));
}

button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: none; cursor: pointer; line-height: inherit; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
::selection { background: var(--accent-soft); }

/* ============ ナビ ============ */
.nav {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  min-height: 56px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 80%, transparent);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--hairline);
}
.lockup { display: flex; align-items: center; gap: 9px; font-weight: 700; letter-spacing: 0.14em; font-size: 0.9rem; }
.lockup .arc-mark { color: var(--accent); transition: transform 0.9s var(--ease-bounce); }
.lockup:hover .arc-mark { transform: rotate(-18deg) scale(1.12); }
.lockup-sub { color: var(--text-tertiary); font-weight: 600; letter-spacing: 0.02em; font-size: 0.82rem; }
.nav-right { margin-left: auto; display: flex; align-items: center; gap: 10px; min-width: 0; }
.save-state { font-size: 0.76rem; color: var(--text-tertiary); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
.save-state.is-saving::before { background: var(--warn); }
.save-state.is-error { color: var(--error); }
.save-state.is-error::before { background: var(--error); }
.save-state.is-local::before { background: var(--text-tertiary); }

.select, .input {
  background: var(--surface-strong);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 8px 12px;
  min-width: 0;
  transition: border-color var(--dur-fast) var(--ease), box-shadow var(--dur-fast) var(--ease);
}
.select:hover, .input:hover { border-color: var(--border); }
.select:focus, .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.nav .select { max-width: 52vw; border-radius: 999px; padding: 6px 14px; font-size: 0.86rem; }

/* ============ ページ ============ */
.page {
  max-width: 1080px; margin: 0 auto;
  padding-block: 28px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px;
}
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: var(--text-tertiary); }
h2 { font-size: clamp(1.3rem, 1.05rem + 0.9vw, 1.6rem); font-weight: 700; letter-spacing: -0.025em; margin: 0; line-height: 1.3; text-wrap: balance; }
h3 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.015em; margin: 0; }
.muted { color: var(--text-secondary); }
.faint { color: var(--text-tertiary); font-size: 0.86rem; }
.aurora-text { background: var(--aurora); -webkit-background-clip: text; background-clip: text; color: transparent; }
.num { font-variant-numeric: tabular-nums; }

/* ============ 大会カード(墨) ============ */
.hero {
  position: relative; overflow: hidden;
  background: var(--ink); color: var(--ink-text);
  border: 1px solid var(--ink-border);
  border-radius: var(--radius-lg) var(--radius-lg) var(--radius-lg) calc(var(--arc-corner) * 1.6);
  padding: clamp(24px, 4vw, 40px);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center;
}
.hero::before {
  content: ""; position: absolute; right: -14%; top: -40%; width: 62%; aspect-ratio: 1; border-radius: 50%;
  border: 1px solid var(--ink-line); border-top-color: transparent; border-left-color: transparent;
  transform: rotate(calc(var(--scroll) * -160deg)); pointer-events: none;
}
.hero > * { position: relative; }
.hero .kicker { color: var(--ink-text-3); }
.hero-name {
  display: block; width: 100%; resize: none; overflow: hidden; field-sizing: content;
  background: transparent; border: none; border-bottom: 1px dashed transparent;
  color: var(--ink-text); padding: 4px 0; margin: 6px 0 4px;
  font-size: clamp(1.7rem, 1.1rem + 2.6vw, 2.8rem); font-weight: 700; letter-spacing: -0.04em; line-height: 1.15;
}
.hero-name:hover { border-bottom-color: var(--ink-line); }
.hero-name:focus { outline: none; border-bottom-color: var(--ink-text-2); }
.hero-sub { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; color: var(--ink-text-2); font-size: 0.88rem; }
.hero-sub label { display: inline-flex; align-items: center; gap: 8px; }
.hero .select, .hero .input { background: var(--ink-surface); border-color: var(--ink-border); color: var(--ink-text); padding: 5px 10px; font-size: 0.86rem; }
.hero .select option { color: #0b0c11; background: #fff; }
/* 墨の上の日付欄:カレンダーのアイコンが黒くて見えないので暗い配色にする */
.hero input[type="date"] { color-scheme: dark; }
.hero-stats { display: flex; flex-wrap: wrap; gap: 14px 34px; margin-top: 20px; }
.stat-value { display: block; font-size: clamp(1.5rem, 1.1rem + 1.4vw, 2.2rem); font-weight: 700; letter-spacing: -0.035em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.74rem; color: var(--ink-text-3); letter-spacing: 0.06em; }
.hero-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.hero .btn-ghost { color: var(--ink-text-2); }
.hero .btn-ghost:hover { color: var(--ink-text); background: var(--ink-surface); }

.progress-arc { position: relative; display: grid; place-items: center; width: 170px; height: 170px; }
.progress-arc svg { width: 100%; height: 100%; transform: rotate(135deg); }
.pa-track { fill: none; stroke: var(--ink-line); stroke-width: 10; stroke-linecap: round; }
.pa-fill { fill: none; stroke-width: 10; stroke-linecap: round; transition: stroke-dasharray 1.2s var(--ease); }
.pa-label { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.pa-value { font-size: 2.2rem; font-weight: 700; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums; }
.pa-caption { font-size: 0.72rem; color: var(--ink-text-3); letter-spacing: 0.08em; }

/* ============ タブ ============ */
.tabs {
  display: flex; gap: 4px; padding: 5px; overflow-x: auto;
  background: var(--surface); border: 1px solid var(--border-soft); border-radius: 999px;
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  scrollbar-width: none; align-self: flex-start; max-width: 100%;
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  white-space: nowrap; padding: 8px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 650; color: var(--text-secondary);
  display: inline-flex; align-items: center; gap: 8px;
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease);
}
.tab:hover { color: var(--text); background: var(--surface-soft); }
.tab.is-active { background: var(--text); color: var(--bg); }
.tab-step { font-size: 0.7rem; opacity: 0.6; font-variant-numeric: tabular-nums; }

/* ============ カード:左下だけ弧が開く ============ */
.card {
  position: relative;
  background: var(--surface);
  -webkit-backdrop-filter: blur(18px) saturate(150%); backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius) var(--radius) var(--radius) var(--arc-corner);
  padding: clamp(18px, 3vw, 26px);
  box-shadow: var(--shadow-sm);
  min-width: 0;
}
.card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: radial-gradient(150px 150px at 20% 0%, var(--highlight), transparent 70%); opacity: 0.65;
}
.card > * { position: relative; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.card-head p { margin: 4px 0 0; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; align-items: start; }

/* ============ ボタン ============ */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 10px 22px; border-radius: 999px; font-size: 0.94rem; font-weight: 650; letter-spacing: 0.01em; white-space: nowrap;
  transition: transform var(--dur-fast) var(--ease-press), background var(--dur) var(--ease), color var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.btn:active { transform: scale(0.96); }
.btn:disabled { opacity: 0.42; cursor: default; }
.btn-primary { background: var(--accent); color: var(--accent-text); box-shadow: 0 10px 26px -14px var(--accent-glow); }
.btn-primary:hover:not(:disabled) { background: var(--accent-hover); transform: translateY(-1px); }
.btn-aurora { background: var(--aurora); background-size: 200% 100%; color: #fff; box-shadow: 0 14px 34px -16px var(--accent-glow); }
.btn-aurora:hover:not(:disabled) { background-position: 100% 0; transform: translateY(-1px); }
.btn-secondary { background: var(--surface-strong); color: var(--text); border: 1px solid var(--border-soft); }
.btn-secondary:hover:not(:disabled) { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); }
.btn-ghost { padding: 7px 12px; color: var(--text-secondary); }
.btn-ghost:hover { color: var(--text); background: var(--surface-soft); }
.btn-danger { color: var(--error); }
.btn-danger:hover { background: var(--error-soft); color: var(--error); }
.btn-sm { padding: 6px 14px; font-size: 0.84rem; }
.icon-btn { width: 32px; height: 32px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--text-tertiary); flex-shrink: 0; }
.icon-btn:hover { background: var(--error-soft); color: var(--error); }

/* 確認バー */
.confirm {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 12px 16px; border-radius: 16px 16px 16px 30px;
  background: var(--warn-soft); color: var(--text); font-size: 0.9rem;
}
.confirm b { color: var(--warn); }

/* ============ 選手 ============ */
.add-form { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1.2fr) auto auto; gap: 10px; align-items: end; }
.add-form.dbl { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.2fr) minmax(0, 1fr) auto auto; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.08em; color: var(--text-tertiary); }
.paste { margin-top: 16px; border-top: 1px solid var(--hairline); padding-top: 14px; }
.paste summary { cursor: pointer; font-weight: 650; color: var(--accent); font-size: 0.92rem; }
.paste textarea { width: 100%; min-height: 130px; margin-top: 10px; resize: vertical; font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 0.86rem; line-height: 1.6; }
.paste .row { margin-top: 10px; }
.imp-box { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; padding: 14px 16px; border-radius: 16px 16px 16px 30px; background: var(--surface-soft); border: 1px solid var(--border-soft); }
.imp-guide { margin: 0; font-size: 0.86rem; font-weight: 650; color: var(--text-secondary); }
.imp-table { font-size: 0.86rem; }
.imp-table th { padding: 4px; border-bottom: none; }
.imp-table td { padding: 6px 8px; white-space: nowrap; }
.imp-table td.is-skip { color: var(--text-tertiary); text-decoration: line-through; }
.imp-table tr.is-head td { color: var(--text-tertiary); font-style: italic; text-decoration: line-through; }
.imp-role { padding: 5px 8px; font-size: 0.8rem; font-weight: 700; border-color: var(--accent); color: var(--accent); }
.imp-role.is-skip { border-color: var(--border-soft); color: var(--text-tertiary); font-weight: 500; }
.imp-sum { margin: 4px 0 0; }
.imp-sum b { color: var(--accent); font-size: 1.1rem; }
.imp-warn { margin: 4px 0 0; color: var(--warn); font-weight: 700; }

.table-wrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
table { border-collapse: collapse; width: 100%; font-size: 0.92rem; }
th { text-align: left; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; color: var(--text-tertiary); padding: 8px 8px; white-space: nowrap; border-bottom: 1px solid var(--hairline); }
td { padding: 6px 8px; border-bottom: 1px solid var(--hairline); vertical-align: middle; }
tr:last-child td { border-bottom: none; }
.cell-input { width: 100%; min-width: 7em; background: transparent; border: 1px solid transparent; border-radius: 10px; padding: 6px 8px; }
.cell-input:hover { border-color: var(--border-soft); background: var(--surface-strong); }
.cell-input:focus { outline: none; border-color: var(--accent); background: var(--surface-strong); box-shadow: 0 0 0 3px var(--accent-soft); }
.lvpick { display: inline-flex; gap: 3px; flex-wrap: nowrap; }
.lv-b {
  width: 40px; height: 36px; border-radius: 8px; flex-shrink: 0;
  font-size: 0.86rem; font-weight: 800; font-variant-numeric: tabular-nums;
  background: var(--surface-strong); color: var(--text-tertiary); border: 1px solid var(--border-soft);
  transition: background var(--dur-fast) var(--ease), color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-press);
}
.lv-b:first-child { border-radius: 8px 8px 8px 14px; }
.lv-b:hover { border-color: var(--accent); color: var(--accent); }
.lv-b:active { transform: scale(0.92); }
.lv-b.on { background: color-mix(in srgb, var(--accent) 20%, var(--surface-strong)); color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
.lv-b.cur { background: var(--accent); color: var(--accent-text); border-color: var(--accent); transform: scale(1.08); }

/* ランクメーター(弧のドット) */
.lv { display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; font-weight: 650; }
.lv-bar { display: inline-flex; gap: 2px; }
.lv-bar i { width: 4px; height: 12px; border-radius: 2px; background: var(--hairline); }
.lv-bar i.on { background: var(--accent); }

.badge {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  min-width: 32px; height: 32px; padding: 0 9px; border-radius: 999px 999px 999px 8px;
  font-size: 1.02rem; font-weight: 800; letter-spacing: 0.02em; line-height: 1;
  background: var(--lg, var(--surface-soft)); color: var(--on-lg);
}
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.76rem; font-weight: 650; background: var(--surface-soft); color: var(--text-secondary); white-space: nowrap; }
.chip-warn { background: var(--warn-soft); color: var(--warn); }
.chip-ok { background: var(--success-soft); color: var(--success); }
.chip-live { background: var(--accent-soft); color: var(--accent); }

/* ============ リーグ分け ============ */
.settings { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--surface-strong); border: 1px solid var(--border-soft); border-radius: 999px; padding: 3px; }
.stepper button { width: 34px; height: 34px; border-radius: 50%; font-size: 1.1rem; font-weight: 700; color: var(--text-secondary); }
.stepper button:hover { background: var(--surface-soft); color: var(--text); }
.stepper output { min-width: 2.2em; text-align: center; font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: 0.9rem; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--accent); }

.league-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; align-items: start; }
.league-card { border-top: 5px solid var(--lg); background: linear-gradient(180deg, var(--lg-soft), transparent 90px), var(--surface); }
.league-title { display: flex; align-items: center; gap: 12px; }
.league-title h3 { color: var(--lg); font-size: 1.25rem; }
.league-letter {
  width: 54px; height: 54px; flex-shrink: 0; display: grid; place-items: center;
  border-radius: 50% 50% 50% 12px; background: var(--lg); color: var(--on-lg);
  font-size: 1.8rem; font-weight: 800; letter-spacing: -0.02em;
}
.title-with-letter { display: flex; align-items: center; gap: 12px; }
.league-meta { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 6px; }
.plist { list-style: none; margin: 0; padding: 0; }
.plist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--hairline); }
.plist li:last-child { border-bottom: none; }
.pname { font-weight: 650; overflow-wrap: anywhere; line-height: 1.35; }
.pschool { display: block; font-size: 0.78rem; color: var(--text-tertiary); font-weight: 500; }
.pschool.dup { color: var(--warn); }
.move-select { padding: 4px 8px; font-size: 0.8rem; border-radius: 999px; }

/* ============ 試合と結果 ============ */
.league-pills { display: flex; gap: 8px; flex-wrap: wrap; }
.league-pill {
  display: inline-flex; align-items: center; gap: 10px; padding: 6px 18px 6px 6px; border-radius: 999px;
  background: var(--surface-strong); border: 2px solid var(--border-soft); font-weight: 700; font-size: 1rem;
}
.league-pill .badge { width: 38px; height: 38px; font-size: 1.25rem; }
.league-pill:hover { border-color: var(--lg); }
.league-pill.is-active { border-color: var(--lg); background: var(--lg-soft); box-shadow: 0 0 0 3px var(--lg-soft); color: var(--lg); }
.league-pill small { color: var(--text-tertiary); font-weight: 600; font-variant-numeric: tabular-nums; }

.hoshi { font-size: 0.86rem; }
.hoshi th, .hoshi td { text-align: center; padding: 8px 6px; border: 1px solid var(--hairline); }
.hoshi th { white-space: normal; letter-spacing: 0.02em; font-size: 0.74rem; min-width: 64px; }
.hoshi .name-cell { text-align: left; white-space: nowrap; min-width: 9em; }
.hoshi .self { background: repeating-linear-gradient(135deg, var(--surface-soft) 0 6px, transparent 6px 12px); }
.hoshi .win { color: var(--success); font-weight: 700; }
.hoshi .lose { color: var(--text-tertiary); }
.hoshi .mark { display: block; font-size: 1.05rem; line-height: 1.1; }
.hoshi .sc { display: block; font-size: 0.72rem; font-variant-numeric: tabular-nums; }
.hoshi .rank { font-weight: 800; font-size: 1.05rem; }
.hoshi .rank-1 { color: var(--lg); }
.hoshi td.stat { font-variant-numeric: tabular-nums; }
.hoshi tr.top td.name-cell { font-weight: 700; }
.tie-note { margin-top: 10px; font-size: 0.78rem; color: var(--text-tertiary); }

.round { display: flex; flex-direction: column; gap: 8px; }
.round-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-top: 6px; }
.round-head h3 { font-size: 0.95rem; }
.match {
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) 64px; gap: 12px; align-items: center;
  padding: 10px 14px; border-radius: 16px 16px 16px 28px;
  background: var(--surface-strong); border: 1px solid var(--border-soft);
  transition: border-color var(--dur) var(--ease);
}
.match.is-done { border-color: color-mix(in srgb, var(--success) 35%, transparent); }
.m-side { min-width: 0; line-height: 1.3; }
.m-side.b { text-align: right; }
.m-side .pname { transition: color var(--dur-fast) var(--ease); }
.m-side.win .pname { color: var(--success); }
.qwin {
  display: inline-flex; align-items: center; justify-content: center; margin-top: 6px; min-width: 64px;
  padding: 6px 14px; border-radius: 999px; font-size: 0.86rem; font-weight: 800;
  background: var(--surface-soft); border: 1.5px solid var(--border); color: var(--text-secondary);
  transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-press);
}
.qwin:hover { border-color: var(--success); color: var(--success); }
.qwin:active { transform: scale(0.94); }
.qwin.on { background: var(--success); border-color: var(--success); color: var(--bg); }
.m-side.b .qwin { margin-left: auto; }
.m-side { display: flex; flex-direction: column; }
.m-side.b { align-items: flex-end; }
.m-scores { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.game { display: flex; align-items: center; gap: 4px; }
.game-label { font-size: 0.66rem; color: var(--text-tertiary); width: 2.4em; text-align: right; margin-right: 2px; }
.score {
  width: 3em; text-align: center; padding: 5px 2px; border-radius: 10px;
  background: var(--surface-soft); border: 1px solid var(--border-soft); font-weight: 700; font-variant-numeric: tabular-nums;
}
.score:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--surface-strong); }
.score.bad { border-color: var(--warn); }
.score:disabled { opacity: 0.35; }
.wo-select { margin-top: 4px; padding: 3px 8px; font-size: 0.76rem; border-radius: 999px; color: var(--text-tertiary); max-width: 100%; }
.wo-select.is-on { color: var(--warn); border-color: var(--warn); font-weight: 700; }
.m-status { text-align: right; }
.bye { font-size: 0.84rem; color: var(--text-tertiary); padding: 2px 4px; }

.overview { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; align-items: start; }
.mini th, .mini td { padding: 6px 6px; }
.mini td.stat { text-align: right; font-variant-numeric: tabular-nums; }
.mini .rank { font-weight: 800; width: 2em; }

/* ============ トーナメント ============ */
.bracket-wrap { overflow-x: auto; margin: 14px -8px 0; padding: 0 8px 8px; }
.bracket-svg { display: block; font-family: var(--font); margin: 0 auto; }
.bracket-svg .bl { fill: none; stroke: var(--text-tertiary); stroke-width: 1.2; opacity: 0.8; }
.bracket-svg .bl.hl { stroke: var(--accent); stroke-width: 3; opacity: 1; }
.bracket-svg .bt { fill: var(--text); font-size: 12.5px; font-weight: 600; }
.bracket-svg .bt.champ { fill: var(--accent); font-weight: 800; }
.bracket-svg .bs { fill: var(--text-tertiary); font-size: 10.5px; font-weight: 500; }
.bracket-svg .bseed { fill: var(--accent); font-size: 11px; font-weight: 800; }
details.seedbox { margin-top: 16px; padding: 12px 16px; border-radius: 16px 16px 16px 30px; background: var(--surface-soft); border: 1px solid var(--border-soft); }
details.seedbox summary { cursor: pointer; font-weight: 700; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
details.seedbox summary:hover { color: var(--accent); }
.seed-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 16px; max-height: 420px; overflow-y: auto; padding-right: 4px; }
.seed-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--hairline); }
.seed-row.is-set .pname { color: var(--accent); }
.seed-select { padding: 5px 8px; font-size: 0.84rem; }
.bracket-svg .bnode { cursor: pointer; }
.bracket-svg .bnode rect { fill: var(--surface-strong); stroke: var(--border); stroke-width: 1; }
.bracket-svg .bnode text { fill: var(--text-secondary); font-size: 10.5px; font-weight: 800; text-anchor: middle; font-variant-numeric: tabular-nums; }
.bracket-svg .bnode.done rect { stroke: var(--accent); stroke-width: 1.6; }
.bracket-svg .bnode:hover rect { stroke: var(--accent); stroke-width: 2.2; }
.bracket-svg .bnode.sel rect { fill: var(--accent); stroke: var(--accent); }
.bracket-svg .bnode.sel text { fill: var(--accent-text); }
.bracket-svg .bsc { fill: var(--accent); font-size: 10px; font-weight: 800; text-anchor: middle; font-variant-numeric: tabular-nums; }
.bracket-svg .blabel { fill: var(--text-secondary); font-size: 13px; font-weight: 800; letter-spacing: 0.12em; text-anchor: middle; }
.bracket-svg .bchamp { fill: var(--accent); font-size: 13px; font-weight: 800; text-anchor: middle; }
.ranks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.rank-card { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border-radius: 16px 16px 16px 30px; background: var(--surface-soft); border: 1px solid var(--border-soft); min-width: 0; }
.rank-card:first-child { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.rank-card:first-child b { color: var(--accent); }
.rank-card b { font-size: 1.02rem; overflow-wrap: anywhere; line-height: 1.35; }
.bm-list { display: flex; flex-direction: column; gap: 6px; }
.bm-row {
  display: grid; grid-template-columns: 2.6em 5.2em minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; width: 100%;
  padding: 9px 14px; border-radius: 12px 12px 12px 24px; background: var(--surface-strong); border: 1px solid var(--border-soft);
  transition: border-color var(--dur-fast) var(--ease);
}
.bm-row:hover { border-color: var(--accent); }
.bm-row.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.bm-num { font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; font-size: 1.05rem; }
.bm-round { font-size: 0.78rem; color: var(--text-tertiary); font-weight: 650; }
.bm-vs { min-width: 0; overflow-wrap: anywhere; line-height: 1.4; font-size: 0.92rem; }
.bm-vs b { color: var(--success); }

/* ============ リーグの分け方 ============ */
.method { gap: 6px; }
.method-pic { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; padding: 10px 12px; border-radius: 12px; background: var(--surface-soft); }
.method-pic > span { display: grid; grid-template-columns: 22px auto 1fr; align-items: center; gap: 8px; font-size: 0.78rem; color: var(--text-secondary); }
.method-pic em { font-style: normal; font-weight: 800; font-size: 1.2rem; line-height: 1; color: var(--lg); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--lg); }
.dots.mix i { background: color-mix(in srgb, var(--text-tertiary) 55%, transparent); }
.dots.mix i.s { background: var(--accent); }
.dots.mix i.w { background: color-mix(in srgb, var(--text-tertiary) 30%, transparent); }
.size-pick { display: flex; gap: 8px; flex-wrap: wrap; }
.size-b {
  min-width: 64px; padding: 10px 16px; border-radius: 14px 14px 14px 22px; font-size: 1.05rem; font-weight: 800;
  background: var(--surface-strong); border: 2px solid var(--border-soft); color: var(--text-secondary);
  transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease-press);
}
.size-b:hover { border-color: var(--accent); color: var(--accent); }
.size-b:active { transform: scale(0.95); }
.size-b.cur { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }
.size-b { display: inline-flex; flex-direction: column; align-items: center; line-height: 1.2; }
.size-b small { font-size: 0.7rem; font-weight: 700; opacity: 0.85; }
.size-b.over:not(.cur) small { color: var(--warn); opacity: 1; }
.warn-text { color: var(--warn); }
.day-load { margin: 0 0 12px; padding: 10px 14px; border-radius: 12px 12px 12px 22px; background: var(--success-soft); font-size: 0.9rem; }
.day-load.is-over { background: var(--warn-soft); color: var(--text); font-weight: 650; }
.day-head { display: flex; align-items: baseline; gap: 10px; margin-top: 10px; padding: 8px 14px; border-radius: 12px 12px 12px 22px; background: var(--accent-soft); }
.day-head h3 { font-size: 1.1rem; color: var(--accent); }
.plan-preview {
  padding: 14px 18px; border-radius: 16px 16px 16px 30px; background: var(--accent-soft); color: var(--text);
  font-size: 1.02rem; line-height: 1.6;
}
.plan-preview b { color: var(--accent); font-size: 1.15rem; letter-spacing: 0.04em; }

/* リーグの切り替え */
/* 上に残るリーグの切り替え:A B C D の大きなボタン */
.league-switch {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 30;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 12px; border-radius: 18px 18px 18px 32px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); border: 1px solid var(--border-soft);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); box-shadow: var(--shadow-sm);
}
.switch-label { font-size: 0.84rem; font-weight: 800; color: var(--text-secondary); white-space: nowrap; }
.league-switch .league-pills { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px; }
.league-switch .league-pill {
  flex-direction: column; justify-content: center; gap: 0; padding: 6px 4px; border-radius: 14px 14px 14px 22px;
  border: 2px solid var(--lg); background: var(--surface-strong); color: var(--lg);
}
.league-switch .lp-letter { font-size: 1.6rem; font-weight: 800; line-height: 1.1; }
.league-switch .league-pill small { font-size: 0.72rem; font-weight: 700; color: inherit; opacity: 0.85; }
.league-switch .league-pill.is-active { background: var(--lg); color: var(--on-lg); box-shadow: 0 0 0 3px var(--lg-soft); }

/* ============ はじめの画面 ============ */
.home-head { padding-block: clamp(12px, 4vw, 36px) 0; display: flex; flex-direction: column; gap: 6px; }
.home-title { margin: 0; font-size: clamp(1.8rem, 1.2rem + 2.6vw, 2.8rem); font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
.home-head p { margin: 0; }
.home-sub { margin: 0; font-size: 1.25rem; }
.make-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.make-card {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px; text-align: left; cursor: pointer;
  padding: 20px 22px; border-radius: var(--radius) var(--radius) var(--radius) var(--arc-corner);
  background: var(--surface-strong); border: 2px solid var(--border-soft); box-shadow: var(--shadow-sm);
  transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease), box-shadow var(--dur) var(--ease);
}
.make-card b { font-size: 1.2rem; letter-spacing: -0.02em; }
.make-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow); }
.make-card.is-on { border-color: var(--accent); background: var(--accent-soft); }
.make-card.is-on b { color: var(--accent); }
.make-card.is-on .faint, .choice:has(input:checked) .faint { color: var(--text-secondary); }
.make-icon { display: block; width: 72px; height: 54px; color: var(--text-secondary); margin-bottom: 4px; }
.make-icon svg { width: 100%; height: 100%; }
.make-icon.small { width: 48px; height: 36px; margin: 0; }
.create { border: 2px solid var(--accent); }

/* ============ 初期画面・作成 ============ */
.back-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 16px 7px 12px; border-radius: 999px;
  font-weight: 700; font-size: 0.92rem; background: var(--surface-strong); border: 1px solid var(--border-soft);
}
.back-btn span { font-size: 1.3rem; line-height: 1; margin-top: -2px; }
.back-btn:hover { border-color: var(--accent); color: var(--accent); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.choice-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.choice {
  position: relative; display: flex; flex-direction: column; gap: 2px; cursor: pointer;
  padding: 14px 16px; border-radius: 16px 16px 16px 30px; background: var(--surface-strong);
  border: 2px solid var(--border-soft); transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice b { font-size: 1rem; }
.choice:hover { border-color: var(--border); }
.choice:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.choice:has(input:checked) b { color: var(--accent); }
.choice:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 3px; }
.need-pick:not(:has(input:checked)) .choice { border-color: var(--warn); }
.need-pick:not(:has(input:checked)) > span { color: var(--warn); }
.event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
.event-card { display: flex; flex-direction: column; gap: 6px; text-align: left; padding: 0; transition: border-color var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease); }
.event-card:hover { border-color: var(--accent); }
.event-open { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; padding: 18px 20px 6px; cursor: pointer; border-radius: inherit; }
.event-del {
  align-self: flex-end; display: inline-flex; align-items: center; gap: 4px; margin: 0 12px 10px;
  padding: 5px 12px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; color: var(--text-tertiary);
}
.event-del:hover { background: var(--error-soft); color: var(--error); }
.event-card.is-confirm { padding: 18px 20px; border-color: var(--error); background: var(--error-soft); }

@media (max-width: 760px) {

  .m-side.a { grid-area: a; } .m-side.b { grid-area: b; } .m-scores { grid-area: s; } .m-status { grid-area: st; text-align: center; }
  .nav .lockup-sub { display: none; }

  /* 選手一覧:スマホでは1人を2〜3段のカードにして、横スクロールなしでランクを押せるように */

    display: grid; gap: 6px 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--hairline);

  }
  .ptable.dbl tr { grid-template-areas: "name name2 league del" "school school school school" "level level level level"; }

  .ptable .c-name { grid-area: name; } .ptable .c-name2 { grid-area: name2; } .ptable .c-school { grid-area: school; }
  .ptable .c-level { grid-area: level; } .ptable .c-league { grid-area: league; } .ptable .c-del { grid-area: del; }
  .ptable .cell-input { min-width: 0; border-color: var(--border-soft); background: var(--surface-strong); }

}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .shuttle-path { stroke-dashoffset: 0; }

</style>

<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="bg-ring" aria-hidden="true"></div>
<div id="app"><div class="loading">読み込み中…</div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
"use strict";

/* ============ 小道具 ============ */
const LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const RANK_MAX = 5; // ランクは 1〜5(5 がいちばん強い)
/* 1〜10 の値を 1〜5 に(10・9→5、8・7→4 …) */
const to5 = (v) => clamp(Math.ceil(v / 2), 1, RANK_MAX);
// 保存キーは旧名(arca-)のまま。変えると、今までの端末に保存したデータが読めなくなる
const LS_KEY = "arca-league-v1";
const app = document.getElementById("app");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const clone = (o) => JSON.parse(JSON.stringify(o));

// CLEAR のマーク:ネットを越えて高く弧を描くシャトル
const ARC_MARK = (size = 22) => `<svg class="arc-mark" width="${size}" height="${size}" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 28v-9" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity="0.45"/><path d="M3 28C6 9 23 4 28.5 20" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/><path d="M26 22.5l3.2-3.8 2 4.8z" fill="currentColor"/><circle cx="28.4" cy="23.6" r="2.1" fill="currentColor"/></svg>`;
const TRASH = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

let toastTimer;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

/* ============ 状態 ============ */
let events = {};
let currentId = null;
let ready = false;
const ui = { newLevel: 3, view: "home", createMode: null, showSettings: false, moreOpen: false, tab: "players", league: null, bmatch: null, confirm: null, copyText: null, saveState: "saved" };

function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}

function normalize(raw) {
  const ev = Object.assign({
    name: "名前なし", date: today(), type: "singles", games: 1, points: 21, leagueCount: 4,
    spreadSchools: true, tolerance: 0, players: [], leagues: [], results: {}, updatedAt: 0,
    mode: null, tTop: 2, tThird: true, bracket: null, seeds: {},
  }, clone(raw || {}));
  // 形式。古いデータは中身から推測する
  if (!["league", "tournament", "both"].includes(ev.mode)) {
    const hasL = ev.leagues && ev.leagues.length, hasB = !!(ev.bracket && ev.bracket.slots);
    ev.mode = hasB && (hasL || ev.tSource === "league") ? "both" : hasB ? "tournament" : "league";
  }
  ev.tTop = clamp(parseInt(ev.tTop, 10) || 2, 1, 4);
  ev.tThird = ev.tThird !== false;
  const bs = ev.bracket && Array.isArray(ev.bracket.slots) ? ev.bracket.slots.length : 0;
  ev.bracket = bs >= 2 && (bs & (bs - 1)) === 0
    ? {
      slots: ev.bracket.slots.map((x) => (x ? String(x) : null)),
      results: ev.bracket.results && typeof ev.bracket.results === "object" ? ev.bracket.results : {},
      seeds: ev.bracket.seeds && typeof ev.bracket.seeds === "object" ? ev.bracket.seeds : {},
    }
    : null;
  ev.type = ev.type === "doubles" ? "doubles" : "singles";
  // ダブルスでは1件 = 1ペア(name と name2)。シングルスでは name2 は使わない
  ev.players = (Array.isArray(ev.players) ? ev.players : []).filter((p) => p && p.id).map((p) => ({
    id: String(p.id), name: String(p.name || ""), name2: String(p.name2 || ""), school: String(p.school || ""), level: clamp(parseInt(p.level, 10) || 3, 1, 10),
  }));
  // ランクは前は 1〜10 だった。古いデータは 1〜5 に換算してから使う
  if (ev.rankScale !== RANK_MAX) { ev.players.forEach((p) => (p.level = to5(p.level))); ev.rankScale = RANK_MAX; }
  ev.players.forEach((p) => (p.level = clamp(p.level, 1, RANK_MAX)));
  const ids = new Set(ev.players.map((p) => p.id));
  // 手で決めたシード { 選手id: シード番号 }。消えた選手と重複番号は捨てる
  const usedSeed = new Set();
  const seeds = {};
  Object.entries(ev.seeds && typeof ev.seeds === "object" ? ev.seeds : {}).forEach(([id, s]) => {
    const n = parseInt(s, 10);
    if (ids.has(id) && n >= 1 && !usedSeed.has(n)) { seeds[id] = n; usedSeed.add(n); }
  });
  ev.seeds = seeds;
  const seen = new Set();
  ev.leagues = (Array.isArray(ev.leagues) ? ev.leagues : []).filter((l) => l && typeof l === "object").map((l) => ({
    id: String(l.id || uid()),
    playerIds: (l.playerIds || []).filter((id) => ids.has(id) && !seen.has(id) && seen.add(id)),
  }));
  ev.results = ev.results && typeof ev.results === "object" ? ev.results : {};
  ev.games = ev.games === 3 ? 3 : 1;
  ev.points = [11, 15, 21].includes(ev.points) ? ev.points : 21;
  ev.leagueCount = clamp(parseInt(ev.leagueCount, 10) || 4, 1, 26);
  // リーグ分け:1リーグの人数と分け方(level=ランク別 / balanced=どのリーグも同じ強さ)
  ev.groupSize = clamp(parseInt(ev.groupSize, 10) || 4, 3, 8);
  // 1人が1日にできる試合の上限(超える分は次の日に回す)
  ev.maxPerDay = clamp(parseInt(ev.maxPerDay, 10) || 6, 1, 12);
  ev.splitMethod = ev.splitMethod === "balanced" || ev.splitMethod === "level" ? ev.splitMethod : ev.mode === "both" ? "balanced" : "level";
  return ev;
}

/* ============ 保存(オンラインの db があればそこへ、無ければこの端末へ) ============ */
const Store = {
  db: null,
  timers: new Map(),
  pending: new Map(),
  writing: new Set(),
  async init() {
    if (window.claude && typeof window.claude.use === "function") {
      try { this.db = await window.claude.use("db"); } catch (e) { this.db = null; }
    }
  },
  lsRead() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "{}") || {}; } catch (e) { return {}; } },
  lsWrite() { try { localStorage.setItem(LS_KEY, JSON.stringify(events)); } catch (e) {} },
  async loadAll() {
    if (this.db) {
      try {
        const snap = await this.db.collection("events").get();
        const out = {};
        snap.docs.forEach((d) => { if (d.exists) out[d.id] = Object.assign(normalize(d.data()), { id: d.id }); });
        return out;
      } catch (e) {
        this.db = null;
        toast("オンライン保存に接続できませんでした。この端末に保存します");
      }
    }
    const raw = this.lsRead();
    const out = {};
    Object.keys(raw).forEach((k) => { out[k] = Object.assign(normalize(raw[k]), { id: k }); });
    return out;
  },
  save(ev) {
    ev.updatedAt = Date.now();
    this.lsWrite();
    if (!this.db) { setSaveState("local"); return; }
    const stamp = ev.updatedAt;
    this.pending.set(ev.id, stamp);
    setSaveState("saving");
    clearTimeout(this.timers.get(ev.id));
    this.timers.set(ev.id, setTimeout(() => this.flush(ev.id), 700));
  },
  async flush(id) {
    if (this.writing.has(id)) { this.timers.set(id, setTimeout(() => this.flush(id), 400)); return; }
    const ev = events[id];
    if (!ev) { this.pending.delete(id); return; }
    const stamp = this.pending.get(id);
    this.writing.add(id);
    try {
      await this.db.collection("events").doc(id).set(clone(ev));
      if (this.pending.get(id) === stamp) this.pending.delete(id);
      setSaveState(this.pending.size ? "saving" : "saved");
    } catch (e) {
      this.pending.delete(id);
      setSaveState("error");
      toast(e && e.code === "quota_exceeded" ? "保存容量がいっぱいです。使わなくなったものを削除してください" : "保存できませんでした。この端末には残っています");
    } finally {
      this.writing.delete(id);
    }
  },
  async remove(id) {
    this.lsWrite();
    if (!this.db) return;
    try { await this.db.collection("events").doc(id).delete(); } catch (e) { toast("削除を保存できませんでした"); }
  },
  subscribe() {
    if (!this.db) return;
    this.db.collection("events").onSnapshot((snap) => {
      let changed = false;
      snap.docChanges().forEach((ch) => {
        const id = ch.doc.id;
        if (this.pending.has(id) || this.writing.has(id)) return;
        if (ch.type === "removed") {
          if (events[id]) { delete events[id]; changed = true; }
          return;
        }
        const d = Object.assign(normalize(ch.doc.data()), { id });
        if (!events[id] || (d.updatedAt || 0) > (events[id].updatedAt || 0)) { events[id] = d; changed = true; }
      });
      if (changed) { ensureCurrent(); safeRender(); }
    }, () => {});
  },
};

function setSaveState(s) {
  ui.saveState = s;
  const el = document.getElementById("save-state");
  if (el) el.outerHTML = saveStateHTML();
}
function saveStateHTML() {
  const map = {
    saved: ["", "保存済み"], saving: ["is-saving", "保存中…"], local: ["is-local", "この端末に保存"], error: ["is-error", "保存に失敗"],
  };
  const [cls, label] = map[ui.saveState] || map.saved;
  return `<span id="save-state" class="save-state ${cls}">${label}</span>`;
}

function ev() { return events[currentId]; }
function commit() { Store.save(ev()); }
function ensureCurrent() {
  if (!events[currentId]) {
    const list = sortedEvents();
    currentId = list.length ? list[0].id : null;
  }
}
function sortedEvents() {
  return Object.values(events).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.updatedAt || 0) - (a.updatedAt || 0));
}

/* ============ リーグ分けのロジック ============ */
function rng(seed) {
  let s = seed >>> 0 || 1;
  return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; };
}
function shuffle(arr, rand) {
  for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
  return arr;
}
function dupCost(players) {
  const c = {};
  players.forEach((p) => { const k = p.school.trim(); if (k) c[k] = (c[k] || 0) + 1; });
  return Object.values(c).reduce((s, n) => s + (n * (n - 1)) / 2, 0);
}

/* 「1リーグ◯人」から、リーグの数と各リーグの人数を決める。
   3人未満のリーグ(試合が1つ以下)ができるならリーグを1つ減らす */
function planSizes(n, size) {
  if (n < 2) return n ? [n] : [];
  // 指定の人数にいちばん近くなるリーグ数(15人を7人ずつ → 7人+8人)
  let K = Math.max(1, Math.round(n / size));
  while (K > 1 && Math.floor(n / K) < 3) K--;
  const base = Math.floor(n / K), extra = n % K;
  return Array.from({ length: K }, (_, i) => base + (i < extra ? 1 : 0));
}

/* 実際にできる各リーグの人数(均等はスネークで配るので、余りが入るリーグが変わる) */
function groupSizesFor(e, n) {
  const sizes = planSizes(n, e.groupSize);
  if (e.splitMethod !== "balanced" || sizes.length < 2) return sizes;
  const K = sizes.length, out = new Array(K).fill(0);
  for (let i = 0; i < n; i++) { const r = Math.floor(i / K), j = i % K; out[r % 2 === 0 ? j : K - 1 - j]++; }
  return out;
}

function autoAssign(e) {
  const rand = rng(Date.now());
  // 同じランクの中だけ順番をシャッフルしてから、強い順に並べる(sort は安定)
  const ps = shuffle(e.players.slice(), rand).sort((a, b) => b.level - a.level);
  const sizes = planSizes(ps.length, e.groupSize);
  const K = sizes.length;
  let groups, canSwap;
  if (e.splitMethod === "balanced") {
    // どのリーグも同じ強さに:強い順に A→B→C、次の段は C→B→A と折り返して配る(スネーク方式)。
    // いちばん強い選手が各リーグに1人ずつ(=各リーグのシード)入る
    groups = Array.from({ length: K }, () => []);
    const pot = {};
    ps.forEach((p, i) => {
      const r = Math.floor(i / K), j = i % K;
      groups[r % 2 === 0 ? j : K - 1 - j].push(p);
      pot[p.id] = r;
    });
    canSwap = (p, q) => pot[p.id] === pot[q.id];
  } else {
    // ランク別:強い順に上から A・B・C… と区切る
    groups = [];
    let k = 0;
    sizes.forEach((n) => { groups.push(ps.slice(k, k + n)); k += n; });
    canSwap = (p, q) => Math.abs(p.level - q.level) <= e.tolerance;
  }

  if (e.spreadSchools) {
    // 入れ替えてよい選手同士(ランク別=ランク差が許容内、均等=同じ段)だけ入れ替えて、同じ学校の重なりを減らす
    for (let iter = 0; iter < 300; iter++) {
      let improved = false;
      for (let i = 0; i < K && !improved; i++) {
        for (let j = i + 1; j < K && !improved; j++) {
          const before = dupCost(groups[i]) + dupCost(groups[j]);
          if (before === 0) continue;
          for (let a = 0; a < groups[i].length && !improved; a++) {
            for (let b = 0; b < groups[j].length && !improved; b++) {
              const p = groups[i][a], q = groups[j][b];
              if (p.school === q.school || !canSwap(p, q)) continue;
              groups[i][a] = q; groups[j][b] = p;
              const after = dupCost(groups[i]) + dupCost(groups[j]);
              if (after < before) improved = true;
              else { groups[i][a] = p; groups[j][b] = q; }
            }
          }
        }
      }
      if (!improved) break;
    }
  }
  e.leagues = groups.map((g) => ({ id: uid(), playerIds: g.sort((a, b) => b.level - a.level).map((p) => p.id) }));
}

function playerMap(e) { const m = {}; e.players.forEach((p) => (m[p.id] = p)); return m; }
function leagueIndexOf(e, pid) { return e.leagues.findIndex((l) => l.playerIds.includes(pid)); }
function unassigned(e) { const s = new Set(e.leagues.flatMap((l) => l.playerIds)); return e.players.filter((p) => !s.has(p.id)); }

/* シングルス / ダブルスの呼び分け */
function isDbl(e) { return e.type === "doubles"; }
function unit(e) { return isDbl(e) ? "ペア" : "選手"; }
function count(e, n) { return isDbl(e) ? `${n}組` : `${n}人`; }
function pname(e, p) {
  if (!p) return "";
  if (!isDbl(e)) return p.name || "(名前なし)";
  return `${p.name || "(名前なし)"}・${p.name2 || "(相方未入力)"}`;
}
/* 狭い列用:ダブルスは2人を2行に積む(HTML) */
function pnameStack(e, p) {
  if (!p) return "";
  if (!isDbl(e)) return esc(p.name || "(名前なし)");
  return `${esc(p.name || "(名前なし)")}<br>${esc(p.name2 || "(相方未入力)")}`;
}

/* 総当たり(円卓方式)。奇数なら毎回1人休み */
function roundRobin(ids) {
  const arr = ids.slice();
  if (arr.length < 2) return [];

/* ============ 結果 ============ */

  const rows = ids.map((id, order) => ({ id, p: pm[id], order, played: 0, w: 0, l: 0, gw: 0, gl: 0, pf: 0, pa: 0 }));

  // (途中で2人に絞れたら直接対決) ④それでも並んだら同順位(抽選で決める)
  const tiers = rankTiers(e, rows);
  const sorted = [];
  tiers.forEach((t) => {
    const rank = sorted.length + 1;
    t.sort((x, y) => x.order - y.order).forEach((r) => { r.rank = rank; r.lots = t.length > 1 && r.played > 0; sorted.push(r); });

function rankTiers(e, rows) {

    return [...m.entries()].sort((a, b) => b[0] - a[0]).map((x) => x[1]);
  };
  const h2h = ([a, b]) => {
    const w = outcome(e, a.id, b.id).winner;

  const st = e.mode !== "league" ? bracketState(e) : null;

/* ============ トーナメント ============ */

    .sort((a, b) => e.seeds[a.id] - e.seeds[b.id])
    .forEach((x) => { ranked[e.seeds[x.id] - 1] = x; locked.add(x.id); });
  const rest = list.filter((x) => !locked.has(x.id));

  let N = 2;

  if (e.spreadSchools) {
    const tier = {}; list.forEach((x) => (tier[x.id] = x.tier));
    spreadBracket(e, slots, tier, tol, locked);

  const meet = (i, j) => { let r = 1; while (i >> r !== j >> r) r++; return r; };
  const contrib = (i) => {

function render() {

  const e = ev();
  if (ui.view === "home" || !e) { app.innerHTML = navHTML(null) + `<main class="page">${homeHTML()}</main>`; return; }
  if (!tabsFor(e).some(([k]) => k === ui.tab)) ui.tab = "players";
  if (ui.league == null || !e.leagues.find((l) => l.id === ui.league)) ui.league = e.leagues[0] ? e.leagues[0].id : null;
  let body = "";
  if (ui.tab === "players") body = playersHTML(e);
  else if (ui.tab === "leagues") body = leaguesHTML(e);
  else if (ui.tab === "matches") body = matchesHTML(e);
  else if (ui.tab === "bracket") body = bracketHTML(e);
  else body = overviewHTML(e);
  app.innerHTML = navHTML(e) + `<main class="page">${heroHTML(e)}${ui.exportOpen ? exportHTML(e) : ""}${ui.copyText ? copyBoxHTML() : ""}${tabsHTML(e)}${body}</main>`;

}
/* 大会名の欄を中身の行数に合わせる(field-sizing が効かないブラウザ用) */

  t.style.height = t.scrollHeight + "px";
}
addEventListener("resize", fitName);

let renderDeferred = false;
function safeRender() {
  const a = document.activeElement;
  if (a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { renderDeferred = true; return; }
  render();
}
app.addEventListener("focusout", () => {
  if (!renderDeferred) return;
  setTimeout(() => {
    const a = document.activeElement;
    if (a && app.contains(a) && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
    renderDeferred = false; render();
  }, 0);
});

    <div class="nav-right">${saveStateHTML()}${themeBtnHTML()}</div>

}
function isDarkNow() {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
}
function themeBtnHTML() {
  const dark = isDarkNow();
  const icon = dark
    ? `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`
    : `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>`;
  return `<button class="theme-btn" data-action="theme" aria-label="${dark ? "ライトモードにする" : "ダークモードにする"}">${icon}<span>${dark ? "ライトにする" : "ダークにする"}</span></button>`;
}

/* --- はじめの画面:何を作るか選ぶ / 続きから --- */
const MODES = {
  league: ["リーグ戦", "A・B・C… のリーグに分けて、リーグの中で全員と1回ずつ試合"],
  tournament: ["トーナメント", "負けたら終わりの勝ち抜き戦。シードを決めて表を作る"],
  both: ["リーグ戦 → 決勝トーナメント", "まずリーグ戦。各リーグの上位で決勝トーナメント"],
};
const MODE_ICON = {
  league: `<svg viewBox="0 0 64 48" fill="none" aria-hidden="true"><rect x="4" y="4" width="56" height="40" rx="6" stroke="currentColor" stroke-width="2.5"/><path d="M4 18h56M4 31h56M24 4v40M42 4v40" stroke="currentColor" stroke-width="2" opacity=".55"/><path d="M28 11h10M46 24h10M10 37h10" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/></svg>`,
  tournament: `<svg viewBox="0 0 64 48" fill="none" aria-hidden="true"><path d="M4 6h14v12H4M4 30h14v12H4M18 12h14v24H18M32 24h14" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><path d="M4 6h14v6h14v12h14" stroke="var(--accent)" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="52" cy="24" r="6" fill="var(--accent)"/></svg>`,
  both: `<svg viewBox="0 0 64 48" fill="none" aria-hidden="true"><rect x="2" y="10" width="24" height="28" rx="5" stroke="currentColor" stroke-width="2.5"/><path d="M2 24h24M14 10v28" stroke="currentColor" stroke-width="2" opacity=".55"/><path d="M30 24h6" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/><path d="M40 12h10v24H40M50 24h10" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/><circle cx="60" cy="24" r="3.5" fill="var(--accent)"/></svg>`,
};
function tabsFor(e) {
  const tabs = [["players", unit(e)]];
  if (e.mode !== "tournament") tabs.push(["leagues", "リーグ分け"], ["matches", "試合と結果"], ["overview", "順位"]);
  if (e.mode !== "league") tabs.push(["bracket", e.mode === "both" ? "決勝トーナメント" : "トーナメント"]);
  return tabs;
}

/* 選んだ形式の「名前・シングルス/ダブルス」だけ聞く */
function createHTML(mode) {
  const radio = (value, title, checked) => `<label class="choice">
      <input type="radio" name="c-type" value="${value}" ${checked ? "checked" : ""}><b>${title}</b></label>`;
  const d = new Date();
  return `<section class="card create" id="create-card">
    <div class="card-head"><div class="title-with-letter"><span class="make-icon small">${MODE_ICON[mode]}</span><h2>${MODES[mode][0]}を作る</h2></div></div>
    <div class="stack">
      <label class="field"><span>名前(あとで変えられます)</span><input class="input" id="c-name" placeholder="例:${d.getMonth() + 1}月 部内${mode === "tournament" ? "トーナメント" : "リーグ戦"}" autocomplete="off"></label>
      <div class="field"><span>シングルス? ダブルス?</span><div class="choice-grid two">
        ${radio("singles", "シングルス(1人ずつ)", true)}${radio("doubles", "ダブルス(2人1組)", false)}
      </div></div>
      <div class="row">
        <button class="btn btn-aurora btn-lg" data-action="create">作って、選手を入れる ›</button>
        <button class="btn btn-ghost" data-action="cancel-create">やめる</button>
      </div>
    </div>
  </section>`;
}

function homeHTML() {
  const list = sortedEvents();
  const pick = ui.createMode;
  const make = Object.entries(MODES).map(([k, [t, d]]) => `<button class="make-card ${pick === k ? "is-on" : ""}" data-action="pick-mode" data-mode="${k}" aria-expanded="${pick === k}">
      <span class="make-icon">${MODE_ICON[k]}</span><b>${t}を作る</b><span class="faint">${d}</span></button>`).join("");
  const cards = list.map((x) => {
    const t = totals(x);
    if (ui.confirmDel === x.id) {
      return `<div class="card event-card is-confirm">
        <b class="event-name">「${esc(x.name)}」を削除しますか？</b>
        <span class="faint">${count(x, x.players.length)}と、入れた結果もすべて消えます。元に戻せません。</span>
        <span class="row" style="margin-top:4px">
          <button class="btn btn-sm btn-del" data-action="del-home-yes" data-id="${esc(x.id)}">削除する</button>
          <button class="btn btn-ghost btn-sm" data-action="del-home-no">やめる</button>
        </span>
      </div>`;
    }
    return `<div class="card event-card">
      <button class="event-open" data-action="open-event" data-id="${esc(x.id)}">
        <b class="event-name">${esc(x.name)}</b>
        <span class="row" style="gap:6px"><span class="chip chip-live">${MODES[x.mode][0]}</span><span class="chip">${isDbl(x) ? "ダブルス" : "シングルス"}</span></span>
        <span class="faint num">${esc(x.date || "")} · ${count(x, x.players.length)} · 試合 ${t.finished}/${t.total} 終了</span>
      </button>
      <button class="event-del" data-action="del-home" data-id="${esc(x.id)}" aria-label="「${esc(x.name)}」を削除" title="削除">${TRASH}<span>削除</span></button>

  return `<section class="home-head">
      <h1 class="home-title">何を作りますか？</h1>
      <p class="muted">下から1つ選んでください。名前を決めたら、選手を入れる画面に進みます。</p>
    </section>
    <div class="make-grid">${make}</div>
    ${pick ? createHTML(pick) : ""}
    ${list.length ? `<section class="stack"><div><h2 class="home-sub">続きから</h2><p class="faint" style="margin:2px 0 0">前に作ったもの。押すと続きができます。</p></div><div class="event-grid">${cards}</div></section>` : ""}
    <p class="faint" style="text-align:center;margin:8px 0 0">どんなものか見てみたいとき:
      <button class="link-btn" data-action="sample">見本のリーグ戦を開く</button> ·
      <button class="link-btn" data-action="sample" data-type="doubles">見本の決勝トーナメントつきを開く</button></p>`;
}

function heroHTML(e) {
  const t = totals(e);
  const pct = t.total ? Math.round((t.finished / t.total) * 100) : 0;
  const r = 78, circ = 2 * Math.PI * r, sweep = circ * 0.75;
  const confirmDel = ui.confirm === "del-event";
  return `<section class="hero">
    <div style="min-width:0">
      <span class="kicker">${isDbl(e) ? "ダブルス" : "シングルス"} · ${MODES[e.mode][0]}</span>
      <textarea class="hero-name" id="ev-name" data-change="ev-name" rows="1" aria-label="名前(押すと変えられます)">${esc(e.name)}</textarea>
      <div class="hero-sub">
        <label>日付 <input type="date" class="input" id="ev-date" data-change="ev-date" value="${esc(e.date)}"></label>
        <span>${e.points}点${e.games === 1 ? "1ゲーム" : "3ゲーム(2ゲーム先取)"} · 1人1日${e.maxPerDay}試合まで</span>
        <button class="btn btn-ghost btn-sm" data-action="toggle-settings" aria-expanded="${ui.showSettings}">${ui.showSettings ? "設定を閉じる" : "設定を変える"}</button>
        <button class="btn btn-sm btn-excel" data-action="toggle-export" aria-expanded="${!!ui.exportOpen}">Excelに貼り付け</button>
      </div>
      ${ui.showSettings ? `<div class="hero-sub hero-settings">
        <label>形式
          <select class="select" id="ev-mode" data-change="ev-mode">
            ${Object.entries(MODES).map(([k, [t]]) => `<option value="${k}" ${e.mode === k ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </label>
        <label>種目
          <select class="select" id="ev-type" data-change="ev-type">
            <option value="singles" ${isDbl(e) ? "" : "selected"}>シングルス</option>
            <option value="doubles" ${isDbl(e) ? "selected" : ""}>ダブルス</option>
          </select>
        </label>
        <label>試合形式
          <select class="select" id="ev-games" data-change="ev-games">
            <option value="1" ${e.games === 1 ? "selected" : ""}>1ゲームマッチ</option>
            <option value="3" ${e.games === 3 ? "selected" : ""}>3ゲームマッチ(2ゲーム先取)</option>
          </select>
        </label>
        <label>1人1日の上限
          <select class="select" id="ev-maxday" data-change="ev-maxday">
            ${Array.from({ length: 12 }, (_, k) => k + 1).map((k) => `<option value="${k}" ${e.maxPerDay === k ? "selected" : ""}>${k}試合</option>`).join("")}
          </select>
        </label>
        <label>点数
          <select class="select" id="ev-points" data-change="ev-points">
            ${[21, 15, 11].map((p) => `<option value="${p}" ${e.points === p ? "selected" : ""}>${p}点</option>`).join("")}
          </select>
        </label>
      </div>
      <div class="hero-actions">
        <button class="btn btn-ghost btn-sm" data-action="dup-event">同じ${unit(e)}で新しく作る</button>
        <button class="btn btn-ghost btn-sm" data-action="ask-del-event">これを削除</button>
      </div>` : ""}
      <div class="hero-stats" id="hero-stats">${heroStatsHTML(e, t)}</div>
      ${confirmDel ? `<div class="confirm" style="margin-top:12px;background:rgba(255,111,107,.14);color:var(--ink-text)"><span>「${esc(e.name)}」を削除します。${unit(e)}と結果もすべて消えます。</span><button class="btn btn-sm" style="background:#ff6f6b;color:#08090d" data-action="del-event">削除する</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
    </div>
    <div class="progress-arc" id="hero-arc" aria-label="試合の進み具合 ${pct}%">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="arcaRing" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#6c85ff"/><stop offset="50%" stop-color="#b077ff"/><stop offset="100%" stop-color="#2ad9b8"/></linearGradient></defs>
        <circle class="pa-track" cx="100" cy="100" r="${r}" stroke-dasharray="${sweep} ${circ}"/>
        <circle class="pa-fill" id="pa-fill" cx="100" cy="100" r="${r}" stroke="url(#arcaRing)" stroke-dasharray="${(sweep * pct) / 100} ${circ}"/>
      </svg>
      <div class="pa-label"><span class="pa-value" id="pa-value">${pct}<small style="font-size:.5em">%</small></span><span class="pa-caption">試合消化</span></div>
    </div>
  </section>`;
}
function heroStatsHTML(e, t) {
  return `<div><span class="stat-value">${e.players.length}</span><span class="stat-label">${unit(e)}</span></div>
    <div><span class="stat-value">${new Set(e.players.map((p) => p.school.trim()).filter(Boolean)).size}</span><span class="stat-label">学校</span></div>
    ${e.mode !== "tournament" ? `<div><span class="stat-value">${e.leagues.length}</span><span class="stat-label">リーグ</span></div>` : ""}
    <div><span class="stat-value">${t.finished}<span style="font-size:.55em;color:var(--ink-text-3)"> / ${t.total}</span></span><span class="stat-label">試合 終了 / 全体</span></div>`;
}
function refreshHero(e) {
  const t = totals(e);
  const pct = t.total ? Math.round((t.finished / t.total) * 100) : 0;
  const r = 78, circ = 2 * Math.PI * r, sweep = circ * 0.75;
  const s = document.getElementById("hero-stats"); if (s) s.innerHTML = heroStatsHTML(e, t);
  const f = document.getElementById("pa-fill"); if (f) f.setAttribute("stroke-dasharray", `${(sweep * pct) / 100} ${circ}`);
  const v = document.getElementById("pa-value"); if (v) v.innerHTML = `${pct}<small style="font-size:.5em">%</small>`;
}

function tabsHTML(e) {
  const tabs = tabsFor(e);
  return `<nav class="tabs" aria-label="画面">${tabs.map(([k, label], i) =>
    `<button class="tab ${ui.tab === k ? "is-active" : ""}" data-action="tab" data-tab="${k}"><span class="tab-step">${i + 1}</span>${label}</button>`).join("")}</nav>`;
}

/* --- 選手 --- */
function schoolsDatalist(e) {
  const s = [...new Set(e.players.map((p) => p.school.trim()).filter(Boolean))].sort();
  return `<datalist id="schools">${s.map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist>`;
}
function playersHTML(e) {
  const dbl = isDbl(e);
  // トーナメントだけの大会では、リーグの列と「リーグ分けへ」は出さない
  const hasL = e.mode !== "tournament";
  const next = hasL ? ["leagues", "リーグ分けへ"] : ["bracket", "トーナメントへ"];
  const list = e.players.slice().sort((a, b) => b.level - a.level || a.school.localeCompare(b.school, "ja") || a.name.localeCompare(b.name, "ja"));

    const li = hasL ? leagueIndexOf(e, p.id) : -1;
    return `<tr>
      <td class="c-name"><input class="cell-input" id="pn-${p.id}" data-change="p-name" data-id="${p.id}" value="${esc(p.name)}" placeholder="名前" aria-label="${dbl ? "1人目の名前" : "名前"}"></td>
      ${dbl ? `<td class="c-name2"><input class="cell-input" id="pn2-${p.id}" data-change="p-name2" data-id="${p.id}" value="${esc(p.name2)}" placeholder="相方を入力" aria-label="2人目の名前"></td>` : ""}
      <td class="c-school"><input class="cell-input" id="ps-${p.id}" data-change="p-school" data-id="${p.id}" value="${esc(p.school)}" list="schools" placeholder="学校" aria-label="学校"></td>
      <td class="c-level">${levelPicker(p.id, p.level)}</td>
      ${hasL ? `<td class="c-league">${li >= 0 ? `<span class="badge ${lgClass(li)}">${letter(li)}</span>` : `<span class="faint">—</span>`}</td>` : ""}
      <td class="c-del" style="text-align:right"><button class="icon-btn" data-action="del-player" data-id="${p.id}" aria-label="${esc(pname(e, p))}を削除" title="削除">${TRASH}</button></td>
    </tr>`;
  }).join("");
  return `${schoolsDatalist(e)}
  <section class="card">
    <div class="card-head"><div><h2>${unit(e)}を追加</h2><p class="faint">${dbl ? "ペアごとに1行。ランクはペアとしての強さで、1〜5 の5段階(5がいちばん強い)。だいたいで大丈夫です。" : "ランクは 1〜5 の5段階で、5 がいちばん強い。だいたいで大丈夫です(同じ数字の選手は同じくらいの強さとして扱います)。"}</p></div></div>
    <form class="add-form ${dbl ? "dbl" : ""}" id="add-form">
      <label class="field field-name"><span>${dbl ? "1人目" : "名前"}</span><input class="input" id="new-name" required placeholder="例:山田 太郎" autocomplete="off"></label>
      ${dbl ? `<label class="field field-name"><span>2人目</span><input class="input" id="new-name2" placeholder="例:佐藤 次郎" autocomplete="off"></label>` : ""}
      <label class="field"><span>学校</span><input class="input" id="new-school" list="schools" placeholder="例:桜ヶ丘高" autocomplete="off"></label>
      <div class="field field-level"><span>ランク(5がいちばん強い)</span>${levelPicker("new", ui.newLevel)}</div>
      <button class="btn btn-primary" type="submit">追加</button>
    </form>
    <details class="paste" ${ui.pasteOpen ? "open" : ""}>
      <summary>Excel の名簿から貼り付ける</summary>
      <p class="faint" style="margin:8px 0 0">Excel で名簿の範囲を選んでコピーし(見出しの行や番号・学年の列が入っていてもOK)、下の欄に貼り付けてください。どの列が${dbl ? "1人目・2人目" : "名前"}・学校・ランクかを自動で見分けて、取り込む前に表で見せます。${dbl ? "「山田・佐藤」のように1つのセルに2人入っていてもOK。" : ""}</p>
      <textarea class="input" id="paste-box" data-input="paste" placeholder="${dbl ? "1人目	2人目	学校&#10;山田 太郎	佐藤 次郎	東高校&#10;鈴木・高橋	西高校" : "No.	氏名	学年	学校名&#10;1	山田　太郎	2	東高校&#10;2	佐藤　花子	1	西高校"}">${esc(ui.imp ? ui.imp.text : "")}</textarea>
      <div id="import-preview">${importPreviewHTML(e)}</div>
    </details>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>登録${unit(e)} <span class="faint num">${count(e, e.players.length)}</span></h2><p class="faint">ここで名前・学校・ランクを直すと、${hasL ? "リーグ表" : "トーナメント表"}や結果にもそのまま反映されます。</p></div>
      ${e.players.length ? `<button class="btn btn-aurora btn-sm" data-action="tab" data-tab="${next[0]}">${next[1]}</button>` : ""}</div>
    ${e.players.length ? `<div class="table-wrap"><table class="ptable ${dbl ? "dbl" : ""}">
