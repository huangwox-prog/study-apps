      <tbody>${rows}</tbody></table></div>` : `<p class="muted">まだ${unit(e)}がいません。上のフォームか、Excel からの貼り付けで追加してください。</p>`}
  </section>`;
}

/* --- リーグ分け --- */
function leaguesHTML(e) {
  const pm = playerMap(e);
  const n = e.players.length;
  const u = isDbl(e) ? "組" : "人";
  const sizes = groupSizesFor(e, n);
  const confirm = ui.confirm === "reassign";
  const dots = (k) => `<span class="dots">${"<i></i>".repeat(k)}</span>`;
  const methodCard = (val, title, desc, pic) => `<label class="choice method ${e.splitMethod === val ? "is-on" : ""}">
      <input type="radio" name="split" value="${val}" data-change="split" ${e.splitMethod === val ? "checked" : ""}>
      <b>${title}</b><span class="faint">${desc}</span>${pic}</label>`;
  const levelPic = `<span class="method-pic" aria-hidden="true">
      <span class="lg-0"><em>A</em>${dots(4)}<small>強い</small></span>
      <span class="lg-1"><em>B</em>${dots(4)}<small>ふつう</small></span>
      <span class="lg-2"><em>C</em>${dots(4)}<small>これから</small></span></span>`;
  const balPic = `<span class="method-pic" aria-hidden="true">
      <span class="lg-0"><em>A</em><span class="dots mix"><i class="s"></i><i></i><i></i><i class="w"></i></span><small>強い人1人ずつ</small></span>
      <span class="lg-1"><em>B</em><span class="dots mix"><i class="s"></i><i></i><i></i><i class="w"></i></span><small></small></span>
      <span class="lg-2"><em>C</em><span class="dots mix"><i class="s"></i><i></i><i></i><i class="w"></i></span><small></small></span></span>`;
  const big = sizes.length ? Math.max(...sizes) : 0;
  const days = dayCount(e, big);
  const preview = n < 2 ? `${unit(e)}を2${u}以上入れると分けられます`
    : `${n}${u} → <b>${sizes.map((_, i) => letter(i)).join("・")}</b> の ${sizes.length} リーグ(${sizes.map((s) => `${s}${u}`).join("・")})<br>
      <span class="faint">1${u}あたり最大 ${big - 1} 試合 → ${days === 1 ? `1日で終わります(1日${e.maxPerDay}試合まで)` : `<b class="warn-text">1日${e.maxPerDay}試合までなので ${days} 日に分けます</b>`}</span>`;
  const settings = `<section class="card">
    <div class="card-head"><div><h2>リーグの分け方</h2><p class="faint">2つ選んで「リーグを作る」を押すだけです。</p></div></div>
    <div class="stack">
      <div class="field"><span>① 分け方</span><div class="choice-grid">
        ${methodCard("level", "ランク別に分ける", "同じくらいの強さの人どうしで試合。A がいちばん強い組。部内戦・練習向き", levelPic)}
        ${methodCard("balanced", "どのリーグも同じ強さにする", "強い人を各リーグに1人ずつ分ける。リーグのあとに決勝トーナメントをするとき向き", balPic)}
      </div></div>
      <div class="field"><span>② 1リーグの${unit(e)}の数</span>
        <div class="size-pick" role="group" aria-label="1リーグの${unit(e)}の数">${[3, 4, 5, 6, 7, 8].map((k) => `<button type="button" class="size-b ${e.groupSize === k ? "cur" : ""} ${k - 1 > e.maxPerDay ? "over" : ""}" data-action="gsize" data-k="${k}" aria-pressed="${e.groupSize === k}">${k}${u}<small>1人${k - 1}試合</small></button>`).join("")}</div>
        <span class="faint">1日に1${u}${e.maxPerDay}試合までなら、${e.maxPerDay + 1}${u}リーグがちょうど1日。それより多いと2日に分けます(上限は「設定を変える」で変えられます)。</span>
      </div>
      <div class="plan-preview">${preview}</div>
    </div>
    <details class="more" ${ui.moreOpen ? "open" : ""}><summary>細かい設定</summary><div class="settings">
      <div class="field"><span>学校のばらし</span>
        <label class="check"><input type="checkbox" id="spread" data-change="spread" ${e.spreadSchools ? "checked" : ""}>同じ学校が同じリーグに固まらないようにする</label>
      </div>
      <div class="field"><span>入れ替えてよいランク差</span>
        <select class="select" id="tolerance" data-change="tolerance" ${e.spreadSchools && e.splitMethod === "level" ? "" : "disabled"}>
          <option value="0" ${e.tolerance === 0 ? "selected" : ""}>同じランクの選手同士だけ</option>
          <option value="1" ${e.tolerance === 1 ? "selected" : ""}>ランク差 1 までOK</option>
          <option value="2" ${e.tolerance === 2 ? "selected" : ""}>ランク差 2 までOK</option>
        </select>
      </div>
    </div></details>
    <div class="row" style="margin-top:18px">
      <button class="btn btn-aurora btn-lg" data-action="auto" ${n < 2 ? "disabled" : ""}>${e.leagues.length ? "この分け方で作り直す" : "リーグを作る"}</button>
      ${e.leagues.length ? `<span class="faint">作ったあと、各${unit(e)}の右の「◯へ」で別のリーグに動かせます。</span>` : ""}
    </div>
    ${confirm ? `<div class="confirm" style="margin-top:14px"><span><b>今のリーグ分けを作り直します。</b>手動で動かした分は戻ります。入力済みのスコアは消えません(同じ組み合わせの試合があればそのまま残ります)。</span><button class="btn btn-primary btn-sm" data-action="auto-yes">作り直す</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
  </section>`;

  if (!e.leagues.length) {
    return settings + `<section class="card"><p class="muted" style="margin:0">${n < 2 ? `先に「${unit(e)}」の画面で${unit(e)}を入れてください。` : "「リーグを作る」を押すと、ここに A・B・C… のリーグが並びます。"}</p></section>`;
  }
  const moveOpts = (cur) => e.leagues.map((_, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${letter(i)}へ</option>`).join("") + `<option value="-1" ${cur === -1 ? "selected" : ""}>外す</option>`;
  const cards = e.leagues.map((l, i) => {
    const ps = l.playerIds.map((id) => pm[id]).filter(Boolean);
    const cnt = {}; ps.forEach((p) => { const k = p.school.trim(); if (k) cnt[k] = (cnt[k] || 0) + 1; });
    const dups = Object.entries(cnt).filter(([, c]) => c > 1);
    const avg = ps.length ? (ps.reduce((s, p) => s + p.level, 0) / ps.length).toFixed(1) : "—";
    const range = ps.length ? `${Math.min(...ps.map((p) => p.level))}〜${Math.max(...ps.map((p) => p.level))}` : "—";
    return `<article class="card league-card ${lgClass(i)}">
      <div class="league-title"><span class="league-letter">${letter(i)}</span><div><h3>${letter(i)}リーグ</h3><span class="faint num">${count(e, ps.length)} · ${matchCount(ps.length)}試合</span></div></div>
      <div class="league-meta">
        <span class="chip num">ランク ${range}</span><span class="chip num">平均 ${avg}</span>
        ${dups.length ? dups.map(([s, c]) => `<span class="chip chip-warn">${esc(s)} ×${c}</span>`).join("") : ps.length ? `<span class="chip chip-ok">学校の重なりなし</span>` : ""}
      </div>
      <ul class="plist">${ps.map((p) => `<li>
        <span class="pname">${esc(pname(e, p))}<span class="pschool ${cnt[p.school.trim()] > 1 ? "dup" : ""}">${esc(p.school) || "学校未入力"}</span></span>
        ${levelMeter(p.level)}
        <select class="select move-select" id="mv-${p.id}" data-change="move" data-id="${p.id}" aria-label="${esc(pname(e, p))}の移動先">${moveOpts(i)}</select>
      </li>`).join("") || `<li><span class="faint">${unit(e)}がいません</span></li>`}</ul>
    </article>`;
  }).join("");
  const un = unassigned(e);
  const unCard = un.length ? `<article class="card">
      <div class="league-title"><span class="league-letter" style="background:var(--text-tertiary)">?</span><div><h3>どのリーグにも入っていない${unit(e)}</h3><span class="faint">あとから追加した${unit(e)}はここに入ります</span></div></div>
      <ul class="plist" style="margin-top:10px">${un.map((p) => `<li>
        <span class="pname">${esc(pname(e, p))}<span class="pschool">${esc(p.school)}</span></span>${levelMeter(p.level)}
        <select class="select move-select" id="mv-${p.id}" data-change="move" data-id="${p.id}" aria-label="${esc(pname(e, p))}の移動先">${moveOpts(-1)}</select>
      </li>`).join("")}</ul></article>` : "";
  return settings + `<div class="league-grid">${cards}${unCard}</div>`;
}

/* --- 試合と結果 --- */
function leaguePillsHTML(e) {
  return `<div class="league-pills" role="tablist" aria-label="リーグ">${e.leagues.map((l, i) => {
    const s = standings(e, l);
    return `<button class="league-pill ${lgClass(i)} ${l.id === ui.league ? "is-active" : ""}" data-action="pick-league" data-id="${l.id}" role="tab" aria-selected="${l.id === ui.league}" aria-label="${letter(i)}リーグ(${s.finished}/${s.total}試合終了)"><span class="lp-letter">${letter(i)}</span><small>${s.finished}/${s.total}</small></button>`;
  }).join("")}</div>`;
}

function hoshiHTML(e, li) {
  const l = e.leagues[li];
  const pm = playerMap(e);
  const s = standings(e, l);
  const anyDone = s.finished > 0;
  const head = l.playerIds.map((id) => `<th>${pnameStack(e, pm[id])}</th>`).join("");
  const body = s.rows.map((r) => {
    const cells = l.playerIds.map((cid) => {
      if (cid === r.id) return `<td class="self"></td>`;
      const o = outcome(e, r.id, cid);
      if (o.winner === r.id) return `<td class="win"><span class="mark">○</span><span class="sc">${scoreText(e, o)}</span></td>`;
      if (o.winner === cid) return `<td class="lose"><span class="mark">●</span><span class="sc">${scoreText(e, o)}</span></td>`;
      if (o.started) return `<td class="lose"><span class="sc">入力中</span></td>`;
      return `<td></td>`;
    }).join("");
    return `<tr class="${anyDone && r.rank === 1 ? "top" : ""}">
      <td class="name-cell"><span class="pname">${pnameStack(e, r.p)}</span><span class="pschool">${esc(r.p.school)}</span></td>${cells}
      <td class="stat">${r.w}</td><td class="stat">${r.l}</td><td class="stat">${signed(r.gw - r.gl)}</td><td class="stat">${signed(r.pf - r.pa)}</td>
      <td class="rank ${anyDone && r.rank === 1 ? "rank-1" : ""}">${anyDone ? r.rank : "—"}</td></tr>`;
  }).join("");
  return `<div class="table-wrap"><table class="hoshi">
    <thead><tr><th class="name-cell">${unit(e)}</th>${head}<th>勝</th><th>敗</th><th>得失<br>ゲーム</th><th>得失点</th><th>順位</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="tie-note"><b>順位の決め方</b>(BWF 一般競技規程 16.2 と同じ):① 勝ち数が多い順 ② 2人が並んだら直接対決の勝者が上 ③ 3人以上並んだら 得失ゲーム差 → 得失点差(途中で2人に絞れたら直接対決)。○ 勝ち ● 負け。「勝ち」ボタンだけで入れた試合は ${e.games === 1 ? "1-0" : "2-0"}(点数なし)として数えます。</p>
    ${s.lots ? `<p class="tie-note" style="color:var(--warn)">同じ順位の${unit(e)}がいます。ルールでは抽選で決めます。</p>` : ""}`;
}

function matchRowHTML(e, a, b) {
  const pm = playerMap(e);
  const o = outcome(e, a, b);
  const games = gamesOf(e, a, b);
  const wo = woOf(e, a, b);
  let inputs = "";
  for (let g = 0; g < e.games; g++) {
    const [x, y] = games[g] || [null, null];
    const bad = gameWarn(e, x, y);
    const k = keyOf(a, b);
    inputs += `<div class="game">${e.games > 1 ? `<span class="game-label">第${g + 1}G</span>` : ""}
      <input class="score ${bad ? "bad" : ""}" id="sc-${k}-${g}-${a}" inputmode="numeric" autocomplete="off" maxlength="2" data-input="score" data-a="${a}" data-b="${b}" data-g="${g}" data-s="0" value="${x ?? ""}" ${wo ? "disabled" : ""} aria-label="${esc(pname(e, pm[a]))} 第${g + 1}ゲームの点数">
      <span class="faint">-</span>
      <input class="score ${bad ? "bad" : ""}" id="sc-${k}-${g}-${b}" inputmode="numeric" autocomplete="off" maxlength="2" data-input="score" data-a="${a}" data-b="${b}" data-g="${g}" data-s="1" value="${y ?? ""}" ${wo ? "disabled" : ""} aria-label="${esc(pname(e, pm[b]))} 第${g + 1}ゲームの点数"></div>`;
  }
  inputs += woSelectHTML(e, a, b, wo, `id="wo-${keyOf(a, b)}" data-change="wo" data-a="${a}" data-b="${b}"`);
  return `<div class="match ${o.winner ? "is-done" : ""}" id="m-${keyOf(a, b)}">
    <div class="m-side a ${o.winner === a ? "win" : ""}"><span class="pname">${pnameStack(e, pm[a])}</span><span class="pschool">${esc(pm[a].school)}</span>${quickWinHTML(o, a, `data-action="qwin" data-a="${a}" data-b="${b}"`)}</div>
    <div class="m-scores">${inputs}</div>
    <div class="m-side b ${o.winner === b ? "win" : ""}"><span class="pname">${pnameStack(e, pm[b])}</span><span class="pschool">${esc(pm[b].school)}</span>${quickWinHTML(o, b, `data-action="qwin" data-a="${a}" data-b="${b}"`)}</div>
    <div class="m-status">${statusChip(e, a, b, o)}</div>
  </div>`;
}
function statusChip(e, a, b, o) {
  if (o.wo) return `<span class="chip chip-warn">不戦勝</span>`;
  if (o.quick) return `<span class="chip chip-ok">終了</span>`;
  const games = gamesOf(e, a, b);
  if (games.some(([x, y]) => gameWarn(e, x, y))) return `<span class="chip chip-warn" title="${e.points}点ゲームとして点数がおかしい可能性があります">点数を確認</span>`;
  if (extraGame(e, games)) return `<span class="chip chip-warn" title="もう勝ちが決まったあとのゲームに点が入っています">いらないゲームあり</span>`;
  if (o.winner) return `<span class="chip chip-ok">終了</span>`;
  if (o.started) return `<span class="chip chip-live">入力中</span>`;
  return `<span class="chip">未</span>`;
}

function matchesHTML(e) {
  if (!e.leagues.length) return `<section class="card"><p class="muted">先に「リーグ分け」でリーグを作ってください。</p><div class="row" style="margin-top:12px"><button class="btn btn-aurora btn-sm" data-action="tab" data-tab="leagues">リーグ分けへ</button></div></section>`;
  const li = Math.max(0, e.leagues.findIndex((l) => l.id === ui.league));
  const l = e.leagues[li];
  const pm = playerMap(e);
  const rounds = roundRobin(l.playerIds);
  let num = 0;
  const roundHTML = (r, ri) => `<div class="round">
      <div class="round-head"><h3>第${ri + 1}ラウンド</h3>${r.bye ? `<span class="bye">休み:${esc(pname(e, pm[r.bye]))}</span>` : ""}</div>
      ${r.pairs.map(([a, b]) => { num++; return matchRowHTML(e, a, b); }).join("")}
    </div>`;
  // 1日の上限を超えるときは「1日目/2日目…」に分ける(1ラウンド=1人1試合なので、上限ぶんのラウンドずつ)
  const days = splitDays(rounds, e.maxPerDay);
  let first = 0;
  const roundsHTML = days.length <= 1 ? rounds.map(roundHTML).join("")
    : days.map((d, di) => {
      const cnt = {};
      d.forEach((r) => r.pairs.flat().forEach((id) => (cnt[id] = (cnt[id] || 0) + 1)));
      const most = Math.max(0, ...Object.values(cnt));
      const range = d.length === 1 ? `第${first + 1}ラウンド` : `第${first + 1}〜${first + d.length}ラウンド`;
      const html = `<div class="day-head"><h3>${di + 1}日目</h3><span class="faint">${range}(1人${most}試合まで)</span></div>${d.map((r, k) => roundHTML(r, first + k)).join("")}`;
      first += d.length;
      return html;
    }).join("");
  const L = e.leagues.length;
  return `${L > 1 ? `<section class="league-switch" id="league-switch">
      <span class="switch-label">リーグを選ぶ</span>
      ${leaguePillsHTML(e)}
    </section>` : ""}
  <section class="card ${lgClass(li)}">
    <div class="card-head"><div class="title-with-letter"><span class="league-letter">${letter(li)}</span><div><h2>${letter(li)}リーグ 星取表</h2><p class="faint">スコアを入れると自動で更新されます。</p></div></div>
      <button class="btn btn-secondary btn-sm" data-action="x-hoshi-one" data-id="${l.id}">Excel にコピー</button></div>
    <div id="hoshi-${l.id}">${l.playerIds.length >= 2 ? hoshiHTML(e, li) : `<p class="muted">2人以上いると試合が組めます。</p>`}</div>
  </section>
  <section class="card ${lgClass(li)}">
    <div class="card-head"><div class="title-with-letter"><span class="league-letter">${letter(li)}</span><h2>${letter(li)}リーグ 対戦順とスコア入力</h2></div></div>
    <div class="card-head" style="margin-top:-8px"><div><p class="faint num">全${num}試合 · ${e.games === 1 ? `${e.points}点1ゲーム` : `${e.points}点3ゲーム(2ゲーム先取)`} · 1人 ${Math.max(0, l.playerIds.length - 1)} 試合${days.length > 1 ? ` · <b class="warn-text">1日${e.maxPerDay}試合までなので ${days.length} 日に分けています</b>` : ""}。同じラウンドの試合は同時に進められます。</p></div></div>
    <div class="stack">${roundsHTML || `<p class="muted">2人以上いると試合が組めます。</p>`}</div>
  </section>`;
}

function refreshMatch(e, a, b) {
  const row = document.getElementById(`m-${keyOf(a, b)}`);
  if (row) {
    const o = outcome(e, a, b);
    row.classList.toggle("is-done", !!o.winner);
    row.querySelector(".m-side.a").classList.toggle("win", o.winner === a);
    row.querySelector(".m-side.b").classList.toggle("win", o.winner === b);
    row.querySelectorAll(".qwin").forEach((bt) => { bt.outerHTML = quickWinHTML(o, bt.dataset.w, `data-action="qwin" data-a="${a}" data-b="${b}"`); });
    row.querySelector(".m-status").innerHTML = statusChip(e, a, b, o);
    const games = gamesOf(e, a, b);
    row.querySelectorAll(".game").forEach((gEl, gi) => {
      const [x, y] = games[gi] || [null, null];
      const bad = gameWarn(e, x, y);
      gEl.querySelectorAll(".score").forEach((inp) => inp.classList.toggle("bad", bad));
    });
  }
  const li = e.leagues.findIndex((l) => l.id === ui.league);
  const box = document.getElementById(`hoshi-${ui.league}`);
  if (box && li >= 0) box.innerHTML = hoshiHTML(e, li);
  const pills = document.querySelector(".league-pills");
  if (pills) pills.outerHTML = leaguePillsHTML(e);
  refreshHero(e);
}

/* --- 順位一覧 --- */
function overviewHTML(e) {
  if (!e.leagues.length) return `<section class="card"><p class="muted">リーグを作ると、ここに全リーグの順位が並びます。</p></section>`;
  const cards = e.leagues.map((l, i) => {
    const s = standings(e, l);
    const anyDone = s.finished > 0;
    return `<article class="card league-card ${lgClass(i)}">
      <div class="league-title"><span class="league-letter">${letter(i)}</span><div><h3>${letter(i)}リーグ</h3><span class="faint num">${s.finished}/${s.total} 試合終了</span></div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="mini">
        <thead><tr><th>順位</th><th>${unit(e)}</th><th style="text-align:right">勝</th><th style="text-align:right">敗</th><th style="text-align:right">得失点</th></tr></thead>
        <tbody>${s.sorted.map((r) => `<tr><td class="rank" style="${anyDone && r.rank === 1 ? "color:var(--lg)" : ""}">${anyDone ? r.rank : "—"}</td>
          <td><span class="pname">${esc(pname(e, r.p))}</span><span class="pschool">${esc(r.p.school)}</span></td>
          <td class="stat">${r.w}</td><td class="stat">${r.l}</td><td class="stat">${signed(r.pf - r.pa)}</td></tr>`).join("")}</tbody>
      </table></div></article>`;
  }).join("");
  return `<section class="card"><div class="card-head"><div><h2>全リーグの順位</h2><p class="faint">${esc(e.name)}(${esc(e.date)})</p></div>
    <button class="btn btn-secondary btn-sm" data-action="x-rank">順位表を Excel にコピー</button></div></section>
    <div class="overview">${cards}</div>`;
}

/* --- トーナメント --- */
function bracketHTML(e) {
  const both = e.mode === "both";
  const st = bracketState(e);
  const confirm = ui.confirm === "rebuild";
  if (both && !e.leagues.length) return `<section class="card"><p class="muted">決勝トーナメントは、リーグ戦の順位から作ります。先に「リーグ分け」でリーグを作ってください。</p><div class="row" style="margin-top:12px"><button class="btn btn-aurora btn-sm" data-action="tab" data-tab="leagues">リーグ分けへ</button></div></section>`;
  const settings = `<section class="card">
    <div class="card-head"><div><h2>${both ? "決勝トーナメントを作る" : "トーナメントを作る"}</h2><p class="faint">${both ? "今のリーグ順位で、A1位・B1位…の順にシードを決めます。" : `登録した${count(e, e.players.length)}を、強い順にシードを決めて並べます。`}人数が足りない枠は不戦勝になります。</p></div></div>
    ${both ? `<div class="settings" style="margin-bottom:16px"><div class="field"><span>各リーグから出る${unit(e)}</span>
        <select class="select" id="t-top" data-change="t-top">${[1, 2, 3, 4].map((k) => `<option value="${k}" ${e.tTop === k ? "selected" : ""}>上位 ${k} 位まで</option>`).join("")}</select></div></div>` : ""}
    ${dayLoadHTML(e)}
    ${seedBoxHTML(e)}
    <div class="row" style="margin-top:16px">
      <button class="btn btn-aurora" data-action="build" ${e.players.length < 2 ? "disabled" : ""}>${st ? "作り直す" : "トーナメントを作る"}</button>
      ${st && ui.seedDirty ? `<span class="chip chip-warn">シードを変えました。「作り直す」で表に反映されます</span>` : ""}
    </div>
    <details class="more" ${ui.moreOpen ? "open" : ""}><summary>細かい設定</summary>
      <div class="settings">
        <div class="field"><span>3位決定戦</span>
          <label class="check"><input type="checkbox" id="t-third" data-change="t-third" ${e.tThird ? "checked" : ""}>する</label>
        </div>
        <div class="field"><span>学校のばらし</span>
          <label class="check"><input type="checkbox" id="t-spread" data-change="spread" ${e.spreadSchools ? "checked" : ""}>同じ学校が早い回戦で当たらないようにする</label>
        </div>
      </div>
    </details>
    ${confirm ? `<div class="confirm" style="margin-top:14px"><span><b>トーナメントを作り直します。</b>組み合わせが変わり、入力したトーナメントの結果は消えます(リーグ戦の結果はそのまま)。</span><button class="btn btn-primary btn-sm" data-action="build-yes">作り直す</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
  </section>`;
  if (!st) return settings;

  const pm = playerMap(e);
  const sel = st && ui.bmatch ? findNode(st, ui.bmatch) : null;
  const opts = st.slots.map((id, i) => (id ? `<option value="${i}">${i + 1}. ${esc(pname(e, pm[id]))}</option>` : "")).join("");
  return settings + `
  <section class="card">
    <div class="card-head"><div><h2>トーナメント表</h2><p class="faint">四角の数字が試合番号。押すとスコアを入れられます。勝ち上がった線が色つきになります。</p></div>
      <button class="btn btn-secondary btn-sm" data-action="x-bracket">Excel にコピー</button></div>
    <div class="ranks" id="branks">${ranksHTML(e, st)}</div>
    <div class="bracket-wrap"><div id="bracket-svg">${bracketSVG(e, st)}</div></div>
  </section>
  <section class="card" id="bpanel">${bpanelHTML(e, st, sel)}</section>
  <section class="card">
    <div class="card-head"><div><h2>試合一覧</h2><p class="faint">試合番号の順。押すとスコア入力が開きます。</p></div></div>
    <div class="bm-list" id="bm-list">${bmListHTML(e, st)}</div>
  </section>
  <section class="card">
    <details class="more" style="margin:0;padding:0;border:0"><summary>組み合わせを手で入れ替える</summary>
      <p class="faint" style="margin:10px 0">2人(2組)を選んで場所を交換します。もう入れた結果は、同じ対戦が残っていればそのまま使われます。</p>
      <div class="row">
        <select class="select" id="swap-a" aria-label="入れ替える1つ目">${opts}</select>
        <span class="faint">と</span>
        <select class="select" id="swap-b" aria-label="入れ替える2つ目">${opts}</select>
        <button class="btn btn-secondary btn-sm" data-action="bswap">入れ替える</button>
      </div>
    </details>
  </section>`;
}

/* 1人が1日に何試合になるか(リーグ戦 + トーナメント)を見て、上限を超えるなら知らせる */
function dayLoadHTML(e) {
  const entrants = e.mode === "both" ? e.leagues.length * e.tTop : e.players.length;
  if (entrants < 2) return "";
  const K = Math.ceil(Math.log2(entrants));
  const L = e.mode === "both" && e.leagues.length ? Math.max(...e.leagues.map((l) => l.playerIds.length)) - 1 : 0;
  const total = L + K;
  const head = e.mode === "both" ? `リーグ戦で最大 ${L} 試合 + 決勝トーナメントで最大 ${K} 試合 = 1人 最大 ${total} 試合` : `勝ち進むと1人 最大 ${K} 試合`;
  const over = total > e.maxPerDay;
  return `<p class="day-load ${over ? "is-over" : ""}">${head}。${over
    ? (e.mode === "both" ? `1日${e.maxPerDay}試合を超えるので、決勝トーナメントは別の日にするか、各リーグから出る${unit(e)}を減らしてください。` : `1日${e.maxPerDay}試合を超えるので、途中の回戦で日を分けてください。`)
    : `1日${e.maxPerDay}試合に収まります。`}</p>`;
}

/* シードを手で決める欄。決めた番号の位置に固定し、残りは自動 */
function seedBoxHTML(e) {
  const pm = playerMap(e);
  const { list } = bracketCandidates(e);
  if (list.length < 2) return "";
  const both = e.mode === "both";
  const rows = (both ? list : list.slice().sort((a, b) => (e.seeds[a.id] || 99) - (e.seeds[b.id] || 99) || pm[b.id].level - pm[a.id].level || pname(e, pm[a.id]).localeCompare(pname(e, pm[b.id]), "ja")))
    .map((x) => pm[x.id]).filter(Boolean);
  const max = Math.min(list.length, 16);
  const set = rows.filter((p) => e.seeds[p.id]).length;
  const opts = (cur) => `<option value="">—</option>` + Array.from({ length: max }, (_, k) => k + 1)
    .map((k) => `<option value="${k}" ${cur === k ? "selected" : ""}>第${k}シード</option>`).join("");
  return `<details class="seedbox" ${ui.seedOpen ? "open" : ""}>
    <summary>シードを自分で決める${set ? `<span class="chip chip-live">${set}${isDbl(e) ? "組" : "人"} 指定中</span>` : `<span class="faint">(決めなければランク順で自動)</span>`}</summary>
    <p class="faint" style="margin:10px 0 12px">決めた${unit(e)}は、その番号のシード位置に入ります。第1と第2は決勝まで当たらず、第3・第4はそれぞれ別のブロックに分かれます。決めていない${unit(e)}は、残りの位置にランク順で入ります。</p>
    <div class="seed-list">${rows.map((p) => `<div class="seed-row ${e.seeds[p.id] ? "is-set" : ""}">
        <span class="pname">${esc(pname(e, p))}<span class="pschool">${esc(p.school)}${both ? "" : ` · ランク ${p.level}`}</span></span>
        <select class="select seed-select" id="seed-${p.id}" data-change="seed" data-id="${p.id}" aria-label="${esc(pname(e, p))}のシード">${opts(e.seeds[p.id] || 0)}</select>
      </div>`).join("")}</div>
    ${set ? `<div class="row" style="margin-top:10px"><button class="btn btn-ghost btn-sm" data-action="seed-clear">シードの指定をすべて解除</button></div>` : ""}
  </details>`;
}

function ranksHTML(e, st) {
  const pm = playerMap(e);
  const f = st.final;
  const champ = st.champion && st.champion !== "?" ? st.champion : null;
  const runner = f.real && f.o && f.o.winner ? (f.o.winner === f.a ? f.b : f.a) : null;
  let thirds = [];
  if (st.third) { if (st.third.o && st.third.o.winner) thirds = [st.third.o.winner]; }
  else if (st.K >= 2) st.rounds[st.K - 2].forEach((s) => { if (s.real && s.o && s.o.winner) thirds.push(s.o.winner === s.a ? s.b : s.a); });
  const card = (label, id) => `<div class="rank-card"><span class="kicker">${label}</span><b>${id ? esc(pname(e, pm[id])) : "—"}</b>${id ? `<span class="pschool">${esc(pm[id].school)}</span>` : ""}</div>`;
  return card("優勝", champ) + card("準優勝", runner) + (thirds.length ? thirds.map((id) => card("3位", id)).join("") : card("3位", null));
}

function bracketSVG(e, st) {
  const pm = playerMap(e);
  const { N, K, rounds, slots } = st;
  const rowH = 28, colW = 46, gap = 170, top = 62;
  const nameW = isDbl(e) ? 260 : 210;
  const half = N / 2;
  const leafY = {};
  let maxRows = 0;
  [0, 1].forEach((h) => {
    let y = top;
    for (let s = h * half; s < (h + 1) * half; s++) if (slots[s]) { leafY[s] = y; y += rowH; }
    maxRows = Math.max(maxRows, (y - top) / rowH);
  });
  const W = 2 * (nameW + (K - 1) * colW) + gap;
  const cx = W / 2;
  const X = (h, r) => (h === 0 ? nameW + r * colW : W - (nameW + r * colW));
  const yOf = {};
  rounds.forEach((nodes, ri) => nodes.forEach((n) => {
    const ys = ri === 0 ? [leafY[2 * n.i], leafY[2 * n.i + 1]] : [yOf[rounds[ri - 1][2 * n.i].mid], yOf[rounds[ri - 1][2 * n.i + 1].mid]];
    const ok = ys.filter((v) => v != null);
    n.childY = ys;
    yOf[n.mid] = ok.length === 2 ? (ok[0] + ok[1]) / 2 : ok.length ? ok[0] : null;
  }));
  const bottom = top + maxRows * rowH;
  const thirdY = bottom + 46;
  const H = st.third ? thirdY + 30 : bottom + 14;
  let out = "";
  const box = (n, x, y) => {
    const cls = `bnode ${n.o && n.o.winner ? "done" : ""} ${ui.bmatch === n.mid ? "sel" : ""}`;
    return `<g class="${cls}" data-action="bpick" data-mid="${n.mid}" role="button" aria-label="第${n.num}試合"><rect x="${x - 14}" y="${y - 10}" width="28" height="20" rx="7"/><text x="${x}" y="${y + 4}">${n.num}</text></g>`;
  };
  const scoreLabel = (n, x, y) => (n.o && n.o.winner ? `<text class="bsc" x="${x}" y="${y - 6}">${scoreText(e, n.o)}</text>` : "");
  const hl = (n, childOut) => n.real && n.o && n.o.winner && n.o.winner === childOut;

  // 名前
  slots.forEach((id, s) => {
    if (!id) return;
    const h = s < half ? 0 : 1;
    const x = h === 0 ? nameW - 8 : W - nameW + 8;
    const champ = st.champion === id ? " champ" : "";
    const sd = e.bracket.seeds && e.bracket.seeds[id];
    const mark = sd ? `<tspan class="bseed">[${sd}]</tspan> ` : "";
    out += `<text class="bt${champ}" x="${x}" y="${leafY[s] + 4}" text-anchor="${h === 0 ? "end" : "start"}">${mark}${esc(pname(e, pm[id]))}<tspan class="bs"> ${esc(pm[id].school)}</tspan></text>`;
  });
  // 決勝以外の回戦
  for (let ri = 0; ri < K - 1; ri++) {
    const per = rounds[ri].length;
    rounds[ri].forEach((n) => {
      const y = yOf[n.mid];
      if (y == null) return;
      const h = n.i < per / 2 ? 0 : 1;
      [0, 1].forEach((c) => {
        const cy = n.childY[c];
        if (cy == null) return;
        const childOut = ri === 0 ? slots[2 * n.i + c] : rounds[ri - 1][2 * n.i + c].out;
        out += `<path class="bl${hl(n, childOut) ? " hl" : ""}" d="M${X(h, ri)} ${cy}H${X(h, ri + 1)}V${y}"/>`;
      });
      if (n.real) {
        out += box(n, X(h, ri + 1), y);
        out += scoreLabel(n, X(h, ri + 1) + (h === 0 ? colW / 2 : -colW / 2), y);
      }
    });
  }
  // 決勝
  const f = st.final;
  const fy = yOf[f.mid];
  [0, 1].forEach((c) => {
    const cy = f.childY[c];
    if (cy == null) return;
    const childOut = K === 1 ? slots[c] : rounds[K - 2][c].out;
    out += `<path class="bl${hl(f, childOut) ? " hl" : ""}" d="M${X(c, K - 1)} ${cy}H${cx}V${fy}"/>`;
  });
  if (f.real) {
    out += box(f, cx, fy);
    out += `<text class="blabel" x="${cx}" y="22">決勝</text>`;
    if (st.champion && st.champion !== "?") out += `<text class="bchamp" x="${cx}" y="40">優勝 ${esc(pname(e, pm[st.champion]))}</text>`;
    out += scoreLabel(f, cx, fy + 30);
  }
  if (K >= 2) out += `<text class="blabel" x="${nameW / 2}" y="22">Aブロック</text><text class="blabel" x="${W - nameW / 2}" y="22">Bブロック</text>`;
  // 3位決定戦
  const t = st.third;
  if (t) {
    const nm = (id) => (id && id !== "?" ? esc(pname(e, pm[id])) : "(準決勝の敗者)");
    out += `<text class="blabel" x="${cx}" y="${thirdY - 20}">3位決定戦</text>
      <text class="bt" x="${cx - 70}" y="${thirdY + 4}" text-anchor="end">${nm(t.a)}</text>
      <text class="bt" x="${cx + 70}" y="${thirdY + 4}" text-anchor="start">${nm(t.b)}</text>
      <path class="bl${hl(t, t.a) ? " hl" : ""}" d="M${cx - 64} ${thirdY}H${cx}"/>
      <path class="bl${hl(t, t.b) ? " hl" : ""}" d="M${cx + 64} ${thirdY}H${cx}"/>
      ${box(t, cx, thirdY)}`;
  }
  return `<svg class="bracket-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="トーナメント表">${out}</svg>`;
}

function sideName(e, n, side) {
  const id = side === 0 ? n.a : n.b;
  const pm = playerMap(e);
  if (id && id !== "?" && pm[id]) return { html: `<span class="pname">${pnameStack(e, pm[id])}</span><span class="pschool">${esc(pm[id].school)}</span>`, text: pname(e, pm[id]) };
  const s = sourceLabel(n, side);
  return { html: `<span class="pname faint">${s}</span>`, text: s };
}

function bmListHTML(e, st) {
  return bracketMatches(st).map((n) => {
    const A = sideName(e, n, 0), B = sideName(e, n, 1);
    const w = n.o && n.o.winner;
    const status = w ? `<span class="chip chip-ok num">${scoreText(e, n.o) || "終了"}</span>` : n.o && n.o.started ? `<span class="chip chip-live">入力中</span>` : `<span class="chip">未</span>`;
    const nameA = w === n.a ? `<b>${esc(A.text)}</b>` : esc(A.text);
    const nameB = w === n.b ? `<b>${esc(B.text)}</b>` : esc(B.text);
    return `<button class="bm-row ${ui.bmatch === n.mid ? "is-sel" : ""}" data-action="bpick" data-mid="${n.mid}">
      <span class="bm-num">${n.num}</span><span class="bm-round">${n.label}</span>
      <span class="bm-vs">${nameA} <span class="faint">対</span> ${nameB}</span>${status}</button>`;
  }).join("");
}

function bpanelHTML(e, st, n) {
  if (!n) return `<p class="muted" style="margin:0">トーナメント表の試合番号か、下の試合一覧を押すと、ここでスコアを入れられます。</p>`;
  const A = sideName(e, n, 0), B = sideName(e, n, 1);
  const ready = n.a && n.a !== "?" && n.b && n.b !== "?";
  let inputs = "";
  if (ready) {
    const res = e.bracket.results[n.mid];
    const same = res && res.a === n.a && res.b === n.b;
    const games = same ? res.g : [];
    const wo = same ? res.wo || null : null;
    for (let g = 0; g < e.games; g++) {
      const [x, y] = games[g] || [null, null];
      const bad = gameWarn(e, x, y);
      inputs += `<div class="game">${e.games > 1 ? `<span class="game-label">第${g + 1}G</span>` : ""}
        <input class="score ${bad ? "bad" : ""}" id="bs-${n.mid}-${g}-0" inputmode="numeric" autocomplete="off" maxlength="2" data-input="bscore" data-mid="${n.mid}" data-g="${g}" data-s="0" value="${x ?? ""}" ${wo ? "disabled" : ""} aria-label="${esc(A.text)} 第${g + 1}ゲームの点数">
        <span class="faint">-</span>
        <input class="score ${bad ? "bad" : ""}" id="bs-${n.mid}-${g}-1" inputmode="numeric" autocomplete="off" maxlength="2" data-input="bscore" data-mid="${n.mid}" data-g="${g}" data-s="1" value="${y ?? ""}" ${wo ? "disabled" : ""} aria-label="${esc(B.text)} 第${g + 1}ゲームの点数"></div>`;
    }
    inputs += woSelectHTML(e, n.a, n.b, wo, `id="bwo-${n.mid}" data-change="bwo" data-mid="${n.mid}"`);
  }
  const w = n.o && n.o.winner;
  return `<div class="card-head"><div class="title-with-letter"><span class="league-letter" style="--lg:var(--accent);--on-lg:var(--accent-text);font-size:1.2rem">${n.num}</span><div><h2>第${n.num}試合</h2><span class="faint">${n.label}</span></div></div>
      <button class="btn btn-ghost btn-sm" data-action="bclose">閉じる</button></div>
    ${ready ? `<div class="match ${w ? "is-done" : ""}" id="bp-match">
      <div class="m-side a ${w === n.a ? "win" : ""}">${A.html}${quickWinHTML(n.o, n.a, `data-action="bqwin" data-mid="${n.mid}"`)}</div>
      <div class="m-scores">${inputs}</div>
      <div class="m-side b ${w === n.b ? "win" : ""}">${B.html}${quickWinHTML(n.o, n.b, `data-action="bqwin" data-mid="${n.mid}"`)}</div>
      <div class="m-status" id="bp-status">${bStatusChip(e, n)}</div>
    </div>` : `<p class="muted" style="margin:0">${esc(A.text)} 対 ${esc(B.text)}。前の試合の結果が入ると、対戦相手が決まります。</p>`}`;
}
function bStatusChip(e, n) {
  const res = e.bracket.results[n.mid];
  const games = res && res.a === n.a && res.b === n.b ? res.g : [];
  if (n.o && n.o.wo) return `<span class="chip chip-warn">不戦勝</span>`;
  if (n.o && n.o.quick) return `<span class="chip chip-ok">終了</span>`;
  if (games.slice(0, e.games).some(([x, y]) => gameWarn(e, x, y))) return `<span class="chip chip-warn">点数を確認</span>`;
  if (extraGame(e, games)) return `<span class="chip chip-warn">いらないゲームあり</span>`;
  if (n.o && n.o.winner) return `<span class="chip chip-ok">終了</span>`;
  if (n.o && n.o.started) return `<span class="chip chip-live">入力中</span>`;
  return `<span class="chip">未</span>`;
}

function refreshBracket(e, mid) {
  const st = bracketState(e);
  if (!st) return;
  const n = findNode(st, mid);
  const svg = document.getElementById("bracket-svg"); if (svg) svg.innerHTML = bracketSVG(e, st);
  const list = document.getElementById("bm-list"); if (list) list.innerHTML = bmListHTML(e, st);
  const ranks = document.getElementById("branks"); if (ranks) ranks.innerHTML = ranksHTML(e, st);
  const row = document.getElementById("bp-match");
  if (row && n) {
    const w = n.o && n.o.winner;
    row.classList.toggle("is-done", !!w);
    row.querySelector(".m-side.a").classList.toggle("win", w === n.a);
    row.querySelector(".m-side.b").classList.toggle("win", w === n.b);
    row.querySelectorAll(".qwin").forEach((bt) => { bt.outerHTML = quickWinHTML(n.o, bt.dataset.w, `data-action="bqwin" data-mid="${n.mid}"`); });
    document.getElementById("bp-status").innerHTML = bStatusChip(e, n);
    const res = e.bracket.results[mid];
    const games = res ? res.g : [];
    row.querySelectorAll(".game").forEach((gEl, gi) => {
      const [x, y] = games[gi] || [null, null];
      gEl.querySelectorAll(".score").forEach((inp) => inp.classList.toggle("bad", gameWarn(e, x, y)));
    });
  }
  refreshHero(e);
}

function copyBoxHTML() {
  return `<section class="card copybox"><div class="card-head"><div><h3>コピー用テキスト</h3><p class="faint">自動でコピーできなかったので、下を全部選んでコピーし、Excel に貼り付けてください。</p></div><button class="btn btn-ghost btn-sm" data-action="close-copy">閉じる</button></div>
    <textarea class="input" id="copy-area" readonly>${esc(ui.copyText)}</textarea></section>`;
}

/* ============ Excel への書き出し ============ */
// 「2-1」「21-15」は Excel で日付に化けるので、全角の「－」でつなぐ
function xlScore(e, o) { return o.wo ? "不戦" : o.quick ? "" : e.games === 1 ? `${o.pa}－${o.pb}` : `${o.ga}－${o.gb}`; }
function xlGames(e, games) {
  const out = [];
  for (let g = 0; g < e.games; g++) { const [x, y] = games[g] || [null, null]; out.push(x == null || y == null ? "" : `${x}－${y}`); }
  return out;
}
function gameHeads(e) { return e.games === 1 ? ["スコア"] : ["第1ゲーム", "第2ゲーム", "第3ゲーム"]; }

/* 星取表(1リーグ) */
function hoshiBlock(e, li) {
  const l = e.leagues[li];
  const pm = playerMap(e);
  const s = standings(e, l);
  const anyDone = s.finished > 0;
  const rows = [[unit(e), "学校", ...l.playerIds.map((id) => pname(e, pm[id])), "勝", "敗", "得失ゲーム", "得失点", "順位"]];
  s.rows.forEach((r) => {
    const cells = l.playerIds.map((cid) => {
      if (cid === r.id) return "＼";
      const o = outcome(e, r.id, cid);
      return o.winner ? (o.winner === r.id ? "○" : "●") + xlScore(e, o) : "";
    });
    rows.push([pname(e, r.p), r.p.school, ...cells, r.w, r.l, r.gw - r.gl, r.pf - r.pa, anyDone ? r.rank : ""]);
  });
  return { title: `${letter(li)}リーグ 星取表`, rows };
}
/* 順位表(全リーグ) */
function standingsBlock(e) {
  const rows = [["リーグ", "順位", unit(e), "学校", "試合", "勝", "敗", "得失ゲーム", "得失点"]];
  e.leagues.forEach((l, li) => {
    const s = standings(e, l);
    s.sorted.forEach((r) => rows.push([`${letter(li)}リーグ`, s.finished ? r.rank : "", pname(e, r.p), r.p.school, r.played, r.w, r.l, r.gw - r.gl, r.pf - r.pa]));
  });
  return { title: "順位表", rows };
}
/* 試合結果の一覧(リーグ戦の全試合) */
function leagueMatchesBlock(e) {
  const pm = playerMap(e);
  const rows = [["リーグ", "ラウンド", `${unit(e)}1`, "学校", `${unit(e)}2`, "学校", ...gameHeads(e), "勝者"]];
  e.leagues.forEach((l, li) => {
    roundRobin(l.playerIds).forEach((r, ri) => r.pairs.forEach(([a, b]) => {
      const o = outcome(e, a, b);
      const g = o.wo ? [`${pname(e, pm[o.wo])} 棄権`, ...new Array(e.games - 1).fill("")] : xlGames(e, gamesOf(e, a, b));
      rows.push([`${letter(li)}リーグ`, ri + 1, pname(e, pm[a]), pm[a].school, pname(e, pm[b]), pm[b].school, ...g, o.winner ? pname(e, pm[o.winner]) : ""]);
    }));
  });
  return { title: "試合結果の一覧", rows };
}
/* トーナメントの結果 */
function bracketBlocks(e) {
  const st = bracketState(e);
  const pm = playerMap(e);
  const rows = [["試合番号", "回戦", `${unit(e)}1`, "学校", `${unit(e)}2`, "学校", ...gameHeads(e), "勝者"]];
  bracketMatches(st).forEach((n) => {
    const A = sideName(e, n, 0), B = sideName(e, n, 1);
    const res = e.bracket.results[n.mid];
    const games = res && res.a === n.a && res.b === n.b ? res.g : [];
    const w = n.o && n.o.winner;
    const g = n.o && n.o.wo ? [`${pname(e, pm[n.o.wo])} 棄権`, ...new Array(e.games - 1).fill("")] : xlGames(e, games);
    rows.push([n.num, n.label, A.text, pm[n.a] ? pm[n.a].school : "", B.text, pm[n.b] ? pm[n.b].school : "", ...g, w ? pname(e, pm[w]) : ""]);
  });
  const f = st.final;
  const champ = st.champion && st.champion !== "?" ? st.champion : null;
  const runner = f.real && f.o && f.o.winner ? (f.o.winner === f.a ? f.b : f.a) : null;
  const thirds = st.third ? (st.third.o && st.third.o.winner ? [st.third.o.winner] : [])
    : st.K >= 2 ? st.rounds[st.K - 2].filter((s) => s.real && s.o && s.o.winner).map((s) => (s.o.winner === s.a ? s.b : s.a)) : [];
  const rank = [["順位", unit(e), "学校"]];
  const add = (label, id) => rank.push([label, id ? pname(e, pm[id]) : "", id ? pm[id].school : ""]);
  add("優勝", champ); add("準優勝", runner);
  if (thirds.length) thirds.forEach((id) => add("3位", id)); else add("3位", null);
  return [{ title: "トーナメント 最終順位", rows: rank }, { title: "トーナメント 試合結果", rows }];
}

/* 表をクリップボードへ。Excel は HTML の表を受け取るので両方入れる。文字のセルは「文字列」指定 */
function copyTables(blocks, what) {
  const e = ev();
  const width = Math.max(2, ...blocks.flatMap((b) => b.rows.map((r) => r.length)));
  const text = [`${e.name}\t${e.date}`, ...blocks.map((b) => [b.title, ...b.rows.map((r) => r.join("\t"))].join("\n"))].join("\n\n");
  const td = (v, head) => {
    const st = (head ? "font-weight:bold;background:#eef0f7;" : "") + "border:1px solid #c8cad3;";
    return typeof v === "number" ? `<td style="${st}">${v}</td>` : `<td style="${st}mso-number-format:'\\@'">${esc(v)}</td>`;
  };
  const html = `<meta charset="utf-8"><table>`
    + `<tr><td colspan="${width}" style="font-weight:bold;font-size:14pt">${esc(e.name)} ${esc(e.date)}</td></tr>`
    + blocks.map((b) => `<tr><td colspan="${width}"></td></tr><tr><td colspan="${width}" style="font-weight:bold">${esc(b.title)}</td></tr>`
      + b.rows.map((r, i) => `<tr>${r.map((v) => td(v, i === 0)).join("")}</tr>`).join("")).join("")
    + `</table>`;
  const done = () => { ui.copyText = null; render(); toast(`${what}をコピーしました。Excel で貼りたいセルを選んで Ctrl+V`); };
  const fail = () => { ui.copyText = text; render(); const ta = document.getElementById("copy-area"); if (ta) { ta.scrollIntoView({ block: "center" }); ta.focus(); ta.select(); } };
  const plain = () => { try { navigator.clipboard.writeText(text).then(done, fail); } catch (err) { fail(); } };
  try {
    if (navigator.clipboard && navigator.clipboard.write && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({
        "text/plain": new Blob([text], { type: "text/plain" }),
        "text/html": new Blob([html], { type: "text/html" }),
      })]).then(done, plain);
    } else if (navigator.clipboard && navigator.clipboard.writeText) plain();
    else fail();
  } catch (err) { plain(); }
}

/* ============ 取り込み・サンプル ============ */
const PAIR_SEP = /[・\/／&＆]/;
const toHalf = (s) => String(s || "").replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)).trim();

/* ---- Excel 名簿の取り込み:列を見分けて、取り込む前に表で見せる ---- */
const IMP_ROLES = [["name", "名前"], ["name2", "2人目(ダブルス)"], ["school", "学校"], ["level", "ランク(1〜5)"], ["rank", "部内順位(1が強い)"], ["skip", "使わない"]];
const IMP_KW = [
  [/2人目|パートナー|相方/, "name2"],
  [/名前|氏名|選手|プレーヤー|プレイヤー|ペア|1人目|^name$/i, "name"],
  [/学校|所属|チーム|校名|団体|クラブ/, "school"],
  [/実力|ランク|レベル|強さ|^level$/i, "level"],
  [/順位|ランキング|序列/, "rank"],
  [/^no\.?$|番号|学年|^年$|^組$|ふりがな|フリガナ|よみ|かな|性別|備考|学籍|^#$/i, "skip"],
];
const SCHOOL_RE = /(高校|高等学校|高|中学校|中学|中|学園|学院|大学|小学校|小)$/;

function parseTable(text) {
  const lines = text.replace(/\r\n?/g, "\n").split("\n");
  const tab = lines.some((l) => l.includes("\t"));
  return lines.map((l) => l.split(tab ? "\t" : ",").map((c) => c.trim().replace(/^"(.*)"$/, "$1")))
    .filter((r) => r.some((c) => c !== ""));
}
function roleOfHeader(h) { for (const [re, r] of IMP_KW) if (re.test(h)) return r; return null; }
function guessRoles(rows, header, dbl) {
  const width = Math.max(...rows.map((r) => r.length));
  const body = header ? rows.slice(1) : rows;
  const roles = new Array(width).fill(null);
  const taken = (r) => roles.includes(r);
  if (header) rows[0].forEach((h, j) => {
    let r = roleOfHeader(h);
    if (r === "name" && taken("name")) r = dbl && !taken("name2") ? "name2" : "skip";
    else if (r && r !== "skip" && taken(r)) r = "skip";
    roles[j] = r;
  });
  for (let j = 0; j < width; j++) {
    if (roles[j]) continue;
    const vals = body.map((r) => (r[j] || "").trim()).filter(Boolean);
    if (!vals.length) { roles[j] = "skip"; continue; }
    const nums = vals.map((v) => (/^[0-9０-９]+$/.test(v) ? parseInt(toHalf(v), 10) : null));
    if (nums.every((n) => n !== null)) {
      const seq = vals.length > 2 && nums.every((n, i) => n === nums[0] + i);
      roles[j] = !seq && !taken("level") && nums.every((n) => n >= 1 && n <= 10) ? "level" : "skip";
      continue;
    }
    const schoolish = vals.filter((v) => SCHOOL_RE.test(v)).length >= vals.length * 0.6;
    const repeats = vals.length >= 3 && new Set(vals).size < vals.length * 0.8;
    if ((schoolish || repeats) && !taken("school")) roles[j] = "school";
    else if (!taken("name")) roles[j] = "name";
    else if (dbl && !taken("name2")) roles[j] = "name2";
    else if (!taken("school")) roles[j] = "school";
    else roles[j] = "skip";
  }
  return roles;
}
function analyzeImport(text, dbl) {
  if (!text.trim()) return null;
  if (!/[\t,]/.test(text)) return { text, free: true };
  const rows = parseTable(text);
  if (!rows.length) return null;
  // 見出しの行:見出しの言葉があり、数字だけのセルがない行(「選手1 / 東高 / 10」はデータとみなす)
  const header = rows.length > 1 && rows[0].some((c) => roleOfHeader(c)) && !rows[0].some((c) => /^[0-9０-９]+$/.test(c.trim()));
  return { text, free: false, rows, header, roles: guessRoles(rows, header, dbl) };
}
/* 今の列の割り当てで、実際に入る選手を作る。空の行と、もういる名前はとばす */
function buildImport(e) {
  const imp = ui.imp;
  if (!imp) return { players: [], empty: 0, dup: 0 };
  const dbl = isDbl(e);
  let players;
  if (imp.free) players = parsePaste(imp.text, dbl);
  else {
    const body = imp.header ? imp.rows.slice(1) : imp.rows;
    const ci = Object.fromEntries(["name", "name2", "school", "level", "rank"].map((r) => [r, imp.roles.indexOf(r)]));
    if (ci.name < 0) return { players: [], empty: 0, dup: 0, noName: true };
    const n = body.length;
    // ランクの列に 6 以上があれば 1〜10 の表とみなして 1〜5 に換算する
    const lvVals = ci.level >= 0 ? body.map((r) => parseInt(toHalf(r[ci.level]), 10)).filter((v) => v > 0) : [];
    const tenScale = lvVals.some((v) => v > RANK_MAX);
    players = body.map((r) => {
      let name = (r[ci.name] || "").trim();
      let name2 = ci.name2 >= 0 ? (r[ci.name2] || "").trim() : "";
      if (dbl && !name2 && PAIR_SEP.test(name)) [name, name2 = ""] = name.split(PAIR_SEP).map((s) => s.trim());
      let level = 3;
      if (ci.level >= 0) { const v = parseInt(toHalf(r[ci.level]), 10); if (v) level = tenScale ? to5(v) : clamp(v, 1, RANK_MAX); }
      else if (ci.rank >= 0) { const v = parseInt(toHalf(r[ci.rank]), 10); if (v) level = clamp(RANK_MAX - Math.floor(((v - 1) * RANK_MAX) / Math.max(n, 1)), 1, RANK_MAX); }
      return { id: uid(), name, name2, school: ci.school >= 0 ? (r[ci.school] || "").trim() : "", level };
    });
  }
  const key = (p) => `${p.name}|${p.name2 || ""}`.replace(/[\s　]+/g, "");
  const have = new Set(e.players.map(key));
  let empty = 0, dup = 0;
  const out = [];
  players.forEach((p) => {
    if (!p.name) { empty++; return; }
    const k = key(p);
    if (have.has(k)) { dup++; return; }
    have.add(k); out.push(p);
  });
  return { players: out, empty, dup };
}

function parsePaste(text, dbl) {
  const out = [];
  text.split(/\r?\n/).forEach((line) => {
    if (!line.trim()) return;
    const sep = line.includes("\t") || line.includes(",") || line.includes("、");
    let cols = line.includes("\t") ? line.split("\t") : line.includes(",") ? line.split(",") : line.includes("、") ? line.split("、") : line.trim().split(/\s{2,}|　+/);
    if (cols.length === 1) cols = line.trim().split(/\s+/);
    cols = cols.map((c) => c.trim()).filter((c, i) => c !== "" || i < 2);
    if (!cols[0] || /^(名前|氏名|選手|ペア|1人目)/.test(cols[0])) return;
    if (dbl) { out.push(parsePairCols(cols, sep)); return; }
    // 「山田 太郎 桜ヶ丘高 8」のように名前に空白が入っているとき:最後が数字ならランク、その前が学校
    let level = 3;
    const last = cols[cols.length - 1];
    const lvNum = parseInt(String(last).replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)), 10);
    if (cols.length >= 2 && /^[0-9０-９]+$/.test(String(last))) { level = lvNum > RANK_MAX ? to5(lvNum) : clamp(lvNum, 1, RANK_MAX); cols = cols.slice(0, -1); }
    let name, school = "";
    if (cols.length >= 3 && !line.includes("\t") && !line.includes(",")) { school = cols[cols.length - 1]; name = cols.slice(0, -1).join(" "); }
    else { name = cols[0]; school = cols[1] || ""; }
    out.push({ id: uid(), name, name2: "", school, level });
  });
  return out;
}
/* ダブルス1行:「1人目 2人目 学校 ランク」/「山田・佐藤 学校 ランク」 */
function parsePairCols(cols, sep) {
  let level = 3;
  const last = String(cols[cols.length - 1]);
  if (cols.length >= 2 && /^[0-9０-９]+$/.test(last)) {
    const v10 = parseInt(last.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)), 10); level = v10 > RANK_MAX ? to5(v10) : clamp(v10, 1, RANK_MAX);
    cols = cols.slice(0, -1);
  }
  let name = "", name2 = "", school = "";
  if (PAIR_SEP.test(cols[0])) {
    [name, name2] = cols[0].split(PAIR_SEP).map((s) => s.trim());
    school = cols.slice(1).join(" ");
  } else if (sep) {
    name = cols[0]; name2 = cols[1] || ""; school = cols[2] || "";
  } else {
    // スペース区切り:最後が学校。名前が4語なら「姓 名」×2
    const names = cols.length >= 3 ? cols.slice(0, -1) : cols;
    school = cols.length >= 3 ? cols[cols.length - 1] : "";
    if (names.length === 4) { name = names.slice(0, 2).join(" "); name2 = names.slice(2).join(" "); }
    else { name = names[0]; name2 = names.slice(1).join(" "); }
  }
  return { id: uid(), name, name2: name2 || "", school, level };
}

app.addEventListener("click", (evt) => {

    case "new-event": Object.assign(ui, { view: "home", createMode: null }); render(); window.scrollTo({ top: 0 }); break;
    case "pick-mode": {
      ui.createMode = ui.createMode === btn.dataset.mode ? null : btn.dataset.mode;
      render();
      const n = document.getElementById("c-name");
      if (n) { document.getElementById("create-card").scrollIntoView({ block: "nearest", behavior: "smooth" }); n.focus({ preventScroll: true }); }
      break;
    }
    case "cancel-create": ui.createMode = null; render(); break;
    case "create": {
      const mode = MODES[ui.createMode] ? ui.createMode : "league";
      const type = (document.querySelector('input[name="c-type"]:checked') || {}).value;
      const d = new Date();
      const name = document.getElementById("c-name").value.trim() || `${MODES[mode][0]} ${d.getMonth() + 1}/${d.getDate()}`;
      newEvent(null, { name, type, mode, splitMethod: mode === "both" ? "balanced" : "level" });
      toast(`「${name}」を作りました。まず${unit(ev())}を入れてください`);
      break;
    }
    case "toggle-settings": ui.showSettings = !ui.showSettings; ui.confirm = null; render(); break;
    case "dup-event": newEvent(e.players); toast(`${unit(e)}をコピーして新しく作りました`); break;
    case "sample": { const s = makeSample(btn.dataset.type); events[s.id] = s; openEvent(s.id); ui.tab = "matches"; Store.save(s); render(); break; }
    case "ask-del-event": ui.confirm = "del-event"; render(); break;
    case "del-event": { const id = e.id; delete events[id]; currentId = null; Object.assign(ui, { view: "home", confirm: null, showSettings: false }); Store.remove(id); render(); toast("削除しました"); break; }
    case "cancel": ui.confirm = null; render(); break;
    case "imp-go": {
      const res = buildImport(e);
      if (!res.players.length) { toast("取り込める行がありませんでした"); break; }
      e.players.push(...res.players);
      ui.imp = null; ui.pasteOpen = false;
      commit(); render();
      toast(`${count(e, res.players.length)}を追加しました${res.dup ? `(同じ名前の ${res.dup}件はとばしました)` : ""}`);
      break;
    }
    case "imp-clear": ui.imp = null; render(); break;
    case "del-player": {
      const id = btn.dataset.id;
      e.players = e.players.filter((p) => p.id !== id);
      e.leagues.forEach((l) => (l.playerIds = l.playerIds.filter((x) => x !== id)));
      commit(); render(); break;
    }
    case "gsize": e.groupSize = clamp(Number(btn.dataset.k), 3, 8); commit(); render(); break;
    case "auto": if (e.leagues.length) { ui.confirm = "reassign"; render(); } else { autoAssign(e); commit(); render(); toast(`${e.leagues.length}つのリーグに分けました`); } break;
    case "auto-yes": ui.confirm = null; autoAssign(e); commit(); render(); toast(`${e.leagues.length}つのリーグに分け直しました`); break;
    case "pick-league":
      ui.league = btn.dataset.id; ui.copyText = null; render();
      // 下までスクロールしていたら、選んだリーグの頭(星取表)まで戻す
      { const c = document.querySelector(".league-switch + .card"); if (c && c.getBoundingClientRect().top < 0) window.scrollBy({ top: c.getBoundingClientRect().top - 150 }); }
      break;
    case "toggle-export": ui.exportOpen = !ui.exportOpen; ui.copyText = null; render(); break;
    case "x-hoshi-one": { const li = e.leagues.findIndex((l) => l.id === btn.dataset.id); copyTables([hoshiBlock(e, li)], `${letter(li)}リーグの星取表`); break; }
    case "x-hoshi": copyTables(e.leagues.map((_, i) => hoshiBlock(e, i)), "星取表"); break;
    case "x-rank": copyTables([standingsBlock(e)], "順位表"); break;
    case "x-lmatch": copyTables([leagueMatchesBlock(e)], "試合結果の一覧"); break;
    case "x-bracket": copyTables(bracketBlocks(e), "トーナメントの結果"); break;
    case "close-copy": ui.copyText = null; render(); break;
    case "build":
      if (e.bracket) { ui.confirm = "rebuild"; render(); break; }
      if (buildBracket(e)) { ui.bmatch = null; ui.seedDirty = false; commit(); render(); toast("トーナメントを作りました"); } else toast("出場者が2人(2組)以上必要です");
      break;
    case "build-yes":
      ui.confirm = null;
      if (buildBracket(e)) { ui.bmatch = null; ui.seedDirty = false; commit(); render(); toast("トーナメントを作り直しました"); } else { render(); toast("出場者が2人(2組)以上必要です"); }
      break;
    case "bpick":
      ui.bmatch = btn.dataset.mid; render();
      { const p = document.getElementById("bpanel"); if (p) p.scrollIntoView({ block: "nearest", behavior: "smooth" }); const f = p && p.querySelector(".score"); if (f) f.focus({ preventScroll: true }); }
      break;
    case "bclose": ui.bmatch = null; render(); break;
    case "set-level": {
      // 押した場所で色だけ変える(表を並べ替えると押した行が動いてしまうため)
      const lv = clamp(Number(btn.dataset.lv), 1, RANK_MAX);
      if (btn.dataset.id === "new") ui.newLevel = lv;
      else { const p = e.players.find((x) => x.id === btn.dataset.id); if (!p) break; p.level = lv; commit(); }
      paintPicker(btn.closest(".lvpick"), lv);
      break;
    }
    case "seed-clear": e.seeds = {}; ui.seedDirty = !!e.bracket; commit(); render(); toast("シードの指定を解除しました"); break;
    case "bswap": {
      const i = Number(document.getElementById("swap-a").value), j = Number(document.getElementById("swap-b").value);
      if (i === j) { toast("別々の2人(2組)を選んでください"); break; }
      const s = e.bracket.slots;
      [s[i], s[j]] = [s[j], s[i]];
      commit(); render(); toast("入れ替えました"); break;
    }
  }
});

// 「細かい設定」の開閉は、描き直しても保つ
app.addEventListener("toggle", (evt) => {
  if (!evt.target.matches) return;
  if (evt.target.matches("details.more")) ui.moreOpen = evt.target.open;
  if (evt.target.matches("details.seedbox")) ui.seedOpen = evt.target.open;
  if (evt.target.matches("details.paste")) ui.pasteOpen = evt.target.open;
}, true);

app.addEventListener("submit", (evt) => {
  if (evt.target.id !== "add-form") return;
  evt.preventDefault();
  const e = ev();
  const name = document.getElementById("new-name").value.trim();
  const school = document.getElementById("new-school").value.trim();
  const level = ui.newLevel;
  const n2 = document.getElementById("new-name2");
  const name2 = n2 ? n2.value.trim() : "";
  if (!name) return;
  e.players.push({ id: uid(), name, name2, school, level });
  commit(); render();
  const s = document.getElementById("new-school"); if (s) s.value = school;
  const n = document.getElementById("new-name"); if (n) n.focus();
  toast(`${name2 ? `${name}・${name2}` : name} を追加しました`);
});

app.addEventListener("change", (evt) => {
  const t = evt.target;
  const k = t.dataset.change;
  if (!k) return;
  if (k === "event-select") { currentId = t.value; ui.league = null; ui.confirm = null; ui.copyText = null; render(); return; }
  const e = ev();
  const p = t.dataset.id ? e.players.find((x) => x.id === t.dataset.id) : null;
  switch (k) {
    case "ev-name": e.name = t.value.trim() || "名前なし"; commit(); render(); break;
    case "ev-date": e.date = t.value; commit(); render(); break;
    case "ev-games": e.games = Number(t.value) === 3 ? 3 : 1; commit(); render(); break;
    case "ev-points": e.points = Number(t.value); commit(); render(); break;
    case "ev-maxday": e.maxPerDay = clamp(Number(t.value), 1, 12); commit(); render(); break;
    case "wo": setWo(e, t.dataset.a, t.dataset.b, t.value || null); commit(); render(); break;
    case "bwo": {
      const n = findNode(bracketState(e), t.dataset.mid);
      if (n) { setBWo(e, n, t.value || null); commit(); render(); }
      break;
    }
    case "imp-role": {
      // 名前・学校などは1列だけ。同じ役目の別の列は「使わない」に戻す
      const j = Number(t.dataset.col), r = t.value;
      if (r !== "skip") ui.imp.roles = ui.imp.roles.map((x, i) => (i !== j && x === r ? "skip" : x));
      ui.imp.roles[j] = r;
      document.getElementById("import-preview").innerHTML = importPreviewHTML(e);
      break;
    }
    case "imp-header": ui.imp.header = t.checked; document.getElementById("import-preview").innerHTML = importPreviewHTML(e); break;
    case "seed": {
      const id = t.dataset.id, n = parseInt(t.value, 10);
      if (n) { Object.keys(e.seeds).forEach((k) => { if (e.seeds[k] === n) delete e.seeds[k]; }); e.seeds[id] = n; }
      else delete e.seeds[id];
      ui.seedDirty = !!e.bracket; commit(); render(); break;
    }
    case "ev-mode": e.mode = MODES[t.value] ? t.value : "league"; commit(); render(); break;
    case "t-top": e.tTop = clamp(Number(t.value), 1, 4); commit(); break;
    case "t-third": e.tThird = t.checked; commit(); render(); break;
    case "ev-type": e.type = t.value === "doubles" ? "doubles" : "singles"; commit(); render(); break;
    case "p-name": if (p) { p.name = t.value.trim(); commit(); } break;
    case "p-name2": if (p) { p.name2 = t.value.trim(); commit(); } break;
    case "p-school": if (p) { p.school = t.value.trim(); commit(); } break;
    case "p-level": if (p) { p.level = clamp(Number(t.value), 1, RANK_MAX); commit(); render(); } break;
    case "spread": e.spreadSchools = t.checked; commit(); render(); break;
    case "split": e.splitMethod = t.value === "balanced" ? "balanced" : "level"; commit(); render(); break;
    case "tolerance": e.tolerance = Number(t.value); commit(); break;
    case "move": {
      const to = Number(t.value);
      e.leagues.forEach((l) => (l.playerIds = l.playerIds.filter((x) => x !== t.dataset.id)));
      if (to >= 0 && e.leagues[to]) {
        const pm = playerMap(e);
        const l = e.leagues[to];
        l.playerIds.push(t.dataset.id);
        l.playerIds.sort((x, y) => pm[y].level - pm[x].level);
      }
      commit(); render(); break;
    }
  }
});

// 大会名は1行の名前なので、Enter で確定する
app.addEventListener("keydown", (evt) => {
  if (evt.target.id === "ev-name" && evt.key === "Enter" && !evt.isComposing) { evt.preventDefault(); evt.target.blur(); }
});

app.addEventListener("input", (evt) => {
  const t = evt.target;
  if (t.id === "ev-name") { fitName(); return; }
  if (t.dataset.input === "paste") {
    // 貼り付けたら、すぐに列を見分けて表で見せる(欄はそのまま、下の表だけ描き直す)
    ui.imp = analyzeImport(t.value, isDbl(ev()));
    const box = document.getElementById("import-preview");
    if (box) box.innerHTML = importPreviewHTML(ev());
    return;
  }
  if (t.dataset.input !== "score" && t.dataset.input !== "bscore") return;
  const clean = t.value.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)).replace(/[^0-9]/g, "").slice(0, 2);
  if (clean !== t.value) t.value = clean;
  const e = ev();
  const val = clean === "" ? null : clamp(parseInt(clean, 10), 0, 99);
  if (t.dataset.input === "bscore") {
    const n = findNode(bracketState(e), t.dataset.mid);
    if (!n) return;
    setBScore(e, n, Number(t.dataset.g), Number(t.dataset.s), val);
    commit();
    refreshBracket(e, t.dataset.mid);
    return;
  }
  setScore(e, t.dataset.a, t.dataset.b, Number(t.dataset.g), Number(t.dataset.s), val);
  commit();
  refreshMatch(e, t.dataset.a, t.dataset.b);
});

/* ============ テーマ・背景 ============ */
const root = document.documentElement;
// はじめはライトモード。ボタンでダークを選んだ人だけ、次からもダークで開く
root.dataset.theme = "light";
try { const th = localStorage.getItem("arca-league-theme"); if (th === "dark" || th === "light") root.dataset.theme = th; } catch (e) {}
// 上のバーの「ダークにする/ライトにする」。選んだほうをこの端末に覚える
app.addEventListener("click", (evt) => {
  const btn = evt.target.closest('[data-action="theme"]');
  if (!btn) return;
  root.dataset.theme = isDarkNow() ? "light" : "dark";
  try { localStorage.setItem("arca-league-theme", root.dataset.theme); } catch (e) {}
  btn.outerHTML = themeBtnHTML();
});
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    root.style.setProperty("--scroll", (scrollY / max).toFixed(4));
    ticking = false;
  });
}, { passive: true });

/* ============ 起動 ============ */
(async () => {
  await Store.init();
  events = await Store.loadAll();
  ready = true;
  ui.saveState = Store.db ? "saved" : "local";
  ensureCurrent();
  render();
  Store.subscribe();
})();
})();
</script>

</body>
</html>
