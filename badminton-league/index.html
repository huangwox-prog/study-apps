    <svg class="shuttle-arc" viewBox="0 0 320 120" fill="none" aria-hidden="true">
    <svg class="shuttle-arc" viewBox="0 0 320 120" fill="none" aria-hidden="true">
      <defs><linearGradient id="g-empty" x1="0" x2="1"><stop offset="0" stop-color="var(--arc-1)"/><stop offset=".52" stop-color="var(--arc-2)"/><stop offset="1" stop-color="var(--arc-3)"/></linearGradient></defs>
      <path d="M10 110h300" stroke="currentColor" stroke-width="1" opacity=".4"/>
      <path d="M160 110V70" stroke="currentColor" stroke-width="1.5" opacity=".5"/>
      <path class="shuttle-path" d="M24 104C70 4 250 4 296 104" stroke="url(#g-empty)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="296" cy="104" r="6" fill="var(--arc-3)"/>
    </svg>
    <span class="kicker">Badminton</span>
    <h2>${list.length ? "大会一覧" : "大会を作る"}</h2>
  </section>`;
  const cards = list.map((x) => {
    const t = totals(x);
    return `<button class="card event-card" data-action="open-event" data-id="${esc(x.id)}">
      <span class="faint num">${esc(x.date || "")}</span>
      <b class="event-name">${esc(x.name)}</b>
      <span class="row" style="gap:6px"><span class="chip">${isDbl(x) ? "ダブルス" : "シングルス"}</span><span class="chip chip-live">${MODES[x.mode][0]}</span></span>
      <span class="faint num">${count(x, x.players.length)} · 試合 ${t.finished}/${t.total}</span>
    </button>`;
  }).join("");
  const showCreate = ui.creating || !list.length;
  return `${intro}
    ${showCreate ? createHTML(list.length > 0) : `<div class="row" style="justify-content:center"><button class="btn btn-aurora btn-lg" data-action="new-event">＋ 新しい大会を作る</button></div>`}
    ${list.length ? `<section class="stack"><h3 class="muted">これまでの大会</h3><div class="event-grid">${cards}</div></section>` : ""}
    <p class="faint" style="text-align:center;margin:8px 0 0">試しに触ってみる:
      <button class="link-btn" data-action="sample">シングルスのサンプル</button> ·
      <button class="link-btn" data-action="sample" data-type="doubles">ダブルスのサンプル</button></p>`;
}

function heroHTML(e) {
  const t = totals(e);
  const pct = t.total ? Math.round((t.finished / t.total) * 100) : 0;
  const r = 78, circ = 2 * Math.PI * r, sweep = circ * 0.75;
  const confirmDel = ui.confirm === "del-event";
  return `<section class="hero">
    <div style="min-width:0">
      <span class="kicker">${isDbl(e) ? "ダブルス" : "シングルス"} · ${MODES[e.mode][0]}</span>
      <input class="hero-name" id="ev-name" data-change="ev-name" value="${esc(e.name)}" aria-label="大会名">
      <div class="hero-sub">
        <label>日付 <input type="date" class="input" id="ev-date" data-change="ev-date" value="${esc(e.date)}"></label>
        <span>${e.points}点${e.games === 1 ? "1ゲーム" : "3ゲーム(2ゲーム先取)"}</span>
        <button class="btn btn-ghost btn-sm" data-action="toggle-settings" aria-expanded="${ui.showSettings}">${ui.showSettings ? "設定を閉じる" : "設定を変える"}</button>
      </div>
      ${ui.showSettings ? `<div class="hero-sub hero-settings">
        <label>形式
          <select class="select" id="ev-mode" data-change="ev-mode">
            ${Object.entries(MODES).map(([k, [t]]) => `<option value="${k}" ${e.mode === k ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </label>
        <label>種目
          <select class="select" id="ev-type" data-change="ev-type">
            <option value="singles" ${isDbl(e) ? "" : "selected"}>シングルス</option>
            <option value="doubles" ${isDbl(e) ? "selected" : ""}>ダブルス</option>
          </select>
        </label>
        <label>試合形式
          <select class="select" id="ev-games" data-change="ev-games">
            <option value="1" ${e.games === 1 ? "selected" : ""}>1ゲームマッチ</option>
            <option value="3" ${e.games === 3 ? "selected" : ""}>3ゲームマッチ(2ゲーム先取)</option>
          </select>
        </label>
        <label>点数
          <select class="select" id="ev-points" data-change="ev-points">
            ${[21, 15, 11].map((p) => `<option value="${p}" ${e.points === p ? "selected" : ""}>${p}点</option>`).join("")}
          </select>
        </label>
      </div>
      <div class="hero-actions">
        <button class="btn btn-ghost btn-sm" data-action="dup-event">${unit(e)}をコピーして新しい大会</button>
        <button class="btn btn-ghost btn-sm" data-action="ask-del-event">この大会を削除</button>
      </div>` : ""}
      <div class="hero-stats" id="hero-stats">${heroStatsHTML(e, t)}</div>
      ${confirmDel ? `<div class="confirm" style="margin-top:12px;background:rgba(255,111,107,.14);color:var(--ink-text)"><span>「${esc(e.name)}」を削除します。選手と結果もすべて消えます。</span><button class="btn btn-sm" style="background:#ff6f6b;color:#08090d" data-action="del-event">削除する</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
    </div>
    <div class="progress-arc" id="hero-arc" aria-label="試合の進み具合 ${pct}%">
      <svg viewBox="0 0 200 200" aria-hidden="true">
        <defs><linearGradient id="arcaRing" x1="0" y1="1" x2="1" y2="0"><stop offset="0%" stop-color="#6c85ff"/><stop offset="50%" stop-color="#b077ff"/><stop offset="100%" stop-color="#2ad9b8"/></linearGradient></defs>
        <circle class="pa-track" cx="100" cy="100" r="${r}" stroke-dasharray="${sweep} ${circ}"/>
        <circle class="pa-fill" id="pa-fill" cx="100" cy="100" r="${r}" stroke="url(#arcaRing)" stroke-dasharray="${(sweep * pct) / 100} ${circ}"/>
      </svg>
      <div class="pa-label"><span class="pa-value" id="pa-value">${pct}<small style="font-size:.5em">%</small></span><span class="pa-caption">試合消化</span></div>
    </div>
  </section>`;
}
function heroStatsHTML(e, t) {
  return `<div><span class="stat-value">${e.players.length}</span><span class="stat-label">${unit(e)}</span></div>
    <div><span class="stat-value">${new Set(e.players.map((p) => p.school.trim()).filter(Boolean)).size}</span><span class="stat-label">学校</span></div>
    ${e.mode !== "tournament" ? `<div><span class="stat-value">${e.leagues.length}</span><span class="stat-label">リーグ</span></div>` : ""}
    <div><span class="stat-value">${t.finished}<span style="font-size:.55em;color:var(--ink-text-3)"> / ${t.total}</span></span><span class="stat-label">試合 終了 / 全体</span></div>`;
}
function refreshHero(e) {
  const t = totals(e);
  const pct = t.total ? Math.round((t.finished / t.total) * 100) : 0;
  const r = 78, circ = 2 * Math.PI * r, sweep = circ * 0.75;
  const s = document.getElementById("hero-stats"); if (s) s.innerHTML = heroStatsHTML(e, t);
  const f = document.getElementById("pa-fill"); if (f) f.setAttribute("stroke-dasharray", `${(sweep * pct) / 100} ${circ}`);
  const v = document.getElementById("pa-value"); if (v) v.innerHTML = `${pct}<small style="font-size:.5em">%</small>`;
}

function tabsHTML(e) {
  const tabs = tabsFor(e);
  return `<nav class="tabs" aria-label="画面">${tabs.map(([k, label], i) =>
    `<button class="tab ${ui.tab === k ? "is-active" : ""}" data-action="tab" data-tab="${k}"><span class="tab-step">${i + 1}</span>${label}</button>`).join("")}</nav>`;
}

/* --- 選手 --- */
function schoolsDatalist(e) {
  const s = [...new Set(e.players.map((p) => p.school.trim()).filter(Boolean))].sort();
  return `<datalist id="schools">${s.map((x) => `<option value="${esc(x)}"></option>`).join("")}</datalist>`;
}
function playersHTML(e) {
  const dbl = isDbl(e);
  const list = e.players.slice().sort((a, b) => b.level - a.level || a.school.localeCompare(b.school, "ja") || a.name.localeCompare(b.name, "ja"));
  const rows = list.map((p) => {
    const li = leagueIndexOf(e, p.id);
    return `<tr>
      <td><input class="cell-input" id="pn-${p.id}" data-change="p-name" data-id="${p.id}" value="${esc(p.name)}" aria-label="${dbl ? "1人目の名前" : "名前"}"></td>
      ${dbl ? `<td><input class="cell-input" id="pn2-${p.id}" data-change="p-name2" data-id="${p.id}" value="${esc(p.name2)}" placeholder="相方を入力" aria-label="2人目の名前"></td>` : ""}
      <td><input class="cell-input" id="ps-${p.id}" data-change="p-school" data-id="${p.id}" value="${esc(p.school)}" list="schools" aria-label="学校"></td>
      <td><select class="select level-select" id="pl-${p.id}" data-change="p-level" data-id="${p.id}" aria-label="実力">${levelOptions(p.level)}</select></td>
      <td>${li >= 0 ? `<span class="badge ${lgClass(li)}">${letter(li)}</span>` : `<span class="faint">—</span>`}</td>
      <td style="text-align:right"><button class="icon-btn" data-action="del-player" data-id="${p.id}" aria-label="${esc(pname(e, p))}を削除" title="削除">${TRASH}</button></td>
    </tr>`;
  }).join("");
  return `${schoolsDatalist(e)}
  <section class="card">
    <div class="card-head"><div><h2>${unit(e)}を追加</h2><p class="faint">${dbl ? "ペアごとに1行。実力はペアとしての強さで、10 がいちばん強い。だいたいで大丈夫です。" : "実力は 10 がいちばん強い。だいたいで大丈夫です(同じ数字の選手は同じくらいの強さとして扱います)。"}</p></div></div>
    <form class="add-form ${dbl ? "dbl" : ""}" id="add-form">
      <label class="field field-name"><span>${dbl ? "1人目" : "名前"}</span><input class="input" id="new-name" required placeholder="例:山田 太郎" autocomplete="off"></label>
      ${dbl ? `<label class="field field-name"><span>2人目</span><input class="input" id="new-name2" placeholder="例:佐藤 次郎" autocomplete="off"></label>` : ""}
      <label class="field"><span>学校</span><input class="input" id="new-school" list="schools" placeholder="例:桜ヶ丘高" autocomplete="off"></label>
      <label class="field"><span>実力</span><select class="select" id="new-level">${levelOptions(5)}</select></label>
      <button class="btn btn-primary" type="submit">追加</button>
    </form>
    <details class="paste">
      <summary>Excel からまとめて貼り付ける</summary>
      ${dbl
        ? `<p class="faint" style="margin:8px 0 0">1行に1ペア。「1人目 → 2人目 → 学校 → 実力」の順に並んだ列をそのままコピーして貼り付けてください。「山田・佐藤」のように1つのセルに2人入っていてもOK。実力が無ければ 5 になります。</p>
      <textarea class="input" id="paste-box" placeholder="山田 太郎	佐藤 次郎	桜ヶ丘高	8&#10;鈴木・高橋	港北高	6&#10;伊藤 花子	田中 結衣	緑川高	7"></textarea>`
        : `<p class="faint" style="margin:8px 0 0">1行に1人。「名前 → 学校 → 実力」の順に並んだ列をそのままコピーして貼り付けてください(タブ・カンマ・スペース区切りどれでもOK。実力が無ければ 5 になります)。</p>
      <textarea class="input" id="paste-box" placeholder="山田 太郎	桜ヶ丘高	8&#10;佐藤 花子	港北高	6&#10;鈴木 一郎	緑川高	7"></textarea>`}
      <div class="row"><button class="btn btn-secondary btn-sm" data-action="import">取り込む</button></div>
    </details>
  </section>
  <section class="card">
    <div class="card-head"><div><h2>登録${unit(e)} <span class="faint num">${count(e, e.players.length)}</span></h2><p class="faint">ここで名前・学校・実力を直すと、リーグ表や結果にもそのまま反映されます。</p></div>
      ${e.players.length ? `<button class="btn btn-aurora btn-sm" data-action="tab" data-tab="leagues">リーグ分けへ</button>` : ""}</div>
    ${e.players.length ? `<div class="table-wrap"><table>
      <thead><tr>${dbl ? "<th>1人目</th><th>2人目</th>" : "<th>名前</th>"}<th>学校</th><th>実力</th><th>リーグ</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>` : `<p class="muted">まだ${unit(e)}がいません。上のフォームか、Excel からの貼り付けで追加してください。</p>`}
  </section>`;
}

/* --- リーグ分け --- */
function leaguesHTML(e) {
  const pm = playerMap(e);
  const n = e.players.length;
  const K = clamp(e.leagueCount, 1, Math.max(1, n));
  const per = n ? `1リーグ ${Math.floor(n / K)}${n % K ? `〜${Math.floor(n / K) + 1}` : ""}${isDbl(e) ? "組" : "人"}` : "";
  const confirm = ui.confirm === "reassign";
  const settings = `<section class="card">
    <div class="card-head"><div><h2>リーグ分けの設定</h2><p class="faint">実力の高い順に並べて、上から A・B・C… に分けます。</p></div></div>
    <div class="settings">
      <div class="field"><span>リーグの数</span>
        <div class="stepper"><button data-action="lc" data-d="-1" aria-label="減らす">−</button><output class="num">${e.leagueCount}</output><button data-action="lc" data-d="1" aria-label="増やす">＋</button></div>
      </div>
      <div class="field"><span>人数の目安</span><span class="muted" style="padding:8px 0;font-weight:600">${per || "—"}</span></div>
    </div>
    <details class="more" ${ui.moreOpen ? "open" : ""}><summary>細かい設定</summary><div class="settings">
      <div class="field"><span>学校のばらし</span>
        <label class="check"><input type="checkbox" id="spread" data-change="spread" ${e.spreadSchools ? "checked" : ""}>同じ学校が同じリーグに固まらないようにする</label>
      </div>
      <div class="field"><span>入れ替えてよい実力差</span>
        <select class="select" id="tolerance" data-change="tolerance" ${e.spreadSchools ? "" : "disabled"}>
          <option value="0" ${e.tolerance === 0 ? "selected" : ""}>同じ実力の選手同士だけ</option>
          <option value="1" ${e.tolerance === 1 ? "selected" : ""}>実力差 1 までOK</option>
          <option value="2" ${e.tolerance === 2 ? "selected" : ""}>実力差 2 までOK</option>
        </select>
      </div>
    </div></details>
    <div class="row" style="margin-top:18px">
      <button class="btn btn-aurora" data-action="auto" ${n < 2 ? "disabled" : ""}>${e.leagues.length ? "自動で分け直す" : "自動で分ける"}</button>
      ${e.leagues.length ? `<span class="faint">分けたあと、各選手の右のメニューで手動で移動もできます。</span>` : ""}
    </div>
    ${confirm ? `<div class="confirm" style="margin-top:14px"><span><b>今のリーグ分けを作り直します。</b>手動で動かした分は戻ります。入力済みのスコアは消えません(同じ組み合わせの試合があればそのまま残ります)。</span><button class="btn btn-primary btn-sm" data-action="auto-yes">作り直す</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
  </section>`;

  if (!e.leagues.length) {
    return settings + `<section class="card"><p class="muted">${n < 2 ? `${unit(e)}を${count(e, 2)}以上登録すると、リーグに分けられます。` : "「自動で分ける」を押すと、ここにリーグが並びます。"}</p></section>`;
  }
  const moveOpts = (cur) => e.leagues.map((_, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${letter(i)}へ</option>`).join("") + `<option value="-1" ${cur === -1 ? "selected" : ""}>外す</option>`;
  const cards = e.leagues.map((l, i) => {
    const ps = l.playerIds.map((id) => pm[id]).filter(Boolean);
    const cnt = {}; ps.forEach((p) => { const k = p.school.trim(); if (k) cnt[k] = (cnt[k] || 0) + 1; });
    const dups = Object.entries(cnt).filter(([, c]) => c > 1);
    const avg = ps.length ? (ps.reduce((s, p) => s + p.level, 0) / ps.length).toFixed(1) : "—";
    const range = ps.length ? `${Math.min(...ps.map((p) => p.level))}〜${Math.max(...ps.map((p) => p.level))}` : "—";
    return `<article class="card league-card ${lgClass(i)}">
      <div class="league-title"><span class="league-letter">${letter(i)}</span><div><h3>${letter(i)}リーグ</h3><span class="faint num">${count(e, ps.length)} · ${matchCount(ps.length)}試合</span></div></div>
      <div class="league-meta">
        <span class="chip num">実力 ${range}</span><span class="chip num">平均 ${avg}</span>
        ${dups.length ? dups.map(([s, c]) => `<span class="chip chip-warn">${esc(s)} ×${c}</span>`).join("") : ps.length ? `<span class="chip chip-ok">学校の重なりなし</span>` : ""}
      </div>
      <ul class="plist">${ps.map((p) => `<li>
        <span class="pname">${esc(pname(e, p))}<span class="pschool ${cnt[p.school.trim()] > 1 ? "dup" : ""}">${esc(p.school) || "学校未入力"}</span></span>
        ${levelMeter(p.level)}
        <select class="select move-select" id="mv-${p.id}" data-change="move" data-id="${p.id}" aria-label="${esc(pname(e, p))}の移動先">${moveOpts(i)}</select>
      </li>`).join("") || `<li><span class="faint">${unit(e)}がいません</span></li>`}</ul>
    </article>`;
  }).join("");
  const un = unassigned(e);
  const unCard = un.length ? `<article class="card">
      <div class="league-title"><span class="league-letter" style="background:var(--text-tertiary)">?</span><div><h3>どのリーグにも入っていない${unit(e)}</h3><span class="faint">あとから追加した${unit(e)}はここに入ります</span></div></div>
      <ul class="plist" style="margin-top:10px">${un.map((p) => `<li>
        <span class="pname">${esc(pname(e, p))}<span class="pschool">${esc(p.school)}</span></span>${levelMeter(p.level)}
        <select class="select move-select" id="mv-${p.id}" data-change="move" data-id="${p.id}" aria-label="${esc(pname(e, p))}の移動先">${moveOpts(-1)}</select>
      </li>`).join("")}</ul></article>` : "";
  return settings + `<div class="league-grid">${cards}${unCard}</div>`;
}

/* --- 試合と結果 --- */
function leaguePillsHTML(e) {
  return `<div class="league-pills" role="tablist" aria-label="リーグ">${e.leagues.map((l, i) => {
    const s = standings(e, l);
    return `<button class="league-pill ${lgClass(i)} ${l.id === ui.league ? "is-active" : ""}" data-action="pick-league" data-id="${l.id}" role="tab" aria-selected="${l.id === ui.league}"><span class="badge">${letter(i)}</span>${letter(i)}リーグ <small>${s.finished}/${s.total}</small></button>`;
  }).join("")}</div>`;
}

function hoshiHTML(e, li) {
  const l = e.leagues[li];
  const pm = playerMap(e);
  const s = standings(e, l);
  const anyDone = s.finished > 0;
  const head = l.playerIds.map((id) => `<th>${pnameStack(e, pm[id])}</th>`).join("");
  const body = s.rows.map((r) => {
    const cells = l.playerIds.map((cid) => {
      if (cid === r.id) return `<td class="self"></td>`;
      const o = outcome(e, r.id, cid);
      if (o.winner === r.id) return `<td class="win"><span class="mark">○</span><span class="sc">${scoreText(e, o)}</span></td>`;
      if (o.winner === cid) return `<td class="lose"><span class="mark">●</span><span class="sc">${scoreText(e, o)}</span></td>`;
      if (o.started) return `<td class="lose"><span class="sc">入力中</span></td>`;
      return `<td></td>`;
    }).join("");
    return `<tr class="${anyDone && r.rank === 1 ? "top" : ""}">
      <td class="name-cell"><span class="pname">${pnameStack(e, r.p)}</span><span class="pschool">${esc(r.p.school)}</span></td>${cells}
      <td class="stat">${r.w}</td><td class="stat">${r.l}</td><td class="stat">${signed(r.gw - r.gl)}</td><td class="stat">${signed(r.pf - r.pa)}</td>
      <td class="rank ${anyDone && r.rank === 1 ? "rank-1" : ""}">${anyDone ? r.rank : "—"}</td></tr>`;
  }).join("");
  return `<div class="table-wrap"><table class="hoshi">
    <thead><tr><th class="name-cell">${unit(e)}</th>${head}<th>勝</th><th>敗</th><th>得失<br>ゲーム</th><th>得失点</th><th>順位</th></tr></thead>
    <tbody>${body}</tbody></table></div>
    <p class="tie-note">順位は 勝ち数 → 得失ゲーム差 → 得失点差 → 直接対決 の順で決めています。○ 勝ち ● 負け。</p>`;
}

function matchRowHTML(e, a, b) {
  const pm = playerMap(e);
  const o = outcome(e, a, b);
  const games = gamesOf(e, a, b);
  let inputs = "";
  for (let g = 0; g < e.games; g++) {
    const [x, y] = games[g] || [null, null];
    const bad = gameWarn(e, x, y);
    const k = keyOf(a, b);
    inputs += `<div class="game">${e.games > 1 ? `<span class="game-label">第${g + 1}G</span>` : ""}
      <input class="score ${bad ? "bad" : ""}" id="sc-${k}-${g}-${a}" inputmode="numeric" autocomplete="off" maxlength="2" data-input="score" data-a="${a}" data-b="${b}" data-g="${g}" data-s="0" value="${x ?? ""}" aria-label="${esc(pname(e, pm[a]))} 第${g + 1}ゲームの点数">
      <span class="faint">-</span>
      <input class="score ${bad ? "bad" : ""}" id="sc-${k}-${g}-${b}" inputmode="numeric" autocomplete="off" maxlength="2" data-input="score" data-a="${a}" data-b="${b}" data-g="${g}" data-s="1" value="${y ?? ""}" aria-label="${esc(pname(e, pm[b]))} 第${g + 1}ゲームの点数"></div>`;
  }
  return `<div class="match ${o.winner ? "is-done" : ""}" id="m-${keyOf(a, b)}">
    <div class="m-side a ${o.winner === a ? "win" : ""}"><span class="pname">${pnameStack(e, pm[a])}</span><span class="pschool">${esc(pm[a].school)}</span></div>
    <div class="m-scores">${inputs}</div>
    <div class="m-side b ${o.winner === b ? "win" : ""}"><span class="pname">${pnameStack(e, pm[b])}</span><span class="pschool">${esc(pm[b].school)}</span></div>
    <div class="m-status">${statusChip(e, a, b, o)}</div>
  </div>`;
}
function statusChip(e, a, b, o) {
  const warn = gamesOf(e, a, b).some(([x, y]) => gameWarn(e, x, y));
  if (warn) return `<span class="chip chip-warn" title="${e.points}点ゲームとして点数がおかしい可能性があります">点数を確認</span>`;
  if (o.winner) return `<span class="chip chip-ok">終了</span>`;
  if (o.started) return `<span class="chip chip-live">入力中</span>`;
  return `<span class="chip">未</span>`;
}

function matchesHTML(e) {
  if (!e.leagues.length) return `<section class="card"><p class="muted">先に「リーグ分け」でリーグを作ってください。</p><div class="row" style="margin-top:12px"><button class="btn btn-aurora btn-sm" data-action="tab" data-tab="leagues">リーグ分けへ</button></div></section>`;
  const li = Math.max(0, e.leagues.findIndex((l) => l.id === ui.league));
  const l = e.leagues[li];
  const pm = playerMap(e);
  const rounds = roundRobin(l.playerIds);
  let num = 0;
  const roundsHTML = rounds.map((r, ri) => `<div class="round">
      <div class="round-head"><h3>第${ri + 1}ラウンド</h3>${r.bye ? `<span class="bye">休み:${esc(pname(e, pm[r.bye]))}</span>` : ""}</div>
      ${r.pairs.map(([a, b]) => { num++; return matchRowHTML(e, a, b); }).join("")}
    </div>`).join("");
  return `${leaguePillsHTML(e)}
  <section class="card ${lgClass(li)}">
    <div class="card-head"><div class="title-with-letter"><span class="league-letter">${letter(li)}</span><div><h2>${letter(li)}リーグ 星取表</h2><p class="faint">スコアを入れると自動で更新されます。</p></div></div>
      <button class="btn btn-secondary btn-sm" data-action="copy-league" data-id="${l.id}">Excel用にコピー</button></div>
    <div id="hoshi-${l.id}">${l.playerIds.length >= 2 ? hoshiHTML(e, li) : `<p class="muted">2人以上いると試合が組めます。</p>`}</div>
  </section>
  ${ui.copyText ? copyBoxHTML() : ""}
  <section class="card ${lgClass(li)}">
    <div class="card-head"><div class="title-with-letter"><span class="league-letter">${letter(li)}</span><h2>${letter(li)}リーグ 対戦順とスコア入力</h2></div></div>
    <div class="card-head" style="margin-top:-8px"><div><p class="faint num">全${num}試合 · ${e.games === 1 ? `${e.points}点1ゲーム` : `${e.points}点3ゲーム(2ゲーム先取)`}。同じラウンドの試合は同時に進められます。</p></div></div>
    <div class="stack">${roundsHTML || `<p class="muted">2人以上いると試合が組めます。</p>`}</div>
  </section>`;
}

function refreshMatch(e, a, b) {
  const row = document.getElementById(`m-${keyOf(a, b)}`);
  if (row) {
    const o = outcome(e, a, b);
    row.classList.toggle("is-done", !!o.winner);
    row.querySelector(".m-side.a").classList.toggle("win", o.winner === a);
    row.querySelector(".m-side.b").classList.toggle("win", o.winner === b);
    row.querySelector(".m-status").innerHTML = statusChip(e, a, b, o);
    const games = gamesOf(e, a, b);
    row.querySelectorAll(".game").forEach((gEl, gi) => {
      const [x, y] = games[gi] || [null, null];
      const bad = gameWarn(e, x, y);
      gEl.querySelectorAll(".score").forEach((inp) => inp.classList.toggle("bad", bad));
    });
  }
  const li = e.leagues.findIndex((l) => l.id === ui.league);
  const box = document.getElementById(`hoshi-${ui.league}`);
  if (box && li >= 0) box.innerHTML = hoshiHTML(e, li);
  const pills = document.querySelector(".league-pills");
  if (pills) pills.outerHTML = leaguePillsHTML(e);
  refreshHero(e);
}

/* --- 順位一覧 --- */
function overviewHTML(e) {
  if (!e.leagues.length) return `<section class="card"><p class="muted">リーグを作ると、ここに全リーグの順位が並びます。</p></section>`;
  const cards = e.leagues.map((l, i) => {
    const s = standings(e, l);
    const anyDone = s.finished > 0;
    return `<article class="card league-card ${lgClass(i)}">
      <div class="league-title"><span class="league-letter">${letter(i)}</span><div><h3>${letter(i)}リーグ</h3><span class="faint num">${s.finished}/${s.total} 試合終了</span></div></div>
      <div class="table-wrap" style="margin-top:12px"><table class="mini">
        <thead><tr><th>順位</th><th>${unit(e)}</th><th style="text-align:right">勝</th><th style="text-align:right">敗</th><th style="text-align:right">得失点</th></tr></thead>
        <tbody>${s.sorted.map((r) => `<tr><td class="rank" style="${anyDone && r.rank === 1 ? "color:var(--lg)" : ""}">${anyDone ? r.rank : "—"}</td>
          <td><span class="pname">${esc(pname(e, r.p))}</span><span class="pschool">${esc(r.p.school)}</span></td>
          <td class="stat">${r.w}</td><td class="stat">${r.l}</td><td class="stat">${signed(r.pf - r.pa)}</td></tr>`).join("")}</tbody>
      </table></div></article>`;
  }).join("");
  return `<section class="card"><div class="card-head"><div><h2>全リーグの順位</h2><p class="faint">${esc(e.name)}(${esc(e.date)})</p></div>
    <button class="btn btn-secondary btn-sm" data-action="copy-all">全リーグを Excel用にコピー</button></div></section>
    ${ui.copyText ? copyBoxHTML() : ""}
    <div class="overview">${cards}</div>`;
}

/* --- トーナメント --- */
function bracketHTML(e) {
  const both = e.mode === "both";
  const st = bracketState(e);
  const confirm = ui.confirm === "rebuild";
  if (both && !e.leagues.length) return `<section class="card"><p class="muted">決勝トーナメントは、リーグ戦の順位から作ります。先に「リーグ分け」でリーグを作ってください。</p><div class="row" style="margin-top:12px"><button class="btn btn-aurora btn-sm" data-action="tab" data-tab="leagues">リーグ分けへ</button></div></section>`;
  const settings = `<section class="card">
    <div class="card-head"><div><h2>${both ? "決勝トーナメントを作る" : "トーナメントを作る"}</h2><p class="faint">${both ? "今のリーグ順位で、A1位・B1位…の順にシードを決めます。" : `登録した${count(e, e.players.length)}を、強い順にシードを決めて並べます。`}人数が足りない枠は不戦勝になります。</p></div></div>
    ${both ? `<div class="settings" style="margin-bottom:16px"><div class="field"><span>各リーグから出る${unit(e)}</span>
        <select class="select" id="t-top" data-change="t-top">${[1, 2, 3, 4].map((k) => `<option value="${k}" ${e.tTop === k ? "selected" : ""}>上位 ${k} 位まで</option>`).join("")}</select></div></div>` : ""}
    <div class="row">
      <button class="btn btn-aurora" data-action="build" ${e.players.length < 2 ? "disabled" : ""}>${st ? "作り直す" : "トーナメントを作る"}</button>
    </div>
    <details class="more" ${ui.moreOpen ? "open" : ""}><summary>細かい設定</summary>
      <div class="settings">
        <div class="field"><span>3位決定戦</span>
          <label class="check"><input type="checkbox" id="t-third" data-change="t-third" ${e.tThird ? "checked" : ""}>する</label>
        </div>
        <div class="field"><span>学校のばらし</span>
          <label class="check"><input type="checkbox" id="t-spread" data-change="spread" ${e.spreadSchools ? "checked" : ""}>同じ学校が早い回戦で当たらないようにする</label>
        </div>
      </div>
    </details>
    ${confirm ? `<div class="confirm" style="margin-top:14px"><span><b>トーナメントを作り直します。</b>組み合わせが変わり、入力したトーナメントの結果は消えます(リーグ戦の結果はそのまま)。</span><button class="btn btn-primary btn-sm" data-action="build-yes">作り直す</button><button class="btn btn-ghost btn-sm" data-action="cancel">やめる</button></div>` : ""}
  </section>`;
  if (!st) return settings;

  const pm = playerMap(e);
  const sel = st && ui.bmatch ? findNode(st, ui.bmatch) : null;
  const opts = st.slots.map((id, i) => (id ? `<option value="${i}">${i + 1}. ${esc(pname(e, pm[id]))}</option>` : "")).join("");
  return settings + `
  <section class="card">
    <div class="card-head"><div><h2>トーナメント表</h2><p class="faint">四角の数字が試合番号。押すとスコアを入れられます。勝ち上がった線が色つきになります。</p></div>
      <button class="btn btn-secondary btn-sm" data-action="copy-bracket">Excel用にコピー</button></div>
    <div class="ranks" id="branks">${ranksHTML(e, st)}</div>
    <div class="bracket-wrap"><div id="bracket-svg">${bracketSVG(e, st)}</div></div>
  </section>
  ${ui.copyText ? copyBoxHTML() : ""}
  <section class="card" id="bpanel">${bpanelHTML(e, st, sel)}</section>
  <section class="card">
    <div class="card-head"><div><h2>試合一覧</h2><p class="faint">試合番号の順。押すとスコア入力が開きます。</p></div></div>
    <div class="bm-list" id="bm-list">${bmListHTML(e, st)}</div>
  </section>
  <section class="card">
    <details class="more" style="margin:0;padding:0;border:0"><summary>組み合わせを手で入れ替える</summary>
      <p class="faint" style="margin:10px 0">2人(2組)を選んで場所を交換します。もう入れた結果は、同じ対戦が残っていればそのまま使われます。</p>
      <div class="row">
        <select class="select" id="swap-a" aria-label="入れ替える1つ目">${opts}</select>
        <span class="faint">と</span>
        <select class="select" id="swap-b" aria-label="入れ替える2つ目">${opts}</select>
        <button class="btn btn-secondary btn-sm" data-action="bswap">入れ替える</button>
      </div>
    </details>
  </section>`;
}

function ranksHTML(e, st) {
  const pm = playerMap(e);
  const f = st.final;
  const champ = st.champion && st.champion !== "?" ? st.champion : null;
  const runner = f.real && f.o && f.o.winner ? (f.o.winner === f.a ? f.b : f.a) : null;
  let thirds = [];
  if (st.third) { if (st.third.o && st.third.o.winner) thirds = [st.third.o.winner]; }
  else if (st.K >= 2) st.rounds[st.K - 2].forEach((s) => { if (s.real && s.o && s.o.winner) thirds.push(s.o.winner === s.a ? s.b : s.a); });
  const card = (label, id) => `<div class="rank-card"><span class="kicker">${label}</span><b>${id ? esc(pname(e, pm[id])) : "—"}</b>${id ? `<span class="pschool">${esc(pm[id].school)}</span>` : ""}</div>`;
  return card("優勝", champ) + card("準優勝", runner) + (thirds.length ? thirds.map((id) => card("3位", id)).join("") : card("3位", null));
}

function bracketSVG(e, st) {
  const pm = playerMap(e);
  const { N, K, rounds, slots } = st;
  const rowH = 28, colW = 46, gap = 170, top = 62;
  const nameW = isDbl(e) ? 260 : 210;
  const half = N / 2;
  const leafY = {};
  let maxRows = 0;
  [0, 1].forEach((h) => {
    let y = top;
    for (let s = h * half; s < (h + 1) * half; s++) if (slots[s]) { leafY[s] = y; y += rowH; }
    maxRows = Math.max(maxRows, (y - top) / rowH);
  });
  const W = 2 * (nameW + (K - 1) * colW) + gap;
  const cx = W / 2;
  const X = (h, r) => (h === 0 ? nameW + r * colW : W - (nameW + r * colW));
  const yOf = {};
  rounds.forEach((nodes, ri) => nodes.forEach((n) => {
    const ys = ri === 0 ? [leafY[2 * n.i], leafY[2 * n.i + 1]] : [yOf[rounds[ri - 1][2 * n.i].mid], yOf[rounds[ri - 1][2 * n.i + 1].mid]];
    const ok = ys.filter((v) => v != null);
    n.childY = ys;
    yOf[n.mid] = ok.length === 2 ? (ok[0] + ok[1]) / 2 : ok.length ? ok[0] : null;
  }));
  const bottom = top + maxRows * rowH;
  const thirdY = bottom + 46;
  const H = st.third ? thirdY + 30 : bottom + 14;
  let out = "";
  const box = (n, x, y) => {
    const cls = `bnode ${n.o && n.o.winner ? "done" : ""} ${ui.bmatch === n.mid ? "sel" : ""}`;
    return `<g class="${cls}" data-action="bpick" data-mid="${n.mid}" role="button" aria-label="第${n.num}試合"><rect x="${x - 14}" y="${y - 10}" width="28" height="20" rx="7"/><text x="${x}" y="${y + 4}">${n.num}</text></g>`;
  };
  const scoreLabel = (n, x, y) => (n.o && n.o.winner ? `<text class="bsc" x="${x}" y="${y - 6}">${scoreText(e, n.o)}</text>` : "");
  const hl = (n, childOut) => n.real && n.o && n.o.winner && n.o.winner === childOut;

  // 名前
  slots.forEach((id, s) => {
    if (!id) return;
    const h = s < half ? 0 : 1;
    const x = h === 0 ? nameW - 8 : W - nameW + 8;
    const champ = st.champion === id ? " champ" : "";
    out += `<text class="bt${champ}" x="${x}" y="${leafY[s] + 4}" text-anchor="${h === 0 ? "end" : "start"}">${esc(pname(e, pm[id]))}<tspan class="bs"> ${esc(pm[id].school)}</tspan></text>`;
  });
  // 決勝以外の回戦
  for (let ri = 0; ri < K - 1; ri++) {
    const per = rounds[ri].length;
    rounds[ri].forEach((n) => {
      const y = yOf[n.mid];
      if (y == null) return;
      const h = n.i < per / 2 ? 0 : 1;
      [0, 1].forEach((c) => {
        const cy = n.childY[c];
        if (cy == null) return;
        const childOut = ri === 0 ? slots[2 * n.i + c] : rounds[ri - 1][2 * n.i + c].out;
        out += `<path class="bl${hl(n, childOut) ? " hl" : ""}" d="M${X(h, ri)} ${cy}H${X(h, ri + 1)}V${y}"/>`;
      });
      if (n.real) {
        out += box(n, X(h, ri + 1), y);
        out += scoreLabel(n, X(h, ri + 1) + (h === 0 ? colW / 2 : -colW / 2), y);
      }
    });
  }
  // 決勝
  const f = st.final;
  const fy = yOf[f.mid];
  [0, 1].forEach((c) => {
    const cy = f.childY[c];
    if (cy == null) return;
    const childOut = K === 1 ? slots[c] : rounds[K - 2][c].out;
    out += `<path class="bl${hl(f, childOut) ? " hl" : ""}" d="M${X(c, K - 1)} ${cy}H${cx}V${fy}"/>`;
  });
  if (f.real) {
    out += box(f, cx, fy);
    out += `<text class="blabel" x="${cx}" y="22">決勝</text>`;
    if (st.champion && st.champion !== "?") out += `<text class="bchamp" x="${cx}" y="40">優勝 ${esc(pname(e, pm[st.champion]))}</text>`;
    out += scoreLabel(f, cx, fy + 30);
  }
  if (K >= 2) out += `<text class="blabel" x="${nameW / 2}" y="22">Aブロック</text><text class="blabel" x="${W - nameW / 2}" y="22">Bブロック</text>`;
  // 3位決定戦
  const t = st.third;
  if (t) {
    const nm = (id) => (id && id !== "?" ? esc(pname(e, pm[id])) : "(準決勝の敗者)");
    out += `<text class="blabel" x="${cx}" y="${thirdY - 20}">3位決定戦</text>
      <text class="bt" x="${cx - 70}" y="${thirdY + 4}" text-anchor="end">${nm(t.a)}</text>
      <text class="bt" x="${cx + 70}" y="${thirdY + 4}" text-anchor="start">${nm(t.b)}</text>
      <path class="bl${hl(t, t.a) ? " hl" : ""}" d="M${cx - 64} ${thirdY}H${cx}"/>
      <path class="bl${hl(t, t.b) ? " hl" : ""}" d="M${cx + 64} ${thirdY}H${cx}"/>
      ${box(t, cx, thirdY)}`;
  }
  return `<svg class="bracket-svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="トーナメント表">${out}</svg>`;
}

function sideName(e, n, side) {
  const id = side === 0 ? n.a : n.b;
  const pm = playerMap(e);
  if (id && id !== "?" && pm[id]) return { html: `<span class="pname">${pnameStack(e, pm[id])}</span><span class="pschool">${esc(pm[id].school)}</span>`, text: pname(e, pm[id]) };
  const s = sourceLabel(n, side);
  return { html: `<span class="pname faint">${s}</span>`, text: s };
}

function bmListHTML(e, st) {
  return bracketMatches(st).map((n) => {
    const A = sideName(e, n, 0), B = sideName(e, n, 1);
    const w = n.o && n.o.winner;
    const status = w ? `<span class="chip chip-ok num">${scoreText(e, n.o)}</span>` : n.o && n.o.started ? `<span class="chip chip-live">入力中</span>` : `<span class="chip">未</span>`;
    const nameA = w === n.a ? `<b>${esc(A.text)}</b>` : esc(A.text);
    const nameB = w === n.b ? `<b>${esc(B.text)}</b>` : esc(B.text);
    return `<button class="bm-row ${ui.bmatch === n.mid ? "is-sel" : ""}" data-action="bpick" data-mid="${n.mid}">
      <span class="bm-num">${n.num}</span><span class="bm-round">${n.label}</span>
      <span class="bm-vs">${nameA} <span class="faint">対</span> ${nameB}</span>${status}</button>`;
  }).join("");
}

function bpanelHTML(e, st, n) {
  if (!n) return `<p class="muted" style="margin:0">トーナメント表の試合番号か、下の試合一覧を押すと、ここでスコアを入れられます。</p>`;
  const A = sideName(e, n, 0), B = sideName(e, n, 1);
  const ready = n.a && n.a !== "?" && n.b && n.b !== "?";
  let inputs = "";
  if (ready) {
    const res = e.bracket.results[n.mid];
    const games = res && res.a === n.a && res.b === n.b ? res.g : [];
    for (let g = 0; g < e.games; g++) {
      const [x, y] = games[g] || [null, null];
      const bad = gameWarn(e, x, y);
      inputs += `<div class="game">${e.games > 1 ? `<span class="game-label">第${g + 1}G</span>` : ""}
        <input class="score ${bad ? "bad" : ""}" id="bs-${n.mid}-${g}-0" inputmode="numeric" autocomplete="off" maxlength="2" data-input="bscore" data-mid="${n.mid}" data-g="${g}" data-s="0" value="${x ?? ""}" aria-label="${esc(A.text)} 第${g + 1}ゲームの点数">
        <span class="faint">-</span>
        <input class="score ${bad ? "bad" : ""}" id="bs-${n.mid}-${g}-1" inputmode="numeric" autocomplete="off" maxlength="2" data-input="bscore" data-mid="${n.mid}" data-g="${g}" data-s="1" value="${y ?? ""}" aria-label="${esc(B.text)} 第${g + 1}ゲームの点数"></div>`;
    }
  }
  const w = n.o && n.o.winner;
  return `<div class="card-head"><div class="title-with-letter"><span class="league-letter" style="--lg:var(--accent);--on-lg:var(--accent-text);font-size:1.2rem">${n.num}</span><div><h2>第${n.num}試合</h2><span class="faint">${n.label}</span></div></div>
      <button class="btn btn-ghost btn-sm" data-action="bclose">閉じる</button></div>
    ${ready ? `<div class="match ${w ? "is-done" : ""}" id="bp-match">
      <div class="m-side a ${w === n.a ? "win" : ""}">${A.html}</div>
      <div class="m-scores">${inputs}</div>
      <div class="m-side b ${w === n.b ? "win" : ""}">${B.html}</div>
      <div class="m-status" id="bp-status">${bStatusChip(e, n)}</div>
    </div>` : `<p class="muted" style="margin:0">${esc(A.text)} 対 ${esc(B.text)}。前の試合の結果が入ると、対戦相手が決まります。</p>`}`;
}
function bStatusChip(e, n) {
  const res = e.bracket.results[n.mid];
  const games = res && res.a === n.a && res.b === n.b ? res.g : [];
  if (games.slice(0, e.games).some(([x, y]) => gameWarn(e, x, y))) return `<span class="chip chip-warn">点数を確認</span>`;
  if (n.o && n.o.winner) return `<span class="chip chip-ok">終了</span>`;
  if (n.o && n.o.started) return `<span class="chip chip-live">入力中</span>`;
  return `<span class="chip">未</span>`;
}

function refreshBracket(e, mid) {
  const st = bracketState(e);
  if (!st) return;
  const n = findNode(st, mid);
  const svg = document.getElementById("bracket-svg"); if (svg) svg.innerHTML = bracketSVG(e, st);
  const list = document.getElementById("bm-list"); if (list) list.innerHTML = bmListHTML(e, st);
  const ranks = document.getElementById("branks"); if (ranks) ranks.innerHTML = ranksHTML(e, st);
  const row = document.getElementById("bp-match");
  if (row && n) {
    const w = n.o && n.o.winner;
    row.classList.toggle("is-done", !!w);
    row.querySelector(".m-side.a").classList.toggle("win", w === n.a);
    row.querySelector(".m-side.b").classList.toggle("win", w === n.b);
    document.getElementById("bp-status").innerHTML = bStatusChip(e, n);
    const res = e.bracket.results[mid];
    const games = res ? res.g : [];
    row.querySelectorAll(".game").forEach((gEl, gi) => {
      const [x, y] = games[gi] || [null, null];
      gEl.querySelectorAll(".score").forEach((inp) => inp.classList.toggle("bad", gameWarn(e, x, y)));
    });
  }
  refreshHero(e);
}

function bracketTSV(e) {
  const st = bracketState(e);
  const lines = [`${e.name}\t${e.date}\tトーナメント`, ["試合番号", "回戦", "対戦1", "学校", "対戦2", "学校", "スコア", "勝者"].join("\t")];
  const pm = playerMap(e);
  bracketMatches(st).forEach((n) => {
    const A = sideName(e, n, 0), B = sideName(e, n, 1);
    const sa = pm[n.a] ? pm[n.a].school : "", sb = pm[n.b] ? pm[n.b].school : "";
    const w = n.o && n.o.winner;
    lines.push([n.num, n.label, A.text, sa, B.text, sb, w ? scoreText(e, n.o) : "", w ? pname(e, pm[w]) : ""].join("\t"));
  });
  return lines.join("\n");
}

function copyBoxHTML() {
  return `<section class="card copybox"><div class="card-head"><div><h3>コピー用テキスト</h3><p class="faint">自動でコピーできなかったので、下を全部選んでコピーし、Excel に貼り付けてください。</p></div><button class="btn btn-ghost btn-sm" data-action="close-copy">閉じる</button></div>
    <textarea class="input" id="copy-area" readonly>${esc(ui.copyText)}</textarea></section>`;
}

/* ============ Excel 用テキスト ============ */
function leagueTSV(e, li) {
  const l = e.leagues[li];
  const pm = playerMap(e);
  const s = standings(e, l);
  const anyDone = s.finished > 0;
  const lines = [`${letter(li)}リーグ`, [unit(e), "学校", ...l.playerIds.map((id) => pname(e, pm[id])), "勝", "敗", "得失ゲーム", "得失点", "順位"].join("\t")];
  s.rows.forEach((r) => {
    const cells = l.playerIds.map((cid) => {
      if (cid === r.id) return "＼";
      const o = outcome(e, r.id, cid);
      if (!o.winner) return "";
      return (o.winner === r.id ? "○" : "●") + scoreText(e, o);
    });
    lines.push([pname(e, r.p), r.p.school, ...cells, r.w, r.l, r.gw - r.gl, r.pf - r.pa, anyDone ? r.rank : ""].join("\t"));
  });
  return lines.join("\n");
}
function copyText(text) {
  const done = () => { ui.copyText = null; toast("コピーしました。Excel に貼り付けられます"); render(); };
  const fail = () => { ui.copyText = text; render(); const ta = document.getElementById("copy-area"); if (ta) { ta.focus(); ta.select(); } };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
    else fail();
  } catch (err) { fail(); }
}

/* ============ 取り込み・サンプル ============ */
const PAIR_SEP = /[・\/／&＆]/;
function parsePaste(text, dbl) {
  const out = [];
  text.split(/\r?\n/).forEach((line) => {
    if (!line.trim()) return;
    const sep = line.includes("\t") || line.includes(",") || line.includes("、");
    let cols = line.includes("\t") ? line.split("\t") : line.includes(",") ? line.split(",") : line.includes("、") ? line.split("、") : line.trim().split(/\s{2,}|　+/);
    if (cols.length === 1) cols = line.trim().split(/\s+/);
    cols = cols.map((c) => c.trim()).filter((c, i) => c !== "" || i < 2);
    if (!cols[0] || /^(名前|氏名|選手|ペア|1人目)/.test(cols[0])) return;
    if (dbl) { out.push(parsePairCols(cols, sep)); return; }
    // 「山田 太郎 桜ヶ丘高 8」のように名前に空白が入っているとき:最後が数字なら実力、その前が学校
    let level = 5;
    const last = cols[cols.length - 1];
    const lvNum = parseInt(String(last).replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)), 10);
    if (cols.length >= 2 && /^[0-9０-９]+$/.test(String(last))) { level = clamp(lvNum, 1, 10); cols = cols.slice(0, -1); }
    let name, school = "";
    if (cols.length >= 3 && !line.includes("\t") && !line.includes(",")) { school = cols[cols.length - 1]; name = cols.slice(0, -1).join(" "); }
    else { name = cols[0]; school = cols[1] || ""; }
    out.push({ id: uid(), name, name2: "", school, level });
  });
  return out;
}
/* ダブルス1行:「1人目 2人目 学校 実力」/「山田・佐藤 学校 実力」 */
function parsePairCols(cols, sep) {
  let level = 5;
  const last = String(cols[cols.length - 1]);
  if (cols.length >= 2 && /^[0-9０-９]+$/.test(last)) {
    level = clamp(parseInt(last.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)), 10), 1, 10);
    cols = cols.slice(0, -1);
  }
  let name = "", name2 = "", school = "";
  if (PAIR_SEP.test(cols[0])) {
    [name, name2] = cols[0].split(PAIR_SEP).map((s) => s.trim());
    school = cols.slice(1).join(" ");
  } else if (sep) {
    name = cols[0]; name2 = cols[1] || ""; school = cols[2] || "";
  } else {
    // スペース区切り:最後が学校。名前が4語なら「姓 名」×2
    const names = cols.length >= 3 ? cols.slice(0, -1) : cols;
    school = cols.length >= 3 ? cols[cols.length - 1] : "";
    if (names.length === 4) { name = names.slice(0, 2).join(" "); name2 = names.slice(2).join(" "); }
    else { name = names[0]; name2 = names.slice(1).join(" "); }
  }
  return { id: uid(), name, name2: name2 || "", school, level };
}

function makeSample(type) {
  if (type === "doubles") return makeDoublesSample();
  const data = [
    ["見本 一郎", "桜ヶ丘高", 9], ["見本 二郎", "港北高", 9], ["見本 三郎", "緑川高", 8], ["見本 四郎", "桜ヶ丘高", 8],
    ["見本 五郎", "青葉高", 8], ["見本 花子", "港北高", 7], ["見本 葵", "緑川高", 7], ["見本 蓮", "青葉高", 6],
    ["見本 陽菜", "桜ヶ丘高", 6], ["見本 湊", "港北高", 6], ["見本 結衣", "緑川高", 5], ["見本 大翔", "青葉高", 5],
    ["見本 凛", "桜ヶ丘高", 4], ["見本 悠真", "港北高", 4], ["見本 美咲", "緑川高", 3], ["見本 颯太", "青葉高", 3],
  ];
  const e = normalize({ name: "サンプル大会(練習用)", leagueCount: 4 });
  e.id = uid();
  e.players = data.map(([name, school, level]) => ({ id: uid(), name, school, level }));
  autoAssign(e);
  // 最初のリーグに少しだけ結果を入れておく
  const rr = roundRobin(e.leagues[0].playerIds);
  const sampleScores = [[21, 15], [18, 21], [21, 19]];
  rr[0].pairs.concat(rr[1] ? rr[1].pairs : []).slice(0, 3).forEach(([a, b], i) => {
    setScore(e, a, b, 0, 0, sampleScores[i][0]);
    setScore(e, a, b, 0, 1, sampleScores[i][1]);
  });
  return e;
}
function makeDoublesSample() {
  const data = [
    ["見本 一郎", "見本 二郎", "桜ヶ丘高", 9], ["見本 三郎", "見本 四郎", "港北高", 9], ["見本 五郎", "見本 六郎", "緑川高", 8],
    ["見本 花子", "見本 葵", "青葉高", 8], ["見本 蓮", "見本 湊", "桜ヶ丘高", 7], ["見本 陽菜", "見本 結衣", "港北高", 7],
    ["見本 大翔", "見本 悠真", "緑川高", 6], ["見本 凛", "見本 美咲", "青葉高", 5], ["見本 颯太", "見本 樹", "桜ヶ丘高", 5],
    ["見本 芽依", "見本 紬", "港北高", 4], ["見本 蒼", "見本 律", "緑川高", 4], ["見本 杏", "見本 澪", "青葉高", 3],
  ];
  const e = normalize({ name: "サンプル大会 ダブルス(練習用)", type: "doubles", games: 3, leagueCount: 3 });
  e.id = uid();
  e.players = data.map(([name, name2, school, level]) => ({ id: uid(), name, name2, school, level }));
  autoAssign(e);
  const [a, b] = roundRobin(e.leagues[0].playerIds)[0].pairs[0];
  [[21, 17], [19, 21], [21, 14]].forEach(([x, y], g) => { setScore(e, a, b, g, 0, x); setScore(e, a, b, g, 1, y); });
  return e;
}

function newEvent(players, opts) {
  const e = normalize(Object.assign({ name: players ? `${ev().name}(コピー)` : "新しい大会", date: today() }, opts || {}));
  e.id = uid();
  if (players) { e.players = clone(players); e.type = ev().type; e.mode = ev().mode; e.leagueCount = ev().leagueCount; e.games = ev().games; e.points = ev().points; }
  events[e.id] = e;
  openEvent(e.id);
  Store.save(e);
  render();
}
function openEvent(id) {
  currentId = id;
  Object.assign(ui, { view: "event", creating: false, showSettings: false, tab: "players", league: null, bmatch: null, confirm: null, copyText: null });
  window.scrollTo({ top: 0 });
}

/* ============ 操作 ============ */
app.addEventListener("click", (evt) => {
  const btn = evt.target.closest("[data-action]");
  if (!btn) return;
  const a = btn.dataset.action;
  const e = ev();
  switch (a) {
    case "tab": ui.tab = btn.dataset.tab; ui.confirm = null; ui.copyText = null; render(); window.scrollTo({ top: 0 }); break;
    case "home": Object.assign(ui, { view: "home", creating: false, confirm: null, copyText: null }); render(); window.scrollTo({ top: 0 }); break;
    case "open-event": openEvent(btn.dataset.id); render(); break;
    case "new-event": ui.view = "home"; ui.creating = true; render(); { const n = document.getElementById("c-name"); if (n) { n.scrollIntoView({ block: "center" }); n.focus({ preventScroll: true }); } } break;
    case "cancel-create": ui.creating = false; render(); break;
    case "create": {
      const pick = (name) => (document.querySelector(`input[name="${name}"]:checked`) || {}).value;
      const name = document.getElementById("c-name").value.trim() || "新しい大会";
      newEvent(null, { name, type: pick("c-type"), mode: pick("c-mode") });
      toast(`「${name}」を作りました。まず${unit(ev())}を入れてください`);
      break;
    }
    case "toggle-settings": ui.showSettings = !ui.showSettings; ui.confirm = null; render(); break;
    case "dup-event": newEvent(e.players); toast(`${unit(e)}をコピーした新しい大会を作りました`); break;
    case "sample": { const s = makeSample(btn.dataset.type); events[s.id] = s; openEvent(s.id); ui.tab = "matches"; Store.save(s); render(); break; }
    case "ask-del-event": ui.confirm = "del-event"; render(); break;
    case "del-event": { const id = e.id; delete events[id]; currentId = null; Object.assign(ui, { view: "home", confirm: null, showSettings: false }); Store.remove(id); render(); toast("大会を削除しました"); break; }
    case "cancel": ui.confirm = null; render(); break;
    case "import": {
      const box = document.getElementById("paste-box");
      const ps = parsePaste(box.value, isDbl(e));
      if (!ps.length) { toast("取り込める行がありませんでした"); break; }
      e.players.push(...ps); commit(); render(); toast(`${count(e, ps.length)}を追加しました`); break;
    }
    case "del-player": {
      const id = btn.dataset.id;
      e.players = e.players.filter((p) => p.id !== id);
      e.leagues.forEach((l) => (l.playerIds = l.playerIds.filter((x) => x !== id)));
      commit(); render(); break;
    }
    case "lc": e.leagueCount = clamp(e.leagueCount + Number(btn.dataset.d), 1, 26); commit(); render(); break;
    case "auto": if (e.leagues.length) { ui.confirm = "reassign"; render(); } else { autoAssign(e); commit(); render(); toast(`${e.leagues.length}つのリーグに分けました`); } break;
    case "auto-yes": ui.confirm = null; autoAssign(e); commit(); render(); toast(`${e.leagues.length}つのリーグに分け直しました`); break;
    case "pick-league": ui.league = btn.dataset.id; ui.copyText = null; render(); break;
    case "copy-league": { const li = e.leagues.findIndex((l) => l.id === btn.dataset.id); copyText(`${e.name}\t${e.date}\n` + leagueTSV(e, li)); break; }
    case "copy-all": copyText(`${e.name}\t${e.date}\n\n` + e.leagues.map((_, i) => leagueTSV(e, i)).join("\n\n")); break;
    case "close-copy": ui.copyText = null; render(); break;
    case "build":
      if (e.bracket) { ui.confirm = "rebuild"; render(); break; }
      if (buildBracket(e)) { ui.bmatch = null; commit(); render(); toast("トーナメントを作りました"); } else toast("出場者が2人(2組)以上必要です");
      break;
    case "build-yes":
      ui.confirm = null;
      if (buildBracket(e)) { ui.bmatch = null; commit(); render(); toast("トーナメントを作り直しました"); } else { render(); toast("出場者が2人(2組)以上必要です"); }
      break;
    case "bpick":
      ui.bmatch = btn.dataset.mid; render();
      { const p = document.getElementById("bpanel"); if (p) p.scrollIntoView({ block: "nearest", behavior: "smooth" }); const f = p && p.querySelector(".score"); if (f) f.focus({ preventScroll: true }); }
      break;
    case "bclose": ui.bmatch = null; render(); break;
    case "copy-bracket": copyText(bracketTSV(e)); break;
    case "bswap": {
      const i = Number(document.getElementById("swap-a").value), j = Number(document.getElementById("swap-b").value);
      if (i === j) { toast("別々の2人(2組)を選んでください"); break; }
      const s = e.bracket.slots;
      [s[i], s[j]] = [s[j], s[i]];
      commit(); render(); toast("入れ替えました"); break;
    }
  }
});

// 「細かい設定」の開閉は、描き直しても保つ
app.addEventListener("toggle", (evt) => { if (evt.target.matches && evt.target.matches("details.more")) ui.moreOpen = evt.target.open; }, true);

app.addEventListener("submit", (evt) => {
  if (evt.target.id !== "add-form") return;
  evt.preventDefault();
  const e = ev();
  const name = document.getElementById("new-name").value.trim();
  const school = document.getElementById("new-school").value.trim();
  const level = parseInt(document.getElementById("new-level").value, 10) || 5;
  const n2 = document.getElementById("new-name2");
  const name2 = n2 ? n2.value.trim() : "";
  if (!name) return;
  e.players.push({ id: uid(), name, name2, school, level });
  commit(); render();
  const s = document.getElementById("new-school"); if (s) s.value = school;
  const l = document.getElementById("new-level"); if (l) l.value = String(level);
  const n = document.getElementById("new-name"); if (n) n.focus();
  toast(`${name2 ? `${name}・${name2}` : name} を追加しました`);
});

app.addEventListener("change", (evt) => {
  const t = evt.target;
  const k = t.dataset.change;
  if (!k) return;
  if (k === "event-select") { currentId = t.value; ui.league = null; ui.confirm = null; ui.copyText = null; render(); return; }
  const e = ev();
  const p = t.dataset.id ? e.players.find((x) => x.id === t.dataset.id) : null;
  switch (k) {
    case "ev-name": e.name = t.value.trim() || "無題の大会"; commit(); render(); break;
    case "ev-date": e.date = t.value; commit(); render(); break;
    case "ev-games": e.games = Number(t.value) === 3 ? 3 : 1; commit(); render(); break;
    case "ev-points": e.points = Number(t.value); commit(); render(); break;
    case "ev-mode": e.mode = MODES[t.value] ? t.value : "league"; commit(); render(); break;
    case "t-top": e.tTop = clamp(Number(t.value), 1, 4); commit(); break;
    case "t-third": e.tThird = t.checked; commit(); render(); break;
    case "ev-type": e.type = t.value === "doubles" ? "doubles" : "singles"; commit(); render(); break;
    case "p-name": if (p) { p.name = t.value.trim(); commit(); } break;
    case "p-name2": if (p) { p.name2 = t.value.trim(); commit(); } break;
    case "p-school": if (p) { p.school = t.value.trim(); commit(); } break;
    case "p-level": if (p) { p.level = clamp(Number(t.value), 1, 10); commit(); render(); } break;
    case "spread": e.spreadSchools = t.checked; commit(); render(); break;
    case "tolerance": e.tolerance = Number(t.value); commit(); break;
    case "move": {
      const to = Number(t.value);
      e.leagues.forEach((l) => (l.playerIds = l.playerIds.filter((x) => x !== t.dataset.id)));
      if (to >= 0 && e.leagues[to]) {
        const pm = playerMap(e);
        const l = e.leagues[to];
        l.playerIds.push(t.dataset.id);
        l.playerIds.sort((x, y) => pm[y].level - pm[x].level);
      }
      commit(); render(); break;
    }
  }
});

app.addEventListener("input", (evt) => {
  const t = evt.target;
  if (t.dataset.input !== "score" && t.dataset.input !== "bscore") return;
  const clean = t.value.replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0)).replace(/[^0-9]/g, "").slice(0, 2);
  if (clean !== t.value) t.value = clean;
  const e = ev();
  const val = clean === "" ? null : clamp(parseInt(clean, 10), 0, 99);
  if (t.dataset.input === "bscore") {
    const n = findNode(bracketState(e), t.dataset.mid);
    if (!n) return;
    setBScore(e, n, Number(t.dataset.g), Number(t.dataset.s), val);
    commit();
    refreshBracket(e, t.dataset.mid);
    return;
  }
  setScore(e, t.dataset.a, t.dataset.b, Number(t.dataset.g), Number(t.dataset.s), val);
  commit();
  refreshMatch(e, t.dataset.a, t.dataset.b);
});

/* ============ テーマ・背景 ============ */
const root = document.documentElement;
try { const th = localStorage.getItem("arca-league-theme"); if (th === "dark" || th === "light") root.dataset.theme = th; } catch (e) {}
document.getElementById("theme-toggle").addEventListener("click", () => {
  const isDark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = isDark ? "light" : "dark";
  try { localStorage.setItem("arca-league-theme", root.dataset.theme); } catch (e) {}
});
let ticking = false;
addEventListener("scroll", () => {
  if (ticking) return;
  ticking = true;
  requestAnimationFrame(() => {
    const max = Math.max(1, document.documentElement.scrollHeight - innerHeight);
    root.style.setProperty("--scroll", (scrollY / max).toFixed(4));
    ticking = false;
  });
}, { passive: true });

/* ============ 起動 ============ */
(async () => {
  await Store.init();
  events = await Store.loadAll();
  ready = true;
  ui.saveState = Store.db ? "saved" : "local";
  ensureCurrent();
  render();
  Store.subscribe();
})();
})();
</script>
